/* ═══════════ api ═══════════ */
const photoQuery = (p, date, slot) =>
  `/api/photos?profile=${encodeURIComponent(p)}&date=${encodeURIComponent(date)}&slot=${encodeURIComponent(slot)}`;

// A frame is stored twice; this is how a caller says which one it is drawing.
const THUMB = 'thumb';

// A failed load used to surface as a flat "Server unreachable", which covers
// three very different faults: no network, the /api routes not deployed, and
// the database being unconfigured or down. Carry the server's own message
// through so the toast says which one it is. /api/health has the full detail.
async function reason(r, fallback){
  try{
    const j = await r.json();
    return j.error || fallback;
  }catch(_){ return fallback; }
}

const api = {
  async getState(){
    let r;
    try{
      r = await fetch('/api/state');
    }catch(_){ throw new Error('No connection'); }

    if(!r.ok) throw new Error(await reason(r, `Server error ${r.status}`));

    // A deploy without the serverless functions answers /api/state with the
    // HTML shell, which would otherwise fail as an opaque JSON parse error.
    if(!(r.headers.get('content-type') || '').includes('json'))
      throw new Error('API routes not deployed');

    return r.json();
  },
  async saveDay(profileId, date, tasks){
    const r = await fetch('/api/state', { method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ profileId, date, tasks }) });
    if(!r.ok) throw new Error('save');
  },
  async getReactions(){
    const r = await fetch('/api/reactions');
    if(!r.ok) throw new Error('reactions');
    return r.json();
  },
  async react(from, to, date, emoji){
    const r = await fetch('/api/reactions', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ from, to, date, emoji }) });
    if(!r.ok) throw new Error('react');
    return r.json();
  },
  async searchMusic(q){
    const r = await fetch(`/api/music?q=${encodeURIComponent(q)}`);
    if(!r.ok) throw new Error('music');
    return r.json();
  },
  async lookupTrack(id){
    const r = await fetch(`/api/music?id=${encodeURIComponent(id)}`);
    if(!r.ok) throw new Error('music');
    return r.json();
  },
  /* `me` is who's asking: the reactions come back aggregated, with a `mine`
     flag the server works out, so the browser never sees who left what. */
  async getComments(me){
    const r = await fetch(`/api/comments?me=${encodeURIComponent(me || '')}`);
    if(!r.ok) throw new Error('comments');
    return r.json();
  },
  // parentId is the comment being answered, or null for a new line in the thread
  async addComment(from, to, date, slot, body, parentId = null){
    const r = await fetch('/api/comments', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ from, to, date, slot, body, parentId }) });
    if(!r.ok) throw new Error('comment');
    return r.json();
  },
  async deleteComment(id, from){
    const r = await fetch(`/api/comments?id=${encodeURIComponent(id)}&from=${encodeURIComponent(from)}`,
      { method:'DELETE' });
    if(!r.ok) throw new Error('uncomment');
    return r.json();
  },
  /* An emoji on one line of a thread. Sending the same one twice takes it back
     — the server's primary key is the toggle, so this never says which way.
     The server's own words carry through: the one refusal worth reading is
     "that's enough reactions on one comment". */
  async reactToComment(from, commentId, emoji){
    const r = await fetch('/api/comment-reactions', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ from, commentId, emoji }) });
    if(!r.ok) throw new Error(await reason(r, 'Reaction failed'));
    return r.json();
  },
  async uploadPhoto(profileId, date, slot, contentType, dataBase64, thumbBase64){
    const r = await fetch(photoQuery(profileId, date, slot),
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ profileId, date, slot, contentType, dataBase64, thumbBase64 }) });
    if(!r.ok) throw new Error('upload');
  },
  /* Fills in the small rendition of a frame that predates it. No image bytes
     go the other way — the server keeps the full one it already has. */
  async fillThumb(profileId, date, slot, thumbBase64){
    const r = await fetch(photoQuery(profileId, date, slot),
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ profileId, date, slot, thumbBase64 }) });
    if(!r.ok) throw new Error('thumb');
  },
  async deletePhoto(profileId, date, slot){
    const r = await fetch(photoQuery(profileId, date, slot), { method:'DELETE' });
    if(!r.ok) throw new Error('delete');
  },
  /* `size` picks the rendition: THUMB for anything drawn small, nothing for
     the frame itself. Both are cached under their own URL, so a tile you have
     already seen stays free even after you open it full screen. */
  photoUrl(profileId, date, slot, size){
    const v = state.photoV[`${profileId}|${date}|${slot}`] || 0;
    return `${photoQuery(profileId, date, slot)}&v=${v}${size ? `&size=${size}` : ''}`;
  }
};

/* ═══════════ state ═══════════ */
const state = {
  startDate:null,
  data:{ sachin:{}, aarya:{} },
  // { sachin: { '2026-08-02': ['day','read'] }, aarya: {…} }
  photos:{ sachin:{}, aarya:{} },
  photoV:{},
  // ['sachin|2026-08-02|day', …] — frames still carrying only the full image
  needThumb:[],
  reactions:[],
  // [{ id, from, to, date, slot, body, parent, at }] — one thread per feed post,
  // `parent` naming the comment a reply answers (null at the top level)
  comments:[],
  // [{ comment, from, token }] — the marks left on individual comments
  commentReactions:[],
  me: localStorage.getItem('me') || null,
  tab:'today',
  wallView:'both',
  online:true
};

/*
 * One <audio> element for the whole app.
 *
 * iOS grants permission to play to an *element* the user has interacted with,
 * not to the page, so there is exactly one and every track change is a src swap
 * on it. The first tap on a track row spends the gesture; everything after —
 * scrolling to the next day, coming back to the tab — rides that unlock.
 *
 * Sound starts off on every load, which is both unavoidable (a fresh page has
 * no gesture to spend) and what anyone who has used a feed expects.
 */
const music = {
  el:null,
  // Wanting sound is a setting, not a per-visit decision: the feed plays by
  // default and stays muted if you muted it. Only an explicit tap writes here.
  on: localStorage.getItem('musicOff') !== '1',
  at:null,        // 'profile|iso' of the post on screen
  loaded:null,    // src currently in the element
  fade:null,
  raf:null,       // pending scroll frame, cancelled when the feed goes away
  armed:false,    // waiting on a gesture to satisfy iOS
  /*
   * Sound was wanted and didn't happen — autoplay refused, or the preview URL
   * is dead. Kept apart from `on`, which is the preference and stays true: the
   * chip has to show a mute glyph either way, but a tap means "start" here and
   * "stop" when the preference itself is off.
   */
  blocked:false,
  shown:false,    // chip in its loud state
  reveal:null     // timer that retires it
};

/* Long enough to read on the way past, short enough not to sit on the frame. */
const SND_HOLD = 2000;

const me   = () => state.me;
const them = () => state.me === 'sachin' ? 'aarya' : 'sachin';
const nameOf = id => PROFILES.find(p => p.id === id).label;
const whoAttr = id => id === me() ? 'you' : 'them';

/* ═══════════ dates (local, never UTC) ═══════════ */
function isoOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayISO(){ return isoOf(new Date()); }
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function dayIndex(iso){ return Math.round((parseISO(iso) - parseISO(state.startDate))/86400000) + 1; }
function isoForDay(n){ return addDays(state.startDate, n-1); }
function todayIndex(){ return dayIndex(todayISO()); }
function fmtDate(iso){
  return parseISO(iso).toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });
}
function msToMidnight(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate()+1) - n;
}
function fmtLeft(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m ${String(s).padStart(2,'0')}s`;
}
/* Compact age for a comment: Now, 12m, 5h, 3d, then a plain date. */
function fmtAgo(ts){
  const t = new Date(ts).getTime();
  if(!t) return '';
  const s = Math.max(0, (Date.now() - t)/1000);
  if(s < 90) return 'Now';
  if(s < 3600) return `${Math.floor(s/60)}m`;
  if(s < 86400) return `${Math.floor(s/3600)}h`;
  if(s < 604800) return `${Math.floor(s/86400)}d`;
  return new Date(t).toLocaleDateString(undefined,{ month:'short', day:'numeric' });
}

/* Comments are the only free text in the app — never interpolate one raw. */
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ── emoji ── */
/*
 * A reaction is whatever comes off the keyboard, so "is this one emoji" is the
 * only rule there is — and it has to be the same rule the server applies, or
 * the thread shows something the database refused.
 *
 * `\p{RGI_Emoji}` under the v flag is that test: one well-formed emoji, skin
 * tones, keycaps, flags and family sequences included; not text, not two of
 * them. Older engines don't know the flag, so fall back to a coarser shape
 * check and let the server have the final word.
 */
let ONE_EMOJI = null;
try{ ONE_EMOJI = new RegExp('^\\p{RGI_Emoji}$', 'v'); }catch(_){}
const isEmoji = s => typeof s === 'string' && !!s && (ONE_EMOJI
  ? ONE_EMOJI.test(s)
  : /\p{Extended_Pictographic}/u.test(s) && [...s].length <= 12);


/*
 * What the strip offers. Seven or eight are on screen at a time and the rest
 * are a flick away — one row that scrolls, rather than a panel to open or a
 * keyboard to switch to. The order is the point: whatever you reach for climbs
 * to the front and stays there, so within a week the visible part of the row
 * is the two of you and the rest is a reserve you rarely need.
 *
 * Enough to say anything that gets said about a workout, a meal or a bad day,
 * and short enough to stay a list rather than become a keyboard.
 */
const RX_SET = [
  '❤️','🔥','💪','👏','🙌','😂','🫡','👀',
  '😮','🤝','🙏','👊','💯','⚡','🏆','⭐',
  '😍','🥵','🥶','😅','😭','🤣','😎','🤘',
  '🫶','✨','🎯','📈','🚀','🧊','💧','🍗',
  '🥗','🏃','🚴','🏋️','😤','🤯','🥹','😴'
];
// how many of them the recents can take over
const RX_SLOTS = 8;
const rxRecent = () => {
  try{ return (JSON.parse(localStorage.getItem('rxRecent') || '[]') || []).filter(isEmoji); }
  catch(_){ return []; }
};
// the whole row: what you reach for, then everything else, nothing twice
const rxQuick = () => {
  const seen = new Set(), out = [];
  for(const e of [...rxRecent(), ...RX_SET]){
    if(seen.has(e)) continue;
    seen.add(e);
    out.push(e);
  }
  return out;
};
function rememberRx(e){
  try{
    localStorage.setItem('rxRecent',
      JSON.stringify([e, ...rxRecent().filter(x => x !== e)].slice(0, RX_SLOTS)));
  }catch(_){}
}

/* ═══════════ selectors ═══════════ */
const entryOf = (p, iso) => state.data[p]?.[iso] || {};

const AUTO_TASKS = TASKS.filter(t => t.auto).map(t => t.id);

/*
 * Create a day's record pre-ticked for the auto tasks, if it doesn't exist yet.
 * Returns true when it actually created one, so callers know to persist it.
 *
 * Deliberately not a read-time default: deriving "blank means done" would
 * retroactively credit every untouched day in the challenge, including days
 * nobody opened the app. Seeding on check-in keeps a skipped day honestly at
 * 0/5 and leaves history alone.
 */
function seedDay(p, iso){
  const days = (state.data[p] ||= {});
  const entry = (days[iso] ||= {});
  let changed = false;
  for(const id of AUTO_TASKS){
    // only an absent key seeds — an explicit false is you recording a failure
    if(entry[id] === undefined){ entry[id] = true; changed = true; }
  }
  return changed;
}
const doneCount = (p, iso) => TASKS.reduce((n,t) => n + (entryOf(p,iso)[t.id] ? 1 : 0), 0);
const isComplete = (p, iso) => doneCount(p, iso) === TASKS.length;
/* ── water ── */
// Days ticked before the meter existed carry `water:true` and no ounces —
// read those as a full gallon so the gauge agrees with the checkbox.
const waterOz = (p, iso) => {
  const e = entryOf(p, iso);
  if(e.waterOz != null) return Number(e.waterOz) || 0;
  return e.water ? WATER_GOAL_OZ : 0;
};
const waterLog = (p, iso) => entryOf(p, iso).waterLog || [];

/* A written note is the alternative to a photo — say what you did instead of
   showing it. Lives in the existing tasks JSONB, so no schema change. */
const noteOf = (p, iso, id) => ((entryOf(p, iso).notes || {})[id] || '').trim();

/*
 * A caption belongs to one photo and is keyed by that photo's own slot, riding
 * the same JSONB as notes: `{ 'diet#1750…': { nm:'Blueberries', v:'loved' } }`.
 * `v` is the verdict, and only a meal slot ever carries one — "what was it" and
 * "was it any good" are both worth recording about food; a run needs no rating.
 *
 * Read through `caps`, falling back to `meals`, which is where captions lived
 * when they were diet-only. A day rewrites itself to `caps` the next time it is
 * saved, so the fallback empties itself out.
 */
const isMealSlot = s => MEAL_SLOTS.includes(slotBase(s));
const capOf = (p, iso, slot) => {
  const e = entryOf(p, iso);
  return (e.caps || {})[slot] || (e.meals || {})[slot] || null;
};
/*
 * What a photo says. Its own caption first; failing that, the written note its
 * task already carries — a workout note *is* the caption for its photo, and
 * asking for the same sentence twice would be daft. Only a single-photo task
 * can lend one, so a day of meals never shares a caption between frames.
 */
const capText = (p, iso, slot) => {
  const own = (capOf(p, iso, slot)?.nm || '').trim();
  if(own) return own;
  const t = TASKS.find(x => x.id === slotBase(slot));
  return t && t.note && !t.multi ? noteOf(p, iso, t.id) : '';
};
const capVerdict = (p, iso, slot) => (isMealSlot(slot) && capOf(p, iso, slot)?.v) || '';

// every captioned meal of a day, oldest first, for the Diet row summary
const mealsOf = (p, iso) => MEAL_SLOTS.flatMap(id => photosOf(p, iso, id))
  .map(slot => ({ slot, nm: capText(p, iso, slot), v: capVerdict(p, iso, slot) }))
  .filter(m => m.nm);

/* The track attached to a post — one per person per day, in the same JSONB.
   `{ id, nm, ar, art, url }`: enough to render the row and stream the preview,
   and the id re-resolves the URL if Apple rotates it. */
const trackOf = (p, iso) => {
  const t = entryOf(p, iso).track;
  return t && t.url && t.nm ? t : null;
};

const verdictDot = v => v ? `<i class="vd ${v}" aria-hidden="true"></i>` : '';

/* What a frame is called, in plain text, for alt and aria. */
const frameTitle = (p, iso, slot) => capText(p, iso, slot) || slotLabel(slot);

/* The day sheet's gallery gives each photo one line, so it shows whichever says
   more: the caption if there is one, else the task it belongs to. */
const frameCaption = (p, iso, slot) => {
  const cap = capText(p, iso, slot);
  return `${verdictDot(capVerdict(p, iso, slot))}<span class="tx">${esc(cap || slotLabel(slot))}</span>`;
};

/* The viewer has room for both, so it keeps the task as an eyebrow and gives
   the caption a line of its own underneath. */
const frameTag = (p, iso, slot) =>
  `${verdictDot(capVerdict(p, iso, slot))}<span class="tx">${esc(slotLabel(slot))}</span>`;
// the bar can only fill once, but the number should tell the truth
const waterPct    = (p, iso) => Math.min(100, waterPctRaw(p, iso));
const waterPctRaw = (p, iso) => Math.round(waterOz(p, iso) / WATER_GOAL_OZ * 100);
const waterOver   = (p, iso) => Math.max(0, waterOz(p, iso) - WATER_GOAL_OZ);

/* Vessels are personal kit, not shared progress, so they live on the device. */
function vessels(){
  try{
    const v = JSON.parse(localStorage.getItem('vessels:' + me()));
    if(Array.isArray(v) && v.length) return v;
  }catch(_){}
  return DEFAULT_VESSELS.map(v => ({ ...v }));
}
function saveVessels(list){
  localStorage.setItem('vessels:' + me(), JSON.stringify(list));
}

/* Slots for one person on one day, in carousel order. */
const slotsFor = (p, iso) => (state.photos[p]?.[iso] || [])
  .filter(isKnownSlot)
  .sort((a, b) =>
    SLOT_ORDER.indexOf(slotBase(a)) - SLOT_ORDER.indexOf(slotBase(b)) ||
    slotStamp(a) - slotStamp(b));

// every shot a task holds that day, oldest first
const photosOf = (p, iso, taskId) =>
  slotsFor(p, iso).filter(s => slotBase(s) === taskId);
/*
 * Keep only slots the app still knows about. Retiring a slot (water carried a
 * camera once) leaves its rows in the database; unfiltered they would be
 * invisible in the feed while photoCount and the Rivals tally kept counting
 * them — a photo marker on the Wall pointing at something you can't open.
 */
function knownPhotos(byProfile){
  const out = { sachin:{}, aarya:{} };
  for(const p of Object.keys(out)){
    for(const [iso, slots] of Object.entries(byProfile?.[p] || {})){
      const keep = (slots || []).filter(isKnownSlot);
      if(keep.length) out[p][iso] = keep;
    }
  }
  return out;
}

const hasPhoto = (p, iso, slot) => (state.photos[p]?.[iso] || []).includes(slot);
const photoCount = (p, iso) => (state.photos[p]?.[iso] || []).length;
const totalPhotos = p => Object.values(state.photos[p] || {}).reduce((n, a) => n + a.length, 0);

function addPhotoLocal(p, iso, slot){
  const byDay = (state.photos[p] ||= {});
  const list = (byDay[iso] ||= []);
  if(!list.includes(slot)) list.push(slot);
  state.photoV[`${p}|${iso}|${slot}`] = Date.now();
}
function removePhotoLocal(p, iso, slot){
  const list = state.photos[p]?.[iso];
  if(!list) return;
  const i = list.indexOf(slot);
  if(i >= 0) list.splice(i, 1);
  if(!list.length) delete state.photos[p][iso];
}

function streak(p){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  let n = 0;
  for(let d = ti; d >= 1; d--){
    if(isComplete(p, isoForDay(d))) n++;
    else if(d === ti) continue;
    else break;
  }
  return n;
}
function bestStreak(p){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  let best = 0, run = 0;
  for(let d = 1; d <= ti; d++){
    if(isComplete(p, isoForDay(d))){ run++; best = Math.max(best, run); } else run = 0;
  }
  return best;
}
function totalComplete(p){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  let n = 0;
  for(let d = 1; d <= ti; d++) if(isComplete(p, isoForDay(d))) n++;
  return n;
}
function taskRate(p, taskId){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  if(ti < 1) return 0;
  let n = 0;
  for(let d = 1; d <= ti; d++) if(entryOf(p, isoForDay(d))[taskId]) n++;
  return Math.round(n/ti*100);
}
const kudosCount = (to, date) => state.reactions.filter(r => r.to === to && r.date === date).length;
const iGaveKudos = (to, date) => state.reactions.some(r => r.to === to && r.date === date && r.from === me());

/* ── comments ── */
/*
 * Both lists are read far more often than they change, and always by the same
 * two keys — a thread by (owner, day), a comment's reactions by its id. Asked
 * as a filter, each question is a scan: the feed asks two per post across 75
 * posts, and a thread asks one per reaction pill it draws, so a repaint used
 * to walk the whole history a few hundred times over.
 *
 * So walk it once instead. These are rebuilt in a single pass whenever either
 * list changes — which is on load, and on the one comment or reaction you just
 * touched — and every question after that is a lookup.
 */
let cmtByThread = new Map();   // `${owner}|${date}` → that day's comments, oldest first
let rxByComment = new Map();   // comment id → [{ e, n, mine, at }], most-reacted first
let cmtById = new Map();       // comment id → the comment, for replies and What's new

function indexComments(){
  cmtByThread = new Map();
  cmtById = new Map();
  for(const c of state.comments){
    const k = `${c.to}|${c.date}`;
    const at = cmtByThread.get(k);
    if(at) at.push(c); else cmtByThread.set(k, [c]);
    cmtById.set(c.id, c);
  }
  rxByComment = new Map();
  for(const r of state.commentReactions){
    const at = rxByComment.get(r.c);
    if(at) at.push(r); else rxByComment.set(r.c, [r]);
  }
}

// One shared empty result for every miss, rather than a fresh [] per question.
// Nothing ever writes through a selector, so there is nothing to share wrongly.
const NONE = Object.freeze([]);

// A thread belongs to a post — one person's photos on one day. Either of you can
// write in it, so replies on your own frame land in the same place.
const commentsOn = (to, date) => cmtByThread.get(`${to}|${date}`) || NONE;
const commentCount = (to, date) => commentsOn(to, date).length;
const lastCommentOn = (to, date) => { const l = commentsOn(to, date); return l[l.length - 1] || null; };

/*
 * A comment's reactions, already counted. The server sends one entry per
 * (comment, emoji) — the shape a pill is drawn from — ordered by how many
 * people left it, so a row draws them the same way on both phones.
 */
const rxOn = id => rxByComment.get(id) || NONE;
const rxAt = (id, emoji) => rxOn(id).find(r => r.e === emoji) || null;
const iReacted = (id, emoji) => !!rxAt(id, emoji)?.mine;

/*
 * Move a count without asking the server again. `mine` is the only thing the
 * aggregate loses, and it is the only thing this needs to set: with two people
 * on the challenge, everyone else's share of a count is whatever is left.
 */
function bumpRx(id, emoji, on){
  const list = state.commentReactions;
  const i = list.findIndex(r => r.c === id && r.e === emoji);
  if(on){
    if(i < 0) list.push({ c:id, e:emoji, n:1, mine:true });
    else { list[i].n++; list[i].mine = true; }
  }else if(i >= 0){
    list[i].n--;
    list[i].mine = false;
    if(list[i].n <= 0) list.splice(i, 1);
  }
  indexComments();
}

/* The feed dot: kudos landed on you, anything the other person has said, or a
   reaction they left on something you said. */
const kudosToMe = () => state.reactions.filter(r => r.to === me() && r.from !== me()).length;
const commentsFromThem = () => state.comments.filter(c => c.from !== me()).length;
// their share of a count is the count less your own one, if you are in it
const rxToMe = () => {
  let n = 0;
  for(const c of state.comments){
    if(c.from !== me()) continue;
    for(const r of rxOn(c.id)) n += r.n - (r.mine ? 1 : 0);
  }
  return n;
};
const seenCount = k => Number(localStorage.getItem(k) || 0);
function feedBadge(){
  return kudosToMe() > seenCount('kudosSeen')
      || commentsFromThem() > seenCount('cmtSeen')
      || rxToMe() > seenCount('crxSeen');
}
function markFeedSeen(){
  localStorage.setItem('kudosSeen', String(kudosToMe()));
  localStorage.setItem('cmtSeen', String(commentsFromThem()));
  localStorage.setItem('crxSeen', String(rxToMe()));
}

/* ── what's new ── */
/*
 * Everything the other person has done to you, newest first. Built entirely
 * from what the app already has in memory — there is no fourth table and no
 * fourth request behind this, because a push notification you swiped away and
 * a row in this list are the same event, and the event is already here.
 *
 * A reaction knows *when* but not *who*, because the payload is aggregated to
 * a count. With two people on the challenge that is not a gap: a count with
 * one of them yours leaves exactly one person it could have been.
 */
function activity(){
  const you = me();
  if(!you) return [];
  const out = [];

  for(const c of state.comments){
    if(c.from === you) continue;
    const parent = c.parent == null ? null : cmtById.get(c.parent);
    // Yours either because it landed on your day or because it answers
    // something you said. A reply to their own line, in your thread, is still
    // your business — it is a conversation happening under your photograph.
    const mine = parent && parent.from === you;
    if(!mine && c.to !== you) continue;
    out.push({ kind: mine ? 'reply' : parent ? 'answer' : 'comment',
               at: c.at, who: c.from,
               body: c.body, prof: c.to, date: c.date, slot: c.slot });
  }

  for(const r of state.commentReactions){
    if(r.n - (r.mine ? 1 : 0) <= 0) continue;   // only yours on it
    const c = cmtById.get(r.c);
    if(!c || c.from !== you) continue;
    out.push({ kind:'reaction', at: r.at, who: them(), emoji: r.e,
               body: c.body, prof: c.to, date: c.date, slot: c.slot });
  }

  for(const k of state.reactions){
    if(k.to !== you || k.from === you) continue;
    out.push({ kind:'kudos', at: k.at || `${k.date}T12:00:00Z`, who: k.from,
               prof: k.to, date: k.date, slot: DAY_SLOT });
  }

  return out
    .sort((a, b) => new Date(b.at) - new Date(a.at))
    // a feed is 75 days long; a list of what happened is not
    .slice(0, 40);
}

const NEWS_SEEN = 'newsSeen';
const newsUnread = () => {
  const seen = localStorage.getItem(NEWS_SEEN) || '';
  return activity().filter(a => String(a.at) > seen).length;
};
const markNewsSeen = () => {
  const top = activity()[0];
  if(top) localStorage.setItem(NEWS_SEEN, String(top.at));
};

/* ═══════════ fx ═══════════ */
function haptic(ms = 10){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(_){} }
let toastT;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 1900);
}

/* ═══════════ music ═══════════ */
function musicEl(){
  if(music.el) return music.el;

  /*
   * Safari starts a page's audio session as "ambient", which is the category
   * the ring/silent switch silences — the same bucket as alerts and game
   * effects. A song on a feed is media playback, so say so, and the switch
   * stops muting it. Safari-only and still a draft, hence the guard; where it
   * doesn't exist nothing changes and a silenced phone stays silent.
   *
   * Set here rather than on load: the session only becomes ours once there is
   * actually something to play, so an app that never plays music never claims
   * to be a media app.
   */
  try{
    if('audioSession' in navigator) navigator.audioSession.type = 'playback';
  }catch(_){}

  const a = document.createElement('audio');
  a.loop = true;              // a 30s clip should outlast looking at the day
  a.preload = 'none';
  a.setAttribute('playsinline', '');
  a.volume = 0;

  /* The chip follows the element, not our hopes for it, so anything that
     starts or kills playback behind our back still ends up on screen. */
  a.addEventListener('playing', () => {
    if(!music.blocked) return;
    music.blocked = false;
    revealSnd();              // the moment it goes audible is worth showing
  });
  a.addEventListener('error', () => {
    /*
     * Apple's preview URLs go stale, and a track saved months ago can simply
     * stop resolving. That is silence with a reason, and the chip is where the
     * reason gets stated. Ignored while the picker is auditioning, which
     * borrows this element and clears `loaded` to say so.
     */
    const t = wantedTrack();
    if(!t || music.loaded !== t.url) return;
    music.blocked = true;
    revealSnd();
  });

  music.el = a;
  return a;
}

/* Ramping rather than cutting: a hard start on a 30s clip sounds like a mistake. */
function fadeTo(target, ms = 260){
  const a = musicEl();
  clearInterval(music.fade);
  const from = a.volume;
  const steps = Math.max(1, Math.round(ms / 40));
  let i = 0;
  music.fade = setInterval(() => {
    i++;
    a.volume = Math.min(1, Math.max(0, from + (target - from) * (i / steps)));
    if(i >= steps){ clearInterval(music.fade); music.fade = null; }
  }, 40);
}

/*
 * Sound comes out of the feed, only from the post on screen, and only if it was
 * asked for. Stated once here so no caller has to remember all three — a stray
 * call from anywhere else is simply a no-op.
 */
const musicWanted = () => music.on && !!music.at && state.tab === 'feed';

/* The track that should be sounding right now, if any. */
function wantedTrack(){
  if(!musicWanted()) return null;
  return trackOf(music.at.split('|')[0], music.at.split('|')[1]);
}

/* Bring the element in line with "what's on screen" and "do they want sound". */
function musicApply(){
  const a = musicEl();
  const t = wantedTrack();

  if(!t){
    // Fade, then stop — a day with no song leaves silence, not a muted track
    // still running. Re-checked at the end, since the fade is long enough for
    // the answer to have changed.
    if(!a.paused){ fadeTo(0, 180); setTimeout(() => { if(!wantedTrack()) a.pause(); }, 200); }
    paintTrackRows();
    return;
  }

  if(music.loaded !== t.url){
    a.src = t.url;
    music.loaded = t.url;
    a.currentTime = 0;
    a.volume = 0;
  }
  // play() stays synchronous with the tap that called it — that's the unlock
  const started = a.play();
  if(started && started.catch){
    started.then(() => { music.blocked = false; fadeTo(1); paintSnds(); })
           .catch(armForGesture);
  }
  paintTrackRows();
}

/*
 * A page that has just loaded has no gesture to spend, so the first attempt at
 * autoplay is refused. Rather than give up and call it muted, wait for the
 * next touch anywhere — a scroll of the feed counts — and start then. The
 * preference is untouched: the listener never asked for silence.
 *
 * The frame is silent in the meantime either way, though, and that is the
 * confusion the chip exists to answer — so mark it blocked and let it say so.
 */
function armForGesture(){
  music.blocked = true;       // silent for now, and the chip should say so
  revealSnd();
  if(music.armed) return;
  music.armed = true;
  document.addEventListener('pointerdown', spendGesture, { passive:true });
}

function spendGesture(e){
  /*
   * A tap on the chip is not a gesture to steal. pointerdown runs before the
   * chip's own click, so starting the song here would leave that click to read
   * as "mute" and stop it again — one tap, both ways, nothing to hear. The
   * chip knows which of the two it means; let it say.
   */
  if(e && e.target && e.target.closest && e.target.closest('.snd')) return;
  releaseGesture();
  if(music.on && music.at) musicApply();
}

function releaseGesture(){
  if(!music.armed) return;
  music.armed = false;
  document.removeEventListener('pointerdown', spendGesture);
}

/* The one deliberate mute/unmute — and the only thing that writes the setting. */
function musicToggle(prof, iso){
  if(prof) music.at = `${prof}|${iso}`;
  music.on = !music.on;
  localStorage.setItem('musicOff', music.on ? '' : '1');
  // asking for sound is itself the gesture iOS was holding out for
  if(music.on) releaseGesture();
  music.blocked = false;
  haptic(8);
  musicApply();
  revealSnd();
}

/*
 * What the chip does when tapped. Two jobs, one control: muted by choice, a tap
 * asks for sound; silent because autoplay was refused or the preview died, a
 * tap is a retry — and must not flip the preference off, which would mean
 * tapping an "unmute" glyph to mute something already silent.
 */
function sndTap(prof, iso){
  if(!(music.on && music.blocked)){ musicToggle(prof, iso); return; }
  if(prof) music.at = `${prof}|${iso}`;
  releaseGesture();
  music.blocked = false;
  haptic(8);
  musicApply();
  revealSnd();
}

/* Silence without forgetting that sound was wanted — for a backgrounded app,
   which should pick the song back up when you return to it. */
function musicPause(){
  const a = music.el;
  if(!a) return;
  clearInterval(music.fade); music.fade = null;
  a.pause();
}

/* Leaving the feed altogether: stop, and forget where we were. */
function musicLeave(){
  // a scroll frame queued before the feed was replaced must not outlive it
  if(music.raf !== null){ cancelAnimationFrame(music.raf); music.raf = null; }
  clearTimeout(music.reveal);
  music.reveal = null;
  music.shown = false;
  music.at = null;
  musicPause();
  if(music.el) music.el.volume = 0;
}

/* Whether the chip should read as audible: wanted, and nothing in the way. */
const soundOn = () => music.on && !music.blocked;

/*
 * Show the state, then stop showing it. Called from everywhere the answer to
 * "why can't I hear this" could just have changed, and safe to call twice —
 * a second call only restarts the clock.
 */
function revealSnd(){
  clearTimeout(music.reveal);
  music.shown = true;
  paintSnds();
  music.reveal = setTimeout(() => {
    music.reveal = null;
    music.shown = false;
    paintSnds();
  }, SND_HOLD);
}

function paintSnds(){
  document.querySelectorAll('[data-post-p][data-post-iso]').forEach(host => {
    paintSnd(host, host.dataset.postP, host.dataset.postIso);
  });
}

/*
 * The chip is updated rather than replaced. A fresh node would start its
 * transition over from nothing every time, which is a fade that never fades —
 * and on a timer that fires twice a scroll, a flicker.
 */
function paintSnd(host, p, iso){
  let btn = host.querySelector('.snd');
  if(!trackOf(p, iso)){ if(btn) btn.remove(); return null; }

  if(!btn){
    // a day that has only just had music put on it
    const right = host.querySelector('.post-top .right');
    if(!right) return null;
    const wrap = document.createElement('div');
    wrap.innerHTML = soundHTML(p, iso).trim();
    btn = wrap.firstElementChild;
    if(!btn) return null;
    right.appendChild(btn);
    bindPostMusic(btn, null, p, iso);
  }

  const on = soundOn();
  /* Swapped only when it actually changes: the bars restart their animation
     from flat every time this markup is replaced, and paint runs on every
     scroll frame that lands on a new day. */
  if(btn.dataset.on !== String(on)){
    btn.dataset.on = String(on);
    btn.innerHTML = sndFace(on);
  }
  btn.setAttribute('aria-label', on ? 'Mute the music' : 'Unmute the music');

  // only the frame under the thumb speaks; the rest are off screen anyway
  const here = music.at === `${p}|${iso}`;
  /* Both faces rest rather than leave; how visible that resting state is, is
     the stylesheet's business — full for the bars, a whisper for silence. */
  btn.classList.toggle('show', here && music.shown);
  btn.classList.toggle('rest', here && !music.shown);
  return btn;
}

/* Repaint the music bits in place — cheaper and calmer than a re-render. */
function paintTrackRows(){
  document.querySelectorAll('[data-post-p][data-post-iso]').forEach(host => {
    const p = host.dataset.postP, iso = host.dataset.postIso;
    const old = host.querySelector('.trk');
    let trk = null;
    if(old){
      const wrap = document.createElement('div');
      wrap.innerHTML = trackHTML(p, iso).trim();
      trk = wrap.firstElementChild;
      if(trk) old.replaceWith(trk); else old.remove();
    }
    bindPostMusic(paintSnd(host, p, iso), trk, p, iso);
  });
}

/* Top control mutes; the row underneath is the track, and yours to change. */
function bindPostMusic(snd, trk, p, iso){
  if(snd) snd.onclick = e => { e.stopPropagation(); sndTap(p, iso); };
  if(trk && trk.dataset.music) trk.onclick = e => { e.stopPropagation(); openMusic(p, iso); };
}

/*
 * The feed is a snap scroller of full-height posts, so which one is showing is
 * arithmetic rather than a guess — no observer needed.
 */
function wireFeedMusic(feed){
  const sync = () => {
    music.raf = null;
    /*
     * A queued frame can land after this feed has been swapped out for another
     * tab's view. The detached node reports scrollTop and clientHeight as 0,
     * which reads as "post one" — and would start the first day's song over the
     * top of a tab that has nothing to do with music.
     */
    if(!feed.isConnected) return;
    const i = Math.round(feed.scrollTop / (feed.clientHeight || 1));
    const post = feed.children[i];
    if(!post || !post.dataset.postP) return;
    const key = `${post.dataset.postP}|${post.dataset.postIso}`;
    if(key === music.at) return;
    music.at = key;
    // a new day under the thumb re-states the sound, the way a feed should
    revealSnd();
    if(music.on) musicApply();
  };
  feed.addEventListener('scroll', () => {
    if(music.raf === null) music.raf = requestAnimationFrame(sync);
  }, { passive:true });
  feed.addEventListener('scrollend', sync, { passive:true });
  sync();

  // Arriving at the feed starts it. When that arrival was a tap on the Feed
  // tab this call is still inside that gesture, which is exactly what iOS
  // wants; on a cold load into the feed it's refused and the next touch does it.
  if(music.on) musicApply();

  /*
   * Arriving states the sound too — a cold launch, a tab switch, a return from
   * the background and a track just saved all land here, and all of them are
   * moments where the frame could be quiet with no explanation on it. Last,
   * so it outlives the paint musicApply() does on its way through.
   */
  revealSnd();
}

/* The picker borrows the same element, so the unlock carries into it. */
function auditionTrack(url){
  const a = musicEl();
  clearInterval(music.fade); music.fade = null;
  a.src = url;
  music.loaded = null;          // the feed reloads its own when it takes over
  a.currentTime = 0;
  a.volume = 1;
  const started = a.play();
  if(started && started.catch) started.catch(() => toast('Could not play preview'));
}

/* ═══════════ images ═══════════ */
/*
 * Two renditions of every frame, which is the whole trick behind a photo feed
 * that stays quick as it fills up. The full one is what you see when a frame
 * is open across the screen; the small one is what a collage tile actually
 * needs — a tile is a couple of hundred points wide, so the full image was
 * being handed to the browser at roughly forty times the pixels it drew, and
 * paid for at that rate every time a day scrolled past.
 */
const FULL_MAX  = 1200;
const THUMB_MAX = 640;   // a 2-up tile is ~194pt, so this still has room at 3x

async function renditions(file){
  const bmp = await createImageBitmap(file);
  const draw = (max, quality) => {
    const s = Math.min(1, max/Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width*s), h = Math.round(bmp.height*s);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    return new Promise(r => c.toBlob(r, 'image/jpeg', quality));
  };
  const [full, thumb] = await Promise.all([draw(FULL_MAX, .82), draw(THUMB_MAX, .7)]);
  bmp.close();
  // A frame that was already small can re-encode larger than it started;
  // storing that would cost bytes to save none. The reader falls back to the
  // full image on its own, so the answer is simply not to keep one.
  return { full, thumb: thumb && thumb.size < full.size ? thumb : null };
}

/*
 * Frames posted before there were two renditions have only the full image, so
 * a collage tile asking for the small one is answered with the large one and
 * the saving never arrives for the back catalogue. Rather than a migration
 * this app has no way to run — resizing an image needs a canvas, and the
 * serverless side has none — the phone converts them, a few at a time, out of
 * the way of everything else.
 *
 * The download is the one that tile was going to make anyway, so the only new
 * cost is the small upload. /api/state names the frames still missing one, so
 * this picks up where it left off and stops for good once the list is empty.
 */
const BACKFILL_AT_A_TIME = 3;

async function thumbFor(url){
  const src = await (await fetch(url)).blob();
  const bmp = await createImageBitmap(src);
  const s = Math.min(1, THUMB_MAX/Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  const out = await new Promise(r => c.toBlob(r, 'image/jpeg', .7));
  return out && out.size < src.size ? out : null;   // as in renditions()
}

async function backfillThumbs(){
  const queue = state.needThumb.splice(0, BACKFILL_AT_A_TIME);
  if(!queue.length) return;
  for(const key of queue){
    const [p, iso, slot] = key.split('|');
    try{
      const blob = await thumbFor(api.photoUrl(p, iso, slot));
      if(blob) await api.fillThumb(p, iso, slot, await blobToBase64(blob));
    }catch(_){
      // a frame that won't convert is not worth retrying every launch, and it
      // still draws correctly from the full image
    }
  }
  idle(backfillThumbs);
}

/* Never in front of anything the person is waiting for. */
const idle = fn => (window.requestIdleCallback || (f => setTimeout(f, 900)))(
  () => { if(state.online && !document.hidden) fn(); }, { timeout: 8000 });
function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

/* ═══════════ render ═══════════ */
const screen = () => document.getElementById('screen');

function render(){
  if(!state.me){ renderPicker(); return; }
  document.getElementById('nav').hidden = false;
  renderNav();
  const el = screen();
  // a re-render while reading the feed shouldn't throw you back to today —
  // the feed snaps one post per screen, so the index is all there is to keep
  const open = el.querySelector('#feed');
  const wasAt = open ? Math.round(open.scrollTop / (open.clientHeight || 1)) : 0;

  el.classList.toggle('flush', state.tab === 'feed');
  el.scrollTop = 0;
  el.innerHTML =
    state.tab === 'today'  ? viewToday()  :
    state.tab === 'wall'   ? viewWall()   :
    state.tab === 'feed'   ? viewFeed()   : viewRivals();

  if(wasAt){
    const feed = el.querySelector('#feed');
    if(feed) feed.scrollTop = wasAt * (feed.clientHeight || window.innerHeight);
  }
  wire();
}

function renderNav(){
  // the feed leads: it's where the app opens and the thing worth coming back to
  const tabs = [['feed','Feed'],['today','Today'],['wall','Wall'],['rivals','Rivals']];
  const badge = feedBadge();
  // The label moved off the bar and onto the button, where a screen reader still
  // reads it out and the four points it used to occupy go to the photographs.
  document.getElementById('nav').innerHTML = tabs.map(([id,label]) => `
    <button class="tab ${state.tab===id?'on':''}" data-tab="${id}" aria-label="${label}">
      <span class="ic">${ICON[id]}</span>
      ${id==='feed' && badge ? '<i class="dot"></i>' : ''}
    </button>`).join('');
}

/* ── identity ── */

/*
 * One task row, shared by Today and the day sheet.
 * Empty camera opens the picker straight away — that's the common path.
 * A filled thumbnail opens the day sheet instead, where it can be seen large,
 * replaced or removed.
 */
function taskRow(prof, iso, t, editable){
  const on = !!entryOf(prof, iso)[t.id];
  const shots = t.multi ? photosOf(prof, iso, t.id)
                        : (hasPhoto(prof, iso, t.id) ? [t.id] : []);
  const pic = shots.length > 0;
  const oz = t.meter ? waterOz(prof, iso) : 0;
  const note = t.note ? noteOf(prof, iso, t.id) : '';
  // the row says what you last ate rather than the rule you're keeping
  const meals = t.meal ? mealsOf(prof, iso) : [];
  const last = meals[meals.length - 1];
  const sub = t.meter
    ? (oz ? `${oz} of ${WATER_GOAL_OZ} oz` : `${WATER_GOAL_OZ} oz — tap to log`)
    : last
      ? `${verdictDot(last.v)}${esc(last.nm)}${meals.length > 1 ? ` +${meals.length - 1}` : ''}`
      : esc(note || t.sub);
  let shot = '';
  if(t.photo){
    // newest shot is the thumbnail; the count says how many the day holds
    const thumb = pic
      ? `<button class="shot-btn filled" data-open-slot="${t.id}" aria-label="${t.nm} photos">
           <img src="${api.photoUrl(prof, iso, shots[shots.length - 1], THUMB)}" alt="">
           ${shots.length > 1 ? `<span class="n">${shots.length}</span>` : ''}
         </button>`
      : '';
    const camera = `<label class="shot-btn" aria-label="Add ${t.nm} photo">
                      <span class="ic">${ICON.camera}</span>
                      <input type="file" accept="image/*" data-shot="${t.id}" hidden>
                    </label>`;
    if(t.multi && editable){
      // a multi task always offers the camera, so a second meal is one tap
      shot = thumb + (shots.length < MAX_PER_SLOT ? camera : '');
    } else if(pic){
      shot = thumb;
    } else if(editable){
      shot = camera;
    } else {
      shot = `<span class="shot-btn empty"></span>`;
    }
  }
  // a written note stands in for a photo; the button fills once there is one
  let noteBtn = '';
  if(t.note && (editable || note)){
    noteBtn = `<button class="shot-btn note-btn${note?' filled':''}"
                 data-note="${t.id}" ${editable?'':'disabled'}
                 aria-label="${note?'Edit':'Add'} ${t.nm} note">
                 <span class="ic">${ICON.note}</span>
               </button>`;
  }

  // the meter row's own bottom hairline doubles as the gauge
  const fill = t.meter
    ? `<i class="fill" style="width:${waterPct(prof, iso)}%"></i>` : '';
  const mainAttr = t.meter
    ? `data-meter="${t.id}"`                       // opens the tracker
    : `data-task="${t.id}" ${editable?'':'disabled'}`;
  // A meter's box reports the pour rather than setting it — ticking it directly
  // would claim a gallon you never logged. Tapping it opens the tracker.
  const checkAttr = t.meter
    ? `data-meter="${t.id}" ${editable?'':'disabled'} aria-label="${t.nm} tracker"`
    : `data-task="${t.id}" ${editable?'':'disabled'} aria-label="Toggle ${t.nm}"`;

  return `
    <div class="task ${on?'on':''}${t.meter?' meter':''}" data-row="${t.id}">
      <button class="task-main" ${mainAttr}>
        <span class="meta">
          <span class="nm">${t.nm}</span>
          <span class="sub">${sub}</span>
        </span>
      </button>
      ${noteBtn}${shot}
      <button class="task-check${t.meter?' derived':''}" ${checkAttr}>
        <span class="box"><span class="ic">${ICON.check}</span></span>
      </button>
      ${fill}
    </div>`;
}

function cells(p, ti){
  let out = '';
  for(let d = 1; d <= TOTAL_DAYS; d++){
    const iso = isoForDay(d);
    let c = 'cell';
    if(d > ti) c += ' future';
    else if(d === ti) c += ' today' + (isComplete(p,iso) ? ' done' : '');
    else c += isComplete(p,iso) ? ' done' : ' miss';
    if(photoCount(p,iso)) c += ' pic';
    out += `<button class="${c}" data-day="${d}" data-prof="${p}" aria-label="Day ${d}"></button>`;
  }
  return out;
}

/* ── feed ── */
/*
 * One layout per frame count, because a day of six photographs is a different
 * picture from a day of three and neither is served by the same grid.
 *
 * `cols` and `rows` are handed straight to the grid — fractions, so the whole
 * height of the post gets divided up rather than a block of squares being
 * parked in the middle of it. `spans[i]` is how many columns tile i takes, and
 * it is there for the counts that leave a remainder: five in two columns is two
 * pairs and an orphan, so the first frame opens the post across the full width
 * and the rest fall in behind it. Counts that fill their grid — 2, 4, 6, 9 —
 * need no such help and get a plain one.
 *
 * The row fractions are the only judgement here, and they are made against the
 * fact that the caption block covers the bottom third of the post. An even
 * split is right almost everywhere; a lead frame is given a little extra only
 * where it opens a three-row grid, since there the rows beneath it are clear
 * of the text anyway and can afford it.
 */
const COLLAGE = {
  1:{ cols:1, rows:'1fr',            spans:[]  },
  2:{ cols:1, rows:'1fr 1fr',        spans:[]  },
  3:{ cols:2, rows:'1.1fr 1fr',      spans:[2] },
  4:{ cols:2, rows:'1fr 1fr',        spans:[]  },
  5:{ cols:2, rows:'1fr 1fr 1fr',    spans:[2] },
  6:{ cols:2, rows:'1fr 1fr 1fr',    spans:[]  },
  7:{ cols:3, rows:'1.25fr 1fr 1fr', spans:[3] },
  8:{ cols:3, rows:'1.25fr 1fr 1fr', spans:[2] },
  9:{ cols:3, rows:'1fr 1fr 1fr',    spans:[]  },
};
/*
 * Nine, where it used to be six. A grid that fills the post has room for three
 * rows of three at a size the old centred block couldn't give six, and days
 * with more than six frames are the common ones — meals alone can run to four.
 * Past nine the last tile carries a +N and the viewer holds the rest.
 */
const TILE_CAP = 9;

/* Every day either of you photographed, newest first, yours ahead on a tie.
   Shared with the launch decision, so "is there a feed to open into" and "what
   the feed shows" can't drift apart. */
function feedPosts(){
  const posts = [];
  for(const p of PROFILES){
    for(const iso of Object.keys(state.photos[p.id] || {})){
      const slots = slotsFor(p.id, iso);
      if(slots.length) posts.push({ p:p.id, iso, slots });
    }
  }
  return posts.sort((a,b) => a.iso === b.iso ? (a.p === me() ? -1 : 1) : (a.iso < b.iso ? 1 : -1));
}

function viewFeed(){
  markFeedSeen();
  const posts = feedPosts();

  if(!posts.length) return `
    <div class="feed-empty">
      <span class="ic">${ICON.camera}</span>
      <h3>No frames yet</h3>
      <p>Progress photos from both of you land here as one timeline. Post today's from the Today tab.</p>
      <button class="btn primary" style="max-width:220px;margin-top:8px" data-goto="today">Add today's frame</button>
    </div>`;

  return `<div class="feed" id="feed">${posts.map(o => {
    const d = dayIndex(o.iso);
    const n = doneCount(o.p, o.iso);
    const full = n === TASKS.length;
    const own = o.p === me();
    const n2 = o.slots.length;
    return `
    <div class="post" data-who="${whoAttr(o.p)}" data-post-p="${o.p}" data-post-iso="${o.iso}">
      ${(() => {
        const shown = o.slots.slice(0, TILE_CAP);
        const over = n2 - shown.length;
        const g = COLLAGE[shown.length];
        return `
      <div class="collage"
           style="grid-template-columns:repeat(${g.cols},1fr);grid-template-rows:${g.rows}">
        ${shown.map((s, i) => {
          const span = g.spans[i] || 1;
          /* Which rendition a tile has earned. The small one is 640px, which
             covers a tile up to about 210pt at 3x — every cell in a two- or
             three-column row, and roughly a twentieth of the weight. A tile
             holding most of the width is past that, so it gets the full image:
             the lone frame, the pair, and the wide one that opens an odd count. */
          const size = span / g.cols >= .6 ? undefined : THUMB;
          return `
          <button class="tile${span > 1 ? ` w${span}` : ''}" data-tile="${i}" aria-label="${slotLabel(s)}">
            <img src="${api.photoUrl(o.p, o.iso, s, size)}" alt="${slotLabel(s)}" loading="lazy" draggable="false">
            ${over && i === shown.length - 1 ? `<span class="more">+${over}</span>` : ''}
          </button>`;
        }).join('')}
      </div>`;
      })()}
      <div class="shade"></div>
      <div class="post-top">
        <span class="who">${own?'You':nameOf(o.p)}</span>
        <span class="right">
          <span class="dt">${fmtDate(o.iso)}</span>
          ${soundHTML(o.p, o.iso)}
        </span>
      </div>
      <div class="post-bot">
        <div class="day">
          <span class="lb">Day</span><span class="n num">${d}</span>
          <div class="acts">
            ${kudosHTML(o.p, o.iso, own)}
            ${cmtHTML(o.p, o.iso)}
          </div>
        </div>
        <div class="rule"></div>
        <div class="state">${full ? '<b>All five complete</b>' : n + ' of ' + TASKS.length + ' complete'}</div>
        ${trackHTML(o.p, o.iso)}
        <div class="cmt-slot">${peekHTML(o.p, o.iso)}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

/*
 * The two feed actions: a glyph, and the count when there is one. Kudos is a
 * thumb, comments a bubble — the words were doing no work a symbol can't.
 */
function kudosHTML(prof, iso, own){
  const c = kudosCount(prof, iso), mine = iGaveKudos(prof, iso);
  return `<button class="kudos ${mine?'mine':''}" ${own?'disabled':''}
    aria-label="${own ? 'Kudos on your frame' : mine ? 'Kudos given' : 'Give kudos'}">
    <span class="ic">${ICON.thumb}</span>${c ? `<span class="n">${c}</span>` : ''}
  </button>`;
}
function cmtHTML(prof, iso){
  const n = commentCount(prof, iso);
  return `<button class="cmt" aria-label="${n ? `Comments (${n})` : 'Add a comment'}">
    <span class="ic">${ICON.comment}</span>${n ? `<span class="n">${n}</span>` : ''}
  </button>`;
}

/* The track line on a post. Tapping it is how sound gets turned on and off,
   so the hint only shows while it's off and there's nothing to hear. */
function trackHTML(prof, iso){
  const t = trackOf(prof, iso);
  const own = prof === me();

  // your own day, nothing on it yet: the way in, right where the track goes
  if(!t){
    return own ? `
      <button class="trk add" data-music="1" aria-label="Add music to this day">
        <span class="box">+</span>
        <span class="txt"><span class="nm">Add music</span></span>
      </button>` : '';
  }

  const inner = `
    <img class="art" src="${esc(t.art || '')}" alt="" loading="lazy">
    <span class="txt">
      <span class="nm">${esc(t.nm)}</span>
      <span class="ar">${esc(t.ar || '')}</span>
    </span>
    ${own ? '<span class="chg">Change</span>' : ''}`;

  return own
    ? `<button class="trk" data-music="1" aria-label="Change the music on this day">${inner}</button>`
    : `<div class="trk">${inner}</div>`;
}

/*
 * Sound is a property of listening, not of one post, so its control sits at the
 * top where it always is — and only where there is something to hear. Rendered
 * retired: paintSnd() decides whether this frame is the one showing it, which
 * keeps a re-render from flashing every chip in the feed at once.
 */
function soundHTML(prof, iso){
  if(!trackOf(prof, iso)) return '';
  const on = soundOn();
  return `
    <button class="snd" data-on="${on}" aria-label="${on ? 'Mute the music' : 'Unmute the music'}">
      ${sndFace(on)}
    </button>`;
}

/*
 * The chip's two faces. Playing is the bars, moving in time with the fact that
 * something is: a still glyph can say "sound is on" but only a moving one says
 * it is on *now*. Silence gets the crossed speaker, because a stopped animation
 * and a broken one look the same, and this state is the one carrying a reason.
 */
const sndFace = on => on
  ? '<span class="eq on"><i></i><i></i><i></i></span>'
  : `<span class="ic">${ICON.soundOff}</span>`;

/*
 * What you wrote about this photo, laid faintly over it. Comments stay tucked
 * behind their own sheet — this is the caption, which belongs to the frame.
 * Your own frames get an invitation when there's nothing written yet; that
 * prompt is the only reason an empty caption renders at all.
 */
function capLineHTML(prof, iso, slot, own){
  const cap = capText(prof, iso, slot);
  if(cap) return `<span class="tx">${esc(cap)}</span>`;
  return own ? `<span class="tx add">Add a caption</span>` : '';
}

/* The latest word on a frame — one line, on the photo, tap for the thread. */
function peekHTML(prof, iso){
  const last = lastCommentOn(prof, iso);
  if(!last) return '';
  const extra = commentCount(prof, iso) - 1;
  return `
    <button class="cmt-peek">
      <span class="who ${last.from === me() ? 'c-a' : 'c-b'}">${last.from === me() ? 'You' : nameOf(last.from)}</span>
      <span class="tx">${esc(last.body)}</span>
      ${extra > 0 ? `<span class="more">+${extra}</span>` : ''}
    </button>`;
}

/* ── rivals ── */
function viewRivals(){
  const a = me(), b = them();
  const ti = Math.max(0, Math.min(todayIndex(), TOTAL_DAYS));
  const row = (k, va, vb, small) => `
    <div class="rv-row ${small?'small':''}">
      <span class="k">${k}</span>
      <span class="v a">${va}</span>
      <span class="v b">${vb}</span>
    </div>`;

  return `
  <div>
    ${topbar()}
    <div class="rv-head">
      <span></span>
      <span class="c" style="color:var(--you)">You</span>
      <span class="c" style="color:var(--them)">${nameOf(b)}</span>
    </div>
    ${row('Perfect days', totalComplete(a), totalComplete(b))}
    ${row('Current streak', streak(a), streak(b))}
    ${row('Longest run', bestStreak(a), bestStreak(b))}
    ${row('Consistency', (ti?Math.round(totalComplete(a)/ti*100):0)+'%', (ti?Math.round(totalComplete(b)/ti*100):0)+'%')}

    <div class="sect">
      <span class="eyebrow">By task</span>
      ${TASKS.map(t => row(t.nm, taskRate(a,t.id)+'%', taskRate(b,t.id)+'%', true)).join('')}
    </div>

    <div class="sect">
      <span class="eyebrow">Record</span>
      ${row('Photos posted', totalPhotos(a), totalPhotos(b), true)}
      ${row('Kudos received', state.reactions.filter(r=>r.to===a).length,
                              state.reactions.filter(r=>r.to===b).length, true)}
    </div>
  </div>`;
}

/* ═══════════ wiring ═══════════ */
function wire(){
  const el = screen();

  document.getElementById('nav').querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { if(state.tab !== b.dataset.tab){ state.tab = b.dataset.tab; haptic(6); render(); } };
  });

  const gear = el.querySelector('#gearBtn');
  if(gear) gear.onclick = openSettings;

  const news = el.querySelector('#newsBtn');
  if(news) news.onclick = openNews;

  el.querySelectorAll('[data-goto]').forEach(b => {
    b.onclick = () => { state.tab = b.dataset.goto; render(); };
  });

  // both the label area and the checkbox toggle the same task
  el.querySelectorAll('[data-task]').forEach(b => {
    b.onclick = () => toggleTask(b.dataset.task, b.closest('.task'));
  });

  el.querySelectorAll('[data-meter]').forEach(b => {
    b.onclick = () => openWater(me(), todayISO());
  });

  // optional per-task photo: empty camera picks a file, filled thumb opens the day
  el.querySelectorAll('[data-shot]').forEach(input => {
    input.onchange = () => uploadFrom(input, me(), todayISO(), newSlot(input.dataset.shot));
  });
  el.querySelectorAll('[data-note]').forEach(b => {
    b.onclick = () => openNote(me(), todayISO(), b.dataset.note);
  });
  el.querySelectorAll('[data-open-slot]').forEach(b => {
    b.onclick = () => openDay(me(), todayISO());
  });

  // Only the filled card opens the sheet; an empty one is a <label> whose
  // hidden input is already wired by the [data-shot] pass above.
  const frame = el.querySelector('button#frameBtn');
  if(frame) frame.onclick = () => openDay(me(), todayISO());

  // read-only peek at your partner's day, straight off their strip
  const rb = el.querySelector('#rivalBtn');
  if(rb) rb.onclick = () => openDay(them(), todayISO());

  el.querySelectorAll('#switch button').forEach(b => {
    b.onclick = () => { state.wallView = b.dataset.wv; haptic(6); render(); };
  });

  el.querySelectorAll('.cell').forEach(b => {
    b.onclick = () => {
      const d = Number(b.dataset.day);
      if(d > todayIndex()){ toast("Hasn't happened yet"); return; }
      openDay(b.dataset.prof, isoForDay(d));
    };
  });

  el.querySelectorAll('.post').forEach(post => {
    const p = post.dataset.postP, iso = post.dataset.postIso;
    post.querySelectorAll('[data-tile]').forEach(tile => {
      tile.onclick = e => { e.stopPropagation(); openViewer(p, iso, Number(tile.dataset.tile)); };
    });
    // your own frames included — a reply to their comment belongs there too
    bindComments(post, p, iso, DAY_SLOT);
    bindPostMusic(post.querySelector('.snd'), post.querySelector('.trk'), p, iso);
    if(p === me()) return;
    const btn = post.querySelector('.kudos');
    if(btn) btn.onclick = e => { e.stopPropagation(); sendKudos(p, iso, post, false); };
  });

  // music belongs to the feed; anywhere else it stops rather than follows you
  const feed = el.querySelector('#feed');
  if(feed) wireFeedMusic(feed);
  else musicLeave();

  startCountdown();
}

/*
 * Both the button and the peek line open the same thread. `slot` is what a new
 * comment gets filed against: the day itself from the collage, or the frame you
 * are looking at in the viewer.
 */
function bindComments(host, prof, iso, slot){
  host.querySelectorAll('.cmt, .cmt-peek').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      openComments(prof, iso, typeof slot === 'function' ? slot() : slot);
    };
  });
}

/* Keep the slot caption and pips in step with the horizontal swipe. */
function wireReel(host, p, iso){
  const reel = host.querySelector('.reel');
  const slots = slotsFor(p, iso);
  if(!reel || slots.length < 2) return;
  const tag = host.querySelector('.slot-tag');
  const pips = [...host.querySelectorAll('.pips i')];
  let shown = 0, raf = null;

  const sync = () => {
    raf = null;
    const w = reel.clientWidth || 1;
    const i = Math.max(0, Math.min(slots.length - 1, Math.round(reel.scrollLeft / w)));
    if(i === shown) return;
    shown = i;
    if(tag){
      tag.innerHTML = `${frameTag(p, iso, slots[i])} <span class="of">${i+1}/${slots.length}</span>`;
      tag.dataset.slot = slots[i];
    }
    // every frame carries its own caption, so swiping has to bring the next one
    const cap = host.querySelector('.frame-cap');
    if(cap) cap.innerHTML = capLineHTML(p, iso, slots[i], p === me());
    pips.forEach((pip, n) => pip.classList.toggle('on', n === i));
  };

  reel.addEventListener('scroll', () => {
    if(raf === null) raf = requestAnimationFrame(sync);
  }, { passive:true });
  // scrollend lands the final state even if the last scroll frame is coalesced
  reel.addEventListener('scrollend', sync, { passive:true });
  reel._syncReel = sync;
}

/* ═══════════ actions ═══════════ */
async function toggleTask(taskId, row){
  const you = me(), iso = todayISO();
  seedDay(you, iso);

  // water is logged pour by pour; it is never ticked directly
  if(TASKS.find(t => t.id === taskId)?.meter){ openWater(you, iso); return; }

  const was = isComplete(you, iso);
  const now = !state.data[you][iso][taskId];
  state.data[you][iso][taskId] = now;

  row.classList.toggle('on', now);
  if(now){ row.classList.add('just'); setTimeout(() => row.classList.remove('just'), 320); }
  refreshToday();
  haptic(now ? 12 : 6);

  if(now && !was && isComplete(you, iso)) showComplete();

  try{ await api.saveDay(you, iso, state.data[you][iso]); state.online = true; }
  catch(_){ toast('Offline — not saved'); }
}

/*
 * Shared upload path for every slot. Swaps the row's camera for the new
 * thumbnail in place rather than re-rendering, so checking a task off and
 * adding its photo don't fight over the DOM.
 */
async function uploadFrom(input, prof, iso, slot){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  try{
    toast('Uploading');
    const { full, thumb } = await renditions(file);
    const [b64, t64] = await Promise.all([blobToBase64(full), thumb ? blobToBase64(thumb) : null]);
    await api.uploadPhoto(prof, iso, slot, 'image/jpeg', b64, t64);
    addPhotoLocal(prof, iso, slot);
    haptic(16);
    toast(slot === DAY_SLOT ? 'Frame logged' : `${slotLabel(slot)} photo added`);

    const row = screen().querySelector(`.task[data-row="${slotBase(slot)}"]`);
    // a multi task keeps its camera, so re-render instead of replacing it
    const label = MULTI_SLOTS.includes(slotBase(slot))
      ? null : row && row.querySelector('label.shot-btn');
    if(label){
      const btn = document.createElement('button');
      btn.className = 'shot-btn filled fresh';
      btn.dataset.openSlot = slot;
      btn.innerHTML = `<img src="${api.photoUrl(prof, iso, slot, THUMB)}" alt="">`;
      btn.onclick = () => openDay(prof, iso);
      label.replaceWith(btn);
    } else {
      render();
    }
    // straight into saying what it is, while you still remember
    openCaption(prof, iso, slot, { fresh:true });
  }catch(_){ toast('Upload failed'); }
}

function refreshToday(){
  const you = me(), iso = todayISO();
  const n = doneCount(you, iso), done = n === TASKS.length;

  TASKS.forEach(t => {
    const s = document.querySelector(`[data-seg="${t.id}"]`);
    if(s) s.classList.toggle('on', !!entryOf(you,iso)[t.id]);
  });
  const st = document.querySelector('.hero-foot .state');
  if(st){ st.textContent = done ? 'Complete' : `${word(n)} of five`; st.classList.toggle('done', done); }
  const sv = document.getElementById('streakV');
  if(sv) sv.textContent = streak(you);
  const cd = document.getElementById('cdStat');
  if(cd){
    cd.classList.toggle('risk', !done && msToMidnight()/3600000 < 5);
    const k = cd.querySelector('.eyebrow');
    if(k) k.textContent = done ? 'Next day in' : 'Left today';
  }
}

function showComplete(){
  const ti = todayIndex(), you = me();
  const st = streak(you), total = totalComplete(you);
  const mile = MILES.find(m => m.d === total);
  const el = document.getElementById('done');
  el.setAttribute('data-who','you');
  el.innerHTML = `
    <div class="inner">
      <div class="eyebrow">Day</div>
      <div class="big num">${ti}</div>
      <div class="rule"></div>
      <div class="word">Complete</div>
      <div class="meta">${word(st)} consecutive${mile ? ' — ' + mile.nm : ''}</div>
    </div>`;
  el.classList.add('on');
  haptic([14,50,14]);
  const close = () => { el.style.opacity = '0'; setTimeout(() => { el.classList.remove('on'); el.style.opacity=''; }, 280); };
  el.onclick = close;
