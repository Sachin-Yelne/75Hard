<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="75 HARD">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<title>75 HARD</title>
<style>
:root{
  --ink:#0A0A0B;
  --ink-2:#0F0F11;
  --ink-3:#141416;
  --bone:#F2F1ED;
  --bone-2:#8C8A85;
  --bone-3:#55534F;
  --rule:#1E1E20;
  --rule-2:#2C2C2F;

  --you:#C8613A;
  --them:#6E7F6A;
  --miss:#6A3A2B;

  --display:'Anton',Impact,sans-serif;
  --cond:'Barlow Condensed',sans-serif;
  --body:'Inter',system-ui,sans-serif;

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --nav:calc(56px + var(--safe-bot));
  --col:520px;
  --pad:20px;
}

[data-who="you"]{--p:var(--you);}
[data-who="them"]{--p:var(--them);}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--ink);color:var(--bone);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left;}
svg{width:100%;height:100%;fill:currentColor;display:block;}

/* type primitives */
.eyebrow{
  font-family:var(--cond);font-weight:600;font-size:11px;line-height:1;
  letter-spacing:.22em;text-transform:uppercase;color:var(--bone-3);
}
.lbl{
  font-family:var(--cond);font-weight:600;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;
}
.num{font-family:var(--display);font-weight:400;letter-spacing:-.01em;font-feature-settings:"tnum";}
.rule{height:1px;background:var(--rule);width:100%;}

/* ── shell ─────────────────────────────── */
#screen{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-top) + 10px) var(--pad) calc(var(--nav) + 40px);
}
#screen.flush{padding:0;overflow:hidden;}
#screen:not(.flush) > *{max-width:var(--col);margin-left:auto;margin-right:auto;}
.feed,.sheet{max-width:var(--col);margin:0 auto;}

/* ── nav ───────────────────────────────── */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:var(--nav);padding-bottom:var(--safe-bot);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(10,10,11,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);
  padding-left:max(0px,calc((100% - var(--col))/2));
  padding-right:max(0px,calc((100% - var(--col))/2));
}
#nav[hidden]{display:none;}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--bone-3);transition:color .18s;position:relative;
}
.tab .ic{width:15px;height:15px;}
.tab span{
  font-family:var(--cond);font-weight:600;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;line-height:1;
}
.tab.on{color:var(--bone);}
.tab.on::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:1px;background:var(--bone);
}
.tab .dot{position:absolute;top:9px;right:calc(50% - 15px);width:4px;height:4px;background:var(--you);}

/* ── topbar ────────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px;}
.top .mark{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.28em;text-transform:uppercase;}
.icon-btn{width:30px;height:30px;padding:7px;color:var(--bone-2);}
.icon-btn:active{color:var(--bone);}

/* ── hero ──────────────────────────────── */
.hero{padding:22px 0 0;}
.hero .day{
  font-family:var(--display);font-size:clamp(96px,30vw,132px);line-height:.78;
  letter-spacing:-.03em;margin:8px 0 16px;
}
.hero-foot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 16px;}
.hero-foot .state{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;}
.hero-foot .state.done{color:var(--p);}

/* segmented progress */
.seg{display:flex;gap:4px;}
.seg i{flex:1;height:3px;background:var(--rule-2);transition:background .25s;}
.seg i.on{background:var(--p);}

/* stat pair */
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);margin-top:22px;}
.stat{padding:14px 0 16px;}
.stat + .stat{border-left:1px solid var(--rule);padding-left:18px;}
.stat .v{font-family:var(--display);font-size:34px;line-height:1;margin-top:7px;}
.stat.risk .v{color:var(--you);}

/* ── tasks ─────────────────────────────── */
.tasks{border-top:1px solid var(--rule);}
.task{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:16px 0;border-bottom:1px solid var(--rule);
  transition:opacity .2s;
}
.task .meta{flex:1;min-width:0;}
.task .nm{
  display:block;
  font-family:var(--cond);font-weight:600;font-size:19px;
  letter-spacing:.09em;text-transform:uppercase;line-height:1.05;
  transition:color .2s;
}
.task .sub{display:block;font-size:11.5px;color:var(--bone-3);margin-top:5px;letter-spacing:.01em;}
.box{
  width:22px;height:22px;flex-shrink:0;
  border:1px solid var(--rule-2);
  display:grid;place-items:center;color:transparent;
  transition:background .18s,border-color .18s,color .18s;
}
.box .ic{width:11px;height:11px;}
.task.on .box{background:var(--p);border-color:var(--p);color:var(--ink);}
.task.on .nm{color:var(--p);}
.task:disabled{cursor:default;}
@keyframes tick{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
.task.just .box{animation:tick .3s ease;}

/* ── rival strip ───────────────────────── */
.rival{padding:20px 0 0;}
.rival-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;}
.rival-head .who{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;}
.rival-head .sc{font-family:var(--display);font-size:15px;color:var(--bone-2);}
.rival-head .sc.done{color:var(--p);}

/* ── frame button ──────────────────────── */
.frame{
  display:flex;align-items:center;gap:13px;width:100%;
  margin-top:26px;padding:16px 16px;
  border:1px solid var(--rule-2);
}
.frame .ic{width:17px;height:17px;color:var(--bone-2);flex-shrink:0;}
.frame .meta{flex:1;min-width:0;}
.frame .nm{display:block;font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.13em;text-transform:uppercase;}
.frame .sub{display:block;font-size:11px;color:var(--bone-3);margin-top:3px;}
.frame.filled{border-color:var(--p);}
.frame.filled .ic{color:var(--p);}
.frame img{width:34px;height:34px;object-fit:cover;flex-shrink:0;}

/* ── wall ──────────────────────────────── */
.switch{display:flex;border:1px solid var(--rule);margin-bottom:26px;}
.switch button{
  flex:1;padding:11px 0;text-align:center;
  font-family:var(--cond);font-weight:600;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bone-3);
  transition:background .18s,color .18s;
}
.switch button + button{border-left:1px solid var(--rule);}
.switch button.on{background:var(--bone);color:var(--ink);}

.wall{margin-bottom:34px;}
.wall-head{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:14px;}
.wall-head .who{font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;}
.wall-head .tally{font-family:var(--display);font-size:16px;color:var(--p);}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
.cell{aspect-ratio:1;background:var(--ink-3);position:relative;transition:opacity .15s;}
.cell:active{opacity:.5;}
.cell.done{background:var(--p);}
.cell.miss{background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--miss);}
.cell.today{background:transparent;box-shadow:inset 0 0 0 1px var(--bone);}
.cell.today.done{background:var(--p);box-shadow:inset 0 0 0 1px var(--bone);}
.cell.future{background:var(--ink-2);}
.cell.pic::after{content:'';position:absolute;bottom:2px;right:2px;width:3px;height:3px;background:var(--bone);opacity:.5;}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;}
.legend span{display:flex;align-items:center;gap:6px;
  font-family:var(--cond);font-weight:500;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);}
.legend i{width:8px;height:8px;display:block;}

/* milestones */
.miles{border-top:1px solid var(--rule);}
.mile{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);}
.mile .d{font-family:var(--display);font-size:14px;color:var(--bone-3);width:26px;flex-shrink:0;}
.mile .nm{flex:1;font-family:var(--cond);font-weight:600;font-size:14px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--bone-3);}
.mile .ic{width:12px;height:12px;color:var(--rule-2);}
.mile.got .d,.mile.got .nm{color:var(--bone);}
.mile.got .ic{color:var(--p);}

/* ── feed ──────────────────────────────── */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.post{height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  position:relative;background:#000;overflow:hidden;}
.post img{width:100%;height:100%;object-fit:cover;}
.post .shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 26%,transparent 42%,rgba(0,0,0,.88) 100%);}
.post-top{position:absolute;top:calc(var(--safe-top) + 16px);left:var(--pad);right:var(--pad);
  display:flex;justify-content:space-between;align-items:baseline;}
.post-top .who{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;}
.post-top .dt{font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,.6);}
.post-bot{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--nav) + 22px);}
.post-bot .day{font-family:var(--display);font-size:74px;line-height:.8;letter-spacing:-.03em;}
.post-bot .rule{background:rgba(255,255,255,.28);margin:14px 0 12px;}
.post-bot .state{font-family:var(--cond);font-weight:600;font-size:13px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);}
.post-bot .state b{color:var(--p);font-weight:600;}
.kudos{
  display:inline-flex;align-items:center;gap:11px;margin-top:16px;
  padding:10px 16px;border:1px solid rgba(255,255,255,.32);
  font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  transition:background .18s,border-color .18s,color .18s;
}
.kudos .n{font-family:var(--display);font-size:13px;letter-spacing:0;}
.kudos.mine{background:var(--you);border-color:var(--you);color:var(--ink);}
.kudos:disabled{opacity:.55;}
@keyframes stamp{
  0%{transform:translate(-50%,-50%) scale(.7);opacity:0}
  22%{transform:translate(-50%,-50%) scale(1);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.08);opacity:0}
}
.stamp{
  position:absolute;top:50%;left:50%;z-index:5;pointer-events:none;
  font-family:var(--display);font-size:44px;letter-spacing:.04em;
  padding:14px 26px;border:2px solid var(--bone);
  animation:stamp .9s cubic-bezier(.2,.8,.3,1) forwards;
}
.feed-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:0 44px;text-align:center;}
.feed-empty .ic{width:26px;height:26px;color:var(--bone-3);}
.feed-empty h3{font-family:var(--display);font-size:26px;letter-spacing:-.01em;margin:0;}
.feed-empty p{font-size:12.5px;color:var(--bone-3);line-height:1.6;margin:0;}

/* ── rivals ────────────────────────────── */
.rv-head{display:grid;grid-template-columns:1fr auto auto;gap:20px;
  padding-bottom:11px;border-bottom:1px solid var(--rule);}
.rv-head .c{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;width:68px;text-align:right;}
.rv-row{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;
  padding:15px 0;border-bottom:1px solid var(--rule);}
.rv-row .k{font-family:var(--cond);font-weight:600;font-size:14px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--bone-2);}
.rv-row .v{font-family:var(--display);font-size:26px;width:68px;text-align:right;line-height:1;}
.rv-row .v.a{color:var(--you);}
.rv-row .v.b{color:var(--them);}
.rv-row.small .v{font-size:18px;}
.sect{margin-top:36px;}
.sect > .eyebrow{display:block;margin-bottom:14px;}

/* ── sheets ────────────────────────────── */
#sheets{position:fixed;inset:0;z-index:60;pointer-events:none;}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.7);opacity:0;transition:opacity .26s;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--ink-2);border-top:1px solid var(--rule-2);
  padding:20px var(--pad) calc(26px + var(--safe-bot));
  max-height:88%;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.3,1,.4,1);
}
#sheets.open{pointer-events:auto;}
#sheets.open .scrim{opacity:1;}
#sheets.open .sheet{transform:translateY(0);}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;
  padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:4px;}
.sheet-head .t{font-family:var(--display);font-size:30px;line-height:1;}
.sheet-head .s{font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);margin-top:8px;}
.btn{
  display:block;width:100%;padding:15px;text-align:center;
  font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;
  border:1px solid var(--rule-2);margin-top:10px;transition:background .18s,color .18s;
}
.btn.primary{background:var(--bone);color:var(--ink);border-color:var(--bone);}
.btn.danger{color:var(--you);border-color:var(--miss);}
.btn.ghost{border-color:transparent;color:var(--bone-3);}
.shot{width:100%;max-height:320px;object-fit:cover;display:block;margin-bottom:14px;}
.shot-none{border:1px solid var(--rule);padding:44px 0;text-align:center;margin-bottom:14px;
  font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-3);}
.note{font-family:var(--cond);font-weight:500;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);text-align:center;margin-top:16px;}

/* ── identity ──────────────────────────── */
.pick{position:fixed;inset:0;z-index:80;background:var(--ink);
  display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);}
.pick .mark{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--bone-3);}
.pick h2{font-family:var(--display);font-size:clamp(46px,14vw,64px);line-height:.86;
  letter-spacing:-.02em;margin:16px 0 34px;}
.pick-btn{display:flex;align-items:baseline;justify-content:space-between;width:100%;
  padding:20px 0;border-top:1px solid var(--rule);}
.pick-btn:last-of-type{border-bottom:1px solid var(--rule);}
.pick-btn .nm{font-family:var(--cond);font-weight:600;font-size:26px;
  letter-spacing:.1em;text-transform:uppercase;}
.pick-btn .ix{font-family:var(--display);font-size:13px;color:var(--bone-3);}

/* ── completion ────────────────────────── */
#done{
  position:fixed;inset:0;z-index:70;background:var(--ink);
  display:none;flex-direction:column;justify-content:center;padding:0 var(--pad);
  opacity:0;transition:opacity .28s;
}
#done.on{display:flex;opacity:1;}
@keyframes riseIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
#done .inner > *{animation:riseIn .5s cubic-bezier(.2,.9,.3,1) both;}
#done .inner > *:nth-child(2){animation-delay:.05s;}
#done .inner > *:nth-child(3){animation-delay:.1s;}
#done .inner > *:nth-child(4){animation-delay:.14s;}
#done .inner > *:nth-child(5){animation-delay:.18s;}
#done .big{font-family:var(--display);font-size:clamp(104px,32vw,150px);line-height:.76;
  letter-spacing:-.03em;margin:10px 0 20px;}
#done .rule{background:var(--bone);margin-bottom:20px;}
#done .word{font-family:var(--display);font-size:clamp(38px,11vw,52px);line-height:.9;
  letter-spacing:-.01em;color:var(--p);}
#done .meta{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--bone-3);margin-top:22px;}

#toast{
  position:fixed;left:50%;bottom:calc(var(--nav) + 18px);z-index:90;
  transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:var(--bone);color:var(--ink);
  padding:10px 18px;font-family:var(--cond);font-weight:600;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  transition:opacity .22s,transform .22s;
}
#toast.on{opacity:1;transform:translate(-50%,0);}

.boot{height:100%;display:grid;place-items:center;}
.boot span{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--bone-3);}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>

<div id="screen"><div class="boot"><span>75 Hard</span></div></div>
<nav id="nav" hidden></nav>
<div id="sheets"></div>
<div id="done"></div>
<div id="toast"></div>

<script>
/* ═══════════ config ═══════════ */
const TOTAL_DAYS = 75;

const TASKS = [
  { id:'diet',     nm:'Diet',        sub:'No cheat meals, no alcohol' },
  { id:'workout1', nm:'Workout One', sub:'45 minutes' },
  { id:'workout2', nm:'Workout Two', sub:'45 minutes, outdoors' },
  { id:'water',    nm:'Water',       sub:'1 gallon' },
  { id:'read',     nm:'Read',        sub:'10 pages, non-fiction' }
];

const PROFILES = [
  { id:'sachin', label:'Sachin' },
  { id:'aarya',  label:'Aarya' }
];

const MILES = [
  { d:1,  nm:'First Day' },
  { d:3,  nm:'Momentum' },
  { d:7,  nm:'One Week' },
  { d:14, nm:'Fortnight' },
  { d:21, nm:'Habit Locked' },
  { d:30, nm:'One Month' },
  { d:45, nm:'Past Halfway' },
  { d:60, nm:'Home Stretch' },
  { d:75, nm:'Seventy Five' }
];

const KUDOS_TOKEN = 'kudos';
const WORDS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
  'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty'];
const word = n => (WORDS[n] || String(n)).toUpperCase();

/* Font Awesome Pro (sharp-light), inlined — only the eight actually used. */

/* ═══════════ api ═══════════ */
const api = {
  async getState(){
    const r = await fetch('/api/state');
    if(!r.ok) throw new Error('load');
    return r.json();
  },
  async saveDay(profileId, date, tasks){
    const r = await fetch('/api/state', { method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ profileId, date, tasks }) });
    if(!r.ok) throw new Error('save');
  },
  async getReactions(){
    const r = await fetch('/api/reactions');
    if(!r.ok) throw new Error('reactions');
    return r.json();
  },
  async react(from, to, date, emoji){
    const r = await fetch('/api/reactions', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ from, to, date, emoji }) });
    if(!r.ok) throw new Error('react');
    return r.json();
  },
  async uploadPhoto(profileId, date, contentType, dataBase64){
    const r = await fetch(`/api/photos?profile=${encodeURIComponent(profileId)}&date=${encodeURIComponent(date)}`,
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ profileId, date, contentType, dataBase64 }) });
    if(!r.ok) throw new Error('upload');
  },
  async deletePhoto(profileId, date){
    const r = await fetch(`/api/photos?profile=${encodeURIComponent(profileId)}&date=${encodeURIComponent(date)}`,
      { method:'DELETE' });
    if(!r.ok) throw new Error('delete');
  },
  photoUrl(profileId, date){
    const v = state.photoV[`${profileId}|${date}`] || 0;
    return `/api/photos?profile=${encodeURIComponent(profileId)}&date=${encodeURIComponent(date)}&v=${v}`;

    const r = await fetch('/api/reset', { method:'POST',

/* ═══════════ state ═══════════ */

  startDate:null,
  data:{ sachin:{}, aarya:{} },
  photoDays:{ sachin:[], aarya:[] },
  photoV:{},
  reactions:[],
  me: localStorage.getItem('me') || null,

const me   = () => state.me;
const them = () => state.me === 'sachin' ? 'aarya' : 'sachin';

const whoAttr = id => id === me() ? 'you' : 'them';

/* ═══════════ dates (local, never UTC) ═══════════ */
function isoOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayISO(){ return isoOf(new Date()); }
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function dayIndex(iso){ return Math.round((parseISO(iso) - parseISO(state.startDate))/86400000) + 1; }
function isoForDay(n){ return addDays(state.startDate, n-1); }
function todayIndex(){ return dayIndex(todayISO()); }
function fmtDate(iso){
  return parseISO(iso).toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });
}
function msToMidnight(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate()+1) - n;
}
function fmtLeft(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m ${String(s).padStart(2,'0')}s`;
}

/* ═══════════ selectors ═══════════ */
const entryOf = (p, iso) => state.data[p]?.[iso] || {};
const doneCount = (p, iso) => TASKS.reduce((n,t) => n + (entryOf(p,iso)[t.id] ? 1 : 0), 0);
const isComplete = (p, iso) => doneCount(p, iso) === TASKS.length;
const hasPhoto = (p, iso) => state.photoDays[p]?.includes(iso);

function streak(p){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  let n = 0;
  for(let d = ti; d >= 1; d--){
    if(isComplete(p, isoForDay(d))) n++;
    else if(d === ti) continue;
    else break;
  }
  return n;
}
function bestStreak(p){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  let best = 0, run = 0;
  for(let d = 1; d <= ti; d++){
    if(isComplete(p, isoForDay(d))){ run++; best = Math.max(best, run); } else run = 0;
  }
  return best;
}
function totalComplete(p){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  let n = 0;
  for(let d = 1; d <= ti; d++) if(isComplete(p, isoForDay(d))) n++;
  return n;
}
function taskRate(p, taskId){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  if(ti < 1) return 0;
  let n = 0;
  for(let d = 1; d <= ti; d++) if(entryOf(p, isoForDay(d))[taskId]) n++;
  return Math.round(n/ti*100);
}
const kudosCount = (to, date) => state.reactions.filter(r => r.to === to && r.date === date).length;
const iGaveKudos = (to, date) => state.reactions.some(r => r.to === to && r.date === date && r.from === me());
function unseenKudos(){
  const seen = Number(localStorage.getItem('kudosSeen') || 0);
  return state.reactions.filter(r => r.to === me()).length > seen;
}

/* ═══════════ fx ═══════════ */
function haptic(ms = 10){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(_){} }
let toastT;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 1900);
}

/* ═══════════ images ═══════════ */
async function compressImage(file){
  const bmp = await createImageBitmap(file);
  const max = 1200;
  const s = Math.min(1, max/Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width*s), h = Math.round(bmp.height*s);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  bmp.close();
  return blob;
}
function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

/* ═══════════ render ═══════════ */
const screen = () => document.getElementById('screen');

function render(){
  if(!state.me){ renderPicker(); return; }
  document.getElementById('nav').hidden = false;
  renderNav();
  const el = screen();
  el.classList.toggle('flush', state.tab === 'feed');
  el.scrollTop = 0;
  el.innerHTML =
    state.tab === 'today'  ? viewToday()  :
    state.tab === 'wall'   ? viewWall()   :
    state.tab === 'feed'   ? viewFeed()   : viewRivals();
  wire();
}

function renderNav(){
  const tabs = [['today','Today'],['wall','Wall'],['feed','Feed'],['rivals','Rivals']];
  const badge = unseenKudos();
  document.getElementById('nav').innerHTML = tabs.map(([id,label]) => `
    <button class="tab ${state.tab===id?'on':''}" data-tab="${id}">
      <span class="ic">${ICON[id]}</span><span>${label}</span>
      ${id==='feed' && badge ? '<i class="dot"></i>' : ''}
    </button>`).join('');
}

/* ── identity ── */
function renderPicker(){
  document.getElementById('nav').hidden = true;
  screen().innerHTML = `
    <div class="pick">
      <div class="mark">75 Hard</div>
      <h2>Who's<br>checking in</h2>
      ${PROFILES.map((p,i) => `
        <button class="pick-btn" data-pick="${p.id}">
          <span class="nm">${p.label}</span>
          <span class="ix">0${i+1}</span>
        </button>`).join('')}
      <div class="note" style="margin-top:26px">You can switch later</div>
    </div>`;
  screen().querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => {
      state.me = b.dataset.pick;
      localStorage.setItem('me', state.me);
      haptic(14);
      render();
    };
  });
}

/* ── wall ── */
function viewWall(){
  const ti = todayIndex();
  const show = state.wallView === 'both' ? [me(), them()] : [state.wallView];
  const done = totalComplete(me());
  return `
  <div>
    ${topbar()}
    <div class="switch" id="switch">
      <button class="${state.wallView==='both'?'on':''}" data-wv="both">Both</button>
      <button class="${state.wallView===me()?'on':''}" data-wv="${me()}">You</button>

    </div>

    ${show.map(p => `
      <div class="wall" data-who="${whoAttr(p)}">
        <div class="wall-head">
          <span class="who">${p===me()?'You':nameOf(p)}</span>
          <span class="tally num">${totalComplete(p)} / ${Math.max(0,Math.min(ti,TOTAL_DAYS))}</span>
        </div>
        <div class="grid">${cells(p, ti)}</div>
        <div class="legend">
          <span><i style="background:var(--p)"></i>Done</span>
          <span><i style="background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--miss)"></i>Missed</span>

    <div class="sect" data-who="you">

      <div class="miles">
        ${MILES.map(m => `
          <div class="mile ${done>=m.d?'got':''}">
            <span class="d num">${String(m.d).padStart(2,'0')}</span>
            <span class="nm">${m.nm}</span>
            <span class="ic">${ICON.check}</span>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function cells(p, ti){
  let out = '';
  for(let d = 1; d <= TOTAL_DAYS; d++){
    const iso = isoForDay(d);
    let c = 'cell';
    if(d > ti) c += ' future';
    else if(d === ti) c += ' today' + (isComplete(p,iso) ? ' done' : '');
    else c += isComplete(p,iso) ? ' done' : ' miss';
    if(hasPhoto(p,iso)) c += ' pic';
    out += `<button class="${c}" data-day="${d}" data-prof="${p}" aria-label="Day ${d}"></button>`;
  }
  return out;
}

/* ── feed ── */
function viewFeed(){
  localStorage.setItem('kudosSeen', String(state.reactions.length));
  const posts = [];
  for(const p of PROFILES) for(const iso of state.photoDays[p.id] || []) posts.push({ p:p.id, iso });
  posts.sort((a,b) => a.iso === b.iso ? (a.p === me() ? -1 : 1) : (a.iso < b.iso ? 1 : -1));

  if(!posts.length) return `
    <div class="feed-empty">
      <span class="ic">${ICON.camera}</span>
      <h3>No frames yet</h3>
      <p>Progress photos from both of you land here as one timeline. Post today's from the Today tab.</p>
      <button class="btn primary" style="max-width:220px;margin-top:8px" data-goto="today">Add today's frame</button>
    </div>`;

  return `<div class="feed" id="feed">${posts.map(o => {
    const d = dayIndex(o.iso);
    const n = doneCount(o.p, o.iso);
    const full = n === TASKS.length;
    const c = kudosCount(o.p, o.iso);
    const mine = iGaveKudos(o.p, o.iso);
    const own = o.p === me();
    return `
    <div class="post" data-who="${whoAttr(o.p)}" data-post-p="${o.p}" data-post-iso="${o.iso}">
      <img src="${api.photoUrl(o.p,o.iso)}" alt="Day ${d}" loading="lazy" draggable="false">
      <div class="shade"></div>
      <div class="post-top">
        <span class="who">${own?'You':nameOf(o.p)}</span>
        <span class="dt">${fmtDate(o.iso)}</span>
      </div>
      <div class="post-bot">
        <div class="day num">${d}</div>
        <div class="rule"></div>
        <div class="state">${full ? '<b>All five complete</b>' : n + ' of ' + TASKS.length + ' complete'}</div>
        <button class="kudos ${mine?'mine':''}" ${own?'disabled':''}>
          ${own ? 'Kudos' : (mine ? 'Kudos given' : 'Give kudos')}
          ${c ? `<span class="n">${c}</span>` : ''}
        </button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

    <div class="rv-head">
      <span></span>
      <span class="c" style="color:var(--you)">You</span>
      <span class="c" style="color:var(--them)">${nameOf(b)}</span>
    </div>
    ${row('Perfect days', totalComplete(a), totalComplete(b))}
    ${row('Current streak', streak(a), streak(b))}
    ${row('Longest run', bestStreak(a), bestStreak(b))}
    ${row('Consistency', (ti?Math.round(totalComplete(a)/ti*100):0)+'%', (ti?Math.round(totalComplete(b)/ti*100):0)+'%')}

    <div class="sect">
      <span class="eyebrow">By task</span>
      ${TASKS.map(t => row(t.nm, taskRate(a,t.id)+'%', taskRate(b,t.id)+'%', true)).join('')}
    </div>

    <div class="sect">
      <span class="eyebrow">Record</span>
      ${row('Frames posted', (state.photoDays[a]||[]).length, (state.photoDays[b]||[]).length, true)}
      ${row('Kudos received', state.reactions.filter(r=>r.to===a).length,
                              state.reactions.filter(r=>r.to===b).length, true)}
    </div>
  </div>`;
}

/* ═══════════ wiring ═══════════ */
function wire(){
  const el = screen();

  document.getElementById('nav').querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { if(state.tab !== b.dataset.tab){ state.tab = b.dataset.tab; haptic(6); render(); } };
  });

  const gear = el.querySelector('#gearBtn');
  if(gear) gear.onclick = openSettings;

  el.querySelectorAll('[data-goto]').forEach(b => {
    b.onclick = () => { state.tab = b.dataset.goto; render(); };
  });

  el.querySelectorAll('[data-task]').forEach(b => {
    b.onclick = () => toggleTask(b.dataset.task, b);
  });

  const frame = el.querySelector('#frameBtn');
  if(frame) frame.onclick = () => openDay(me(), todayISO());

  el.querySelectorAll('#switch button').forEach(b => {
    b.onclick = () => { state.wallView = b.dataset.wv; haptic(6); render(); };
  });

  el.querySelectorAll('.cell').forEach(b => {
    b.onclick = () => {
      const d = Number(b.dataset.day);
      if(d > todayIndex()){ toast("Hasn't happened yet"); return; }
      openDay(b.dataset.prof, isoForDay(d));
    };
  });

  const nb = el.querySelector('#newBtn');
  if(nb) nb.onclick = confirmReset;

  el.querySelectorAll('.post').forEach(post => {
    const p = post.dataset.postP, iso = post.dataset.postIso;
    if(p === me()) return;
    const btn = post.querySelector('.kudos');
    if(btn) btn.onclick = e => { e.stopPropagation(); sendKudos(p, iso, post, false); };
    let last = 0;
    post.addEventListener('click', e => {
      if(e.target.closest('.kudos')) return;
      const now = Date.now();
      if(now - last < 320){ last = 0; sendKudos(p, iso, post, true); } else last = now;
    });
  });

  startCountdown();
}

/* ═══════════ actions ═══════════ */
async function toggleTask(taskId, btn){
  const you = me(), iso = todayISO();
  if(!state.data[you][iso]) state.data[you][iso] = {};
  const was = isComplete(you, iso);
  const now = !state.data[you][iso][taskId];
  state.data[you][iso][taskId] = now;

  btn.classList.toggle('on', now);
  if(now){ btn.classList.add('just'); setTimeout(() => btn.classList.remove('just'), 320); }
  refreshToday();
  haptic(now ? 12 : 6);

  if(now && !was && isComplete(you, iso)) showComplete();

  try{ await api.saveDay(you, iso, state.data[you][iso]); state.online = true; }
  catch(_){ toast('Offline — not saved'); }
}

function refreshToday(){
  const you = me(), iso = todayISO();
  const n = doneCount(you, iso), done = n === TASKS.length;

  TASKS.forEach(t => {
    const s = document.querySelector(`[data-seg="${t.id}"]`);
    if(s) s.classList.toggle('on', !!entryOf(you,iso)[t.id]);
  });
  const st = document.querySelector('.hero-foot .state');
  if(st){ st.textContent = done ? 'Complete' : `${word(n)} of five`; st.classList.toggle('done', done); }
  const sv = document.getElementById('streakV');
  if(sv) sv.textContent = streak(you);
  const cd = document.getElementById('cdStat');
  if(cd){
    cd.classList.toggle('risk', !done && msToMidnight()/3600000 < 5);
    const k = cd.querySelector('.eyebrow');
    if(k) k.textContent = done ? 'Next day in' : 'Left today';
  }
}

function showComplete(){
  const ti = todayIndex(), you = me();
  const st = streak(you), total = totalComplete(you);
  const mile = MILES.find(m => m.d === total);
  const el = document.getElementById('done');
  el.setAttribute('data-who','you');
  el.innerHTML = `
    <div class="inner">
      <div class="eyebrow">Day</div>
      <div class="big num">${ti}</div>
      <div class="rule"></div>
      <div class="word">Complete</div>
      <div class="meta">${word(st)} consecutive${mile ? ' — ' + mile.nm : ''}</div>
    </div>`;
  el.classList.add('on');
  haptic([14,50,14]);
  const close = () => { el.style.opacity = '0'; setTimeout(() => { el.classList.remove('on'); el.style.opacity=''; }, 280); };
  el.onclick = close;
  clearTimeout(showComplete._t);
  showComplete._t = setTimeout(close, 1600);
}

async function sendKudos(to, iso, postEl, isDoubleTap){
  if(to === me()) return;
  const had = iGaveKudos(to, iso);
  if(isDoubleTap && had) return;   // double-tap only ever adds
  haptic(12);

  if(isDoubleTap){
    const s = document.createElement('div');
    s.className = 'stamp';
    s.textContent = 'KUDOS';
    postEl.appendChild(s);
    setTimeout(() => s.remove(), 920);
  }

  if(had) state.reactions = state.reactions.filter(r => !(r.to===to && r.date===iso && r.from===me()));
  else state.reactions.push({ from:me(), to, date:iso, emoji:KUDOS_TOKEN });
  paintKudos(postEl, to, iso);

  try{
    await api.react(me(), to, iso, KUDOS_TOKEN);
  }catch(_){
    if(had) state.reactions.push({ from:me(), to, date:iso, emoji:KUDOS_TOKEN });
    else state.reactions = state.reactions.filter(r => !(r.to===to && r.date===iso && r.from===me()));
    paintKudos(postEl, to, iso);
    toast('Kudos failed');
  }
}

function paintKudos(postEl, to, iso){
  const btn = postEl?.querySelector('.kudos');
  if(!btn) return;
  const c = kudosCount(to, iso), mine = iGaveKudos(to, iso);
  btn.classList.toggle('mine', mine);
  btn.innerHTML = `${mine ? 'Kudos given' : 'Give kudos'}${c ? `<span class="n">${c}</span>` : ''}`;
  btn.onclick = e => { e.stopPropagation(); sendKudos(to, iso, postEl, false); };
}

let cdT;
function startCountdown(){
  clearInterval(cdT);
  const tick = () => {
    const v = document.getElementById('cdV');
    if(!v){ clearInterval(cdT); return; }
    v.textContent = fmtLeft(msToMidnight());
  };
  tick();
  cdT = setInterval(tick, 1000);
}

/* ═══════════ sheets ═══════════ */
function openSheet(html, onMount){
  const root = document.getElementById('sheets');
  root.innerHTML = `<div class="scrim"></div><div class="sheet">${html}</div>`;
  requestAnimationFrame(() => root.classList.add('open'));
  root.querySelector('.scrim').onclick = closeSheet;
  if(onMount) onMount(root.querySelector('.sheet'));
}
function closeSheet(){
  const root = document.getElementById('sheets');
  root.classList.remove('open');
  setTimeout(() => { if(!root.classList.contains('open')) root.innerHTML = ''; }, 320);
}

function openDay(prof, iso){
  const d = dayIndex(iso), mine = prof === me();
  const pic = hasPhoto(prof, iso);

  openSheet(`
    <div data-who="${whoAttr(prof)}">
      <div class="sheet-head">
        <div>
          <div class="t num">Day ${d}</div>
          <div class="s">${fmtDate(iso)} — ${mine?'You':nameOf(prof)} — ${doneCount(prof,iso)}/${TASKS.length}</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>

      ${pic ? `<img class="shot" src="${api.photoUrl(prof,iso)}" alt="Day ${d}">`
            : `<div class="shot-none">No frame for this day</div>`}

      ${mine ? `
        <label class="btn primary" style="cursor:pointer;margin-top:0">
          ${pic ? 'Replace frame' : 'Add frame'}
          <input type="file" accept="image/*" capture="environment" id="picIn" hidden>
        </label>
        ${pic ? `<button class="btn danger" id="picDel">Remove frame</button>` : ''}` : ''}

      <div class="tasks" style="margin-top:22px;border-top:none">
        ${TASKS.map(t => `
          <button class="task ${entryOf(prof,iso)[t.id]?'on':''}" data-sheet-task="${t.id}" ${mine?'':'disabled'}>
            <span class="meta"><span class="nm">${t.nm}</span><span class="sub">${t.sub}</span></span>
            <span class="box"><span class="ic">${ICON.check}</span></span>
          </button>`).join('')}
      </div>

      ${mine ? '' : `<div class="note">Read only — only ${nameOf(prof)} can check these</div>`}
    </div>`, sheet => {

    sheet.querySelector('#x').onclick = closeSheet;
    if(!mine) return;

    sheet.querySelectorAll('[data-sheet-task]').forEach(b => {
      b.onclick = async () => {
        const id = b.dataset.sheetTask;
        if(!state.data[prof][iso]) state.data[prof][iso] = {};
        const v = !state.data[prof][iso][id];
        state.data[prof][iso][id] = v;
        b.classList.toggle('on', v);
        if(v){ b.classList.add('just'); setTimeout(()=>b.classList.remove('just'),320); }
        haptic(10);
        const s = sheet.querySelector('.sheet-head .s');
        if(s) s.textContent = `${fmtDate(iso)} — You — ${doneCount(prof,iso)}/${TASKS.length}`;
        try{ await api.saveDay(prof, iso, state.data[prof][iso]); }
        catch(_){ toast('Offline — not saved'); }
      };
    });

    const input = sheet.querySelector('#picIn');
    if(input) input.onchange = async () => {
      const f = input.files && input.files[0];
      if(!f) return;
      try{
        toast('Uploading');
        const blob = await compressImage(f);
        const b64 = await blobToBase64(blob);
        await api.uploadPhoto(prof, iso, 'image/jpeg', b64);
        if(!state.photoDays[prof].includes(iso)) state.photoDays[prof].push(iso);
        state.photoV[`${prof}|${iso}`] = Date.now();
        haptic(16);
        toast('Frame logged');
        closeSheet(); render();
      }catch(_){ toast('Upload failed'); }
      input.value = '';
    };

    const del = sheet.querySelector('#picDel');
    if(del) del.onclick = async () => {
      if(!confirm('Remove this frame?')) return;
      try{
        await api.deletePhoto(prof, iso);
        state.photoDays[prof] = state.photoDays[prof].filter(x => x !== iso);
        toast('Frame removed');
        closeSheet(); render();
      }catch(_){ toast('Delete failed'); }
    };
  });
}

function openSettings(){
  openSheet(`
    <div data-who="you">
      <div class="sheet-head">
        <div>
          <div class="t">${nameOf(me())}</div>
          <div class="s">Started ${fmtDate(state.startDate)}${state.online?'':' — offline'}</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>
      <button class="btn" id="swap">Switch to ${nameOf(them())}</button>
      <button class="btn danger" id="reset">Reset — start a new 75</button>
      <button class="btn ghost" id="close">Close</button>
    </div>`, sheet => {
    sheet.querySelector('#x').onclick = closeSheet;
    sheet.querySelector('#close').onclick = closeSheet;
    sheet.querySelector('#swap').onclick = () => {
      state.me = them();
      localStorage.setItem('me', state.me);
      closeSheet(); render();
      toast(`Tracking as ${nameOf(state.me)}`);
    };
    sheet.querySelector('#reset').onclick = confirmReset;
  });
}

async function confirmReset(){
  if(!confirm('Start a brand new 75 days?\n\nThis erases all tasks, frames and kudos for BOTH of you. It cannot be undone.')) return;
  try{
    const sd = todayISO();
    await api.reset(sd);
    state.startDate = sd;
    state.data = { sachin:{}, aarya:{} };
    state.photoDays = { sachin:[], aarya:[] };
    state.reactions = [];
    state.tab = 'today';
    closeSheet(); render();
    toast('New 75 started');
  }catch(_){ toast('Reset failed'); }
}

/* ═══════════ boot ═══════════ */
async function loadState(){
  try{
    const r = await api.getState();
    state.startDate = r.startDate;
    state.data = r.data || { sachin:{}, aarya:{} };
    state.photoDays = r.photoDays || { sachin:[], aarya:[] };
    state.online = true;
  }catch(_){
    state.online = false;
    state.startDate = state.startDate || todayISO();
    toast('Server unreachable');
  }
  try{
    const r = await api.getReactions();
    state.reactions = r.reactions || [];
  }catch(_){ state.reactions = []; }
}

let lastDay = null;
document.addEventListener('visibilitychange', async () => {
  if(document.hidden) return;
  await loadState();
  if(lastDay !== todayISO()){ lastDay = todayISO(); state.tab = 'today'; }
  render();
});

(async function init(){
  await loadState();
  lastDay = todayISO();
  render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
})();
</script>
