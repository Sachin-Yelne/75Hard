<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lemi">
<link rel="manifest" href="/manifest.json">
<!-- ?v= is bumped whenever the mark is redrawn. iOS reads apple-touch-icon
     once, when the app is added to the Home Screen, and never looks again —
     so the version only matters on a *fresh* add, where it guarantees the new
     file rather than whatever Safari cached the last time. -->
<link rel="icon" href="/icons/icon-192.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<title>Project 75</title>
<style>
:root{
  --ink:#0A0A0B;
  --ink-2:#0F0F11;
  --ink-3:#141416;
  --bone:#F2F1ED;
  --bone-2:#8C8A85;
  --bone-3:#55534F;
  --rule:#1E1E20;
  --rule-2:#2C2C2F;

  --you:#C8613A;
  --them:#6E7F6A;
  --miss:#6A3A2B;

  --display:'Anton',Impact,sans-serif;
  --cond:'Barlow Condensed',sans-serif;
  --body:'Inter',system-ui,sans-serif;

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  /*
   * The bar is two parts: the row the icons live in, and the clearance under it
   * for the home indicator. Splitting them is what lets the bar be short — the
   * row is sized to the icons rather than to a guess, and the footer is sized to
   * the indicator rather than to the whole inset.
   *
   * Twenty off the inset, because the two ways this app gets opened were not
   * landing in the same place. In a browser tab the toolbar covers the bottom
   * and the inset reports 0, so the footer floors at 6 and the bar sits tight.
   * Installed, the inset is a full 34 and the bar was inheriting all of it — a
   * band of black under the icons half again as deep as the icons themselves,
   * in the one mode this thing is actually used in. The home indicator is a 5pt
   * mark sitting about 8pt up, so 14pt leaves the icons a good 24pt clear of the
   * bottom edge and the two modes finally look like the same app.
   */
  --nav-row:42px;
  --nav-foot:max(6px, calc(var(--safe-bot) - 20px));
  --nav:calc(var(--nav-row) + var(--nav-foot));
  --col:520px;
  --pad:20px;
}

[data-who="you"]{--p:var(--you);}
[data-who="them"]{--p:var(--them);}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--ink);color:var(--bone);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left;}
svg{width:100%;height:100%;fill:currentColor;display:block;}

/* type primitives */
.eyebrow{
  font-family:var(--cond);font-weight:600;font-size:11px;line-height:1;
  letter-spacing:.22em;text-transform:uppercase;color:var(--bone-3);
}
.lbl{
  font-family:var(--cond);font-weight:600;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;
}
.num{font-family:var(--display);font-weight:400;letter-spacing:-.01em;font-feature-settings:"tnum";}
.rule{height:1px;background:var(--rule);width:100%;}

/* ── shell ─────────────────────────────── */
#screen{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-top) + 10px) var(--pad) calc(var(--nav) + 40px);
}
#screen.flush{padding:0;overflow:hidden;}
#screen:not(.flush) > *{max-width:var(--col);margin-left:auto;margin-right:auto;}
.feed,.sheet{max-width:var(--col);margin:0 auto;}

/* ── nav ───────────────────────────────── */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:var(--nav);
  /* Leaves --nav-row as the content box, so a tab centres in the icon row and
     the clearance underneath is never something the icons have to sit inside. */
  padding-bottom:var(--nav-foot);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(10,10,11,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);
  padding-left:max(0px,calc((100% - var(--col))/2));
  padding-right:max(0px,calc((100% - var(--col))/2));
}
#nav[hidden]{display:none;}
/*
 * The mark alone, centred. A 10px label under every icon was costing sixteen
 * points of bar — the label, and the gap above it — to name four destinations
 * that are drawn plainly enough and never change. Dropping it is most of why
 * the bar is short now, and it buys the icon room to grow to a size that
 * carries the meaning on its own.
 */
.tab{
  display:flex;align-items:center;justify-content:center;
  color:var(--bone-3);transition:color .18s;position:relative;
}
.tab .ic{width:22px;height:22px;}
.tab.on{color:var(--bone);}
/* Which tab you're on, twice over: the icon at full strength, and a rule at
   the top of the row. With no label to change weight, one signal was thin. */
.tab.on::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:20px;height:1px;background:var(--bone);
}
/* Just off the icon's top-right corner: the icon is 22px centred in the row,
   so 11px up from the middle is its top edge and 15px across clears its side. */
.tab .dot{position:absolute;top:calc(50% - 12px);right:calc(50% - 15px);
  width:4px;height:4px;background:var(--you);}

/* ── topbar ────────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px;}
.top .mark{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.28em;text-transform:uppercase;}
.icon-btn{width:30px;height:30px;padding:7px;color:var(--bone-2);}
.icon-btn:active{color:var(--bone);}
.top-acts{display:flex;align-items:center;gap:4px;}
/* the same dot the Feed tab carries, on the corner of the bubble */
.icon-btn.news{position:relative;}
.icon-btn.news.on::after{content:'';position:absolute;top:4px;right:3px;
  width:5px;height:5px;background:var(--you);}

/* ── hero ──────────────────────────────── */
.hero{padding:22px 0 0;}
.hero .day{
  font-family:var(--display);font-size:clamp(96px,30vw,132px);line-height:.78;
  letter-spacing:-.03em;margin:8px 0 16px;
}
.hero-foot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 16px;}
.hero-foot .state{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;}
.hero-foot .state.done{color:var(--p);}

/* segmented progress */
.seg{display:flex;gap:4px;}
.seg i{flex:1;height:3px;background:var(--rule-2);transition:background .25s;}
.seg i.on{background:var(--p);}

/* stat pair */
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);margin-top:22px;}
.stat{padding:14px 0 16px;}
.stat + .stat{border-left:1px solid var(--rule);padding-left:18px;}
.stat .v{font-family:var(--display);font-size:34px;line-height:1;margin-top:7px;}
.stat.risk .v{color:var(--you);}

/* ── tasks ─────────────────────────────── */
.tasks{border-top:1px solid var(--rule);}
.task{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:16px 0;border-bottom:1px solid var(--rule);
  transition:opacity .2s;
}
.task-main{flex:1;min-width:0;display:block;}
.task-check{flex-shrink:0;display:grid;place-items:center;}
.task .meta{flex:1;min-width:0;}
.task .nm{
  display:block;
  font-family:var(--cond);font-weight:600;font-size:19px;
  letter-spacing:.09em;text-transform:uppercase;line-height:1.05;
  transition:color .2s;
}
.task .sub{display:block;font-size:11.5px;color:var(--bone-3);margin-top:5px;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.task .sub .vd{margin-right:7px;position:relative;top:1px;}
.box{
  width:22px;height:22px;flex-shrink:0;
  border:1px solid var(--rule-2);
  display:grid;place-items:center;color:transparent;
  transition:background .18s,border-color .18s,color .18s;
}
.box .ic{width:11px;height:11px;}
.task.on .box{background:var(--p);border-color:var(--p);color:var(--ink);}
.task.on .nm{color:var(--p);}
.task-main:disabled,.task-check:disabled{cursor:default;}
@keyframes tick{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
.task.just .box{animation:tick .3s ease;}

/* water meter: the row's bottom rule fills as you log */
.task.meter{position:relative;}
.task.meter .fill{
  position:absolute;left:0;bottom:-1px;height:1px;
  background:var(--p);transition:width .45s cubic-bezier(.3,1,.4,1);
}
.task.meter.on .fill{height:2px;}

/* optional per-task photo */
.shot-btn{
  width:34px;height:34px;flex-shrink:0;cursor:pointer;
  border:1px solid var(--rule-2);
  display:grid;place-items:center;overflow:hidden;
  color:var(--bone-3);transition:border-color .18s,color .18s;
}
.shot-btn .ic{width:14px;height:14px;}
.shot-btn:active{border-color:var(--bone-2);}
.shot-btn.filled{border-color:var(--p);padding:0;}
.shot-btn.filled img{width:100%;height:100%;object-fit:cover;display:block;}
.shot-btn.empty{border-style:dashed;opacity:.35;cursor:default;}
.note-btn.filled{border-color:var(--p);color:var(--p);}
.note-btn[disabled]{opacity:.4;}
.note-sheet textarea{
  width:100%;min-height:96px;resize:none;margin-top:12px;padding:12px;
  background:var(--ink-3);border:1px solid var(--rule-2);color:var(--bone);
  font-family:var(--body);font-size:14px;line-height:1.5;letter-spacing:0;
  text-transform:none;
}
.note-sheet textarea:focus{outline:none;border-color:var(--p);}
.shot-btn.filled{position:relative;}
.shot-btn .n{
  position:absolute;right:0;bottom:0;min-width:13px;height:13px;padding:0 2px;
  background:var(--p);color:var(--ink);
  font-family:var(--display);font-size:10px;line-height:13px;text-align:center;
}
@keyframes shotIn{0%{opacity:0;transform:scale(.82)}100%{opacity:1;transform:scale(1)}}
.shot-btn.fresh{animation:shotIn .32s cubic-bezier(.2,1,.3,1);}

/* ── rival strip ───────────────────────── */
.rival{padding:20px 0 0;width:100%;display:block;}
.rival:active{opacity:.62;}
.rival-more{
  margin-top:9px;font-family:var(--cond);font-weight:600;font-size:10.5px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--bone-3);
}
/* a meter's box mirrors the pour, so it reads as state rather than a control */
.task-check.derived .box{opacity:.72;}
.rival-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;}
.rival-head .who{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;}
.rival-head .sc{font-family:var(--display);font-size:15px;color:var(--bone-2);}
.rival-head .sc.done{color:var(--p);}

/* ── frame button ──────────────────────── */
.frame{
  display:flex;align-items:center;gap:13px;width:100%;
  margin-top:26px;padding:16px 16px;
  border:1px solid var(--rule-2);
  cursor:pointer;                 /* empty state is a <label>, not a button */
}
.frame .ic{width:17px;height:17px;color:var(--bone-2);flex-shrink:0;}
.frame .meta{flex:1;min-width:0;}
.frame .nm{display:block;font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.13em;text-transform:uppercase;}
.frame .sub{display:block;font-size:11px;color:var(--bone-3);margin-top:3px;}
.frame.filled{border-color:var(--p);}
.frame.filled .ic{color:var(--p);}
.frame img{width:34px;height:34px;object-fit:cover;flex-shrink:0;}

/* ── wall ──────────────────────────────── */
.switch{display:flex;border:1px solid var(--rule);margin-bottom:26px;}
.switch button{
  flex:1;padding:11px 0;text-align:center;
  font-family:var(--cond);font-weight:600;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bone-3);
  transition:background .18s,color .18s;
}
.switch button + button{border-left:1px solid var(--rule);}
.switch button.on{background:var(--bone);color:var(--ink);}

.wall{margin-bottom:34px;}
.wall-head{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:14px;}
.wall-head .who{font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;}
.wall-head .tally{font-family:var(--display);font-size:16px;color:var(--p);}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
.cell{aspect-ratio:1;background:var(--ink-3);position:relative;transition:opacity .15s;}
.cell:active{opacity:.5;}
.cell.done{background:var(--p);}
.cell.miss{background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--miss);}
.cell.today{background:transparent;box-shadow:inset 0 0 0 1px var(--bone);}
.cell.today.done{background:var(--p);box-shadow:inset 0 0 0 1px var(--bone);}
.cell.future{background:var(--ink-2);}
.cell.pic::after{content:'';position:absolute;bottom:2px;right:2px;width:3px;height:3px;background:var(--bone);opacity:.5;}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;}
.legend span{display:flex;align-items:center;gap:6px;
  font-family:var(--cond);font-weight:500;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);}
.legend i{width:8px;height:8px;display:block;}

/* milestones */
.miles{border-top:1px solid var(--rule);}
.mile{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);}
.mile .d{font-family:var(--display);font-size:14px;color:var(--bone-3);width:26px;flex-shrink:0;}
.mile .nm{flex:1;font-family:var(--cond);font-weight:600;font-size:14px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--bone-3);}
.mile .ic{width:12px;height:12px;color:var(--rule-2);}
.mile.got .d,.mile.got .nm{color:var(--bone);}
.mile.got .ic{color:var(--p);}

/* ── feed ──────────────────────────────── */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
/*
 * A day off screen is not laid out or painted. By the end of a challenge the
 * feed is 150 of these, each holding a collage, a caption block and a comment
 * line, and the browser was doing that work for every one of them on every
 * render — a tab switch, a task ticked, coming back to the app. Now it does it
 * for the two or three you can actually see.
 *
 * Safe against the scroll arithmetic that decides which day is playing because
 * .post is explicitly 100% tall: a skipped element keeps that height rather
 * than guessing at one, so scrollHeight is the same number it always was and
 * no contain-intrinsic-size is needed to prop it up.
 */
.post{height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  position:relative;background:#000;overflow:hidden;content-visibility:auto;}
/* horizontal reel: one slide per photo logged that day */
.reel{
  display:flex;height:100%;width:100%;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.reel::-webkit-scrollbar{display:none;}
.reel[data-single]{overflow-x:hidden;}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;}
.post img{width:100%;height:100%;object-fit:cover;}
/* segmented bar at the top, out of the way of the caption block */
.pips{
  position:absolute;left:var(--pad);right:var(--pad);
  top:calc(var(--safe-top) + 44px);
  display:flex;gap:4px;pointer-events:none;
}
.pips i{flex:1;height:2px;background:rgba(255,255,255,.26);transition:background .2s;}
.pips i.on{background:var(--bone);}
.slot-tag{
  font-family:var(--cond);font-weight:600;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.72);
  margin-bottom:10px;
}
.slot-tag .of{font-family:var(--display);letter-spacing:0;color:rgba(255,255,255,.45);margin-left:4px;}
.slot-tag .vd{margin-right:7px;position:relative;top:1px;}
/* your own meal: the caption is the way in to naming it */
.viewer-bot .slot-tag.edit{pointer-events:auto;}
.slot-tag.edit .tx{border-bottom:1px solid rgba(255,255,255,.28);padding-bottom:3px;}
/*
 * The scrim. Every post has photograph behind its text rather than black, so
 * like the viewer's it ramps early: the extra stop puts real darkness where the
 * caption block *starts* rather than only at the very bottom, which is what a
 * gradient tuned for black underneath was getting wrong — it left the day line
 * to wash out over a bright frame.
 *
 * Where that stop belongs is decided by where the caption starts, so it moves
 * down as the caption shrinks. The block is a little over a third shorter than
 * it was, and holding the ramp where it had been would have been darkening a
 * band of photograph with nothing written on it.
 */
.post .shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.58) 0%,transparent 24%,
    transparent 54%,rgba(0,0,0,.42) 76%,rgba(0,0,0,.92) 100%);}
.post-top{position:absolute;top:calc(var(--safe-top) + 16px);left:var(--pad);right:var(--pad);
  display:flex;justify-content:space-between;align-items:baseline;}
.post-top .who{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;}
.post-top .dt{font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,.6);}
/*
 * The caption block, which is five things stacked over the foot of a
 * photograph: the day, how the day went, the music, the last word said, and the
 * two counts. All five earn their place — but stacked, each on its own full
 * line, they were reaching far enough up the post to bury the bottom row of a
 * three-row grid almost whole.
 *
 * Two of the five lines are gone without losing anything. The counts fold up
 * beside the day number, into space that line already had and inside a height
 * it already occupied — a glyph and a digit are small, and the number they sit
 * beside is 50px, so the row absorbs them.
 *
 * The rule stays where it always was, under the day rather than under the
 * status. Below the status reads better — it would divide what the day was
 * from what is attached to it — but the two rows beneath it are both optional,
 * and someone else's day with no song and nothing said yet would have ended on
 * a hairline underlining nothing. Under the day it can never be the last thing
 * in the block, because the status always renders.
 */
.post-bot{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--nav) + 18px);}
/*
 * The day, said rather than stamped. It used to be a bare 74px numeral under an
 * eyebrow naming the frames — two lines of caption, and the numeral alone was
 * the tallest thing in the post. Now the label carries the word and the number
 * only has to be the number, on one line.
 */
.post-bot .day{display:flex;align-items:baseline;gap:9px;}
.post-bot .day .lb{font-family:var(--cond);font-weight:600;font-size:12px;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.72);}
.post-bot .day .n{font-size:50px;line-height:.82;letter-spacing:-.03em;}
.post-bot .rule{background:rgba(255,255,255,.28);margin:11px 0 10px;}
.post-bot .state{font-family:var(--cond);font-weight:600;font-size:13px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);}
.post-bot .state b{color:var(--p);font-weight:600;}
/* ── music ─────────────────────────────── */
/* One line on the frame: the sleeve, what's playing, and whether it's audible.
   The whole row is the sound toggle — no separate control to find. */
.trk{display:flex;align-items:center;gap:10px;width:100%;margin-top:15px;}
.trk .chg{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.5);flex-shrink:0;}
.trk.add .box{
  width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.35);
  font-family:var(--cond);font-weight:600;font-size:15px;line-height:1;
  color:rgba(255,255,255,.75);
}
.trk.add .nm{color:rgba(255,255,255,.7);}
/*
 * The sound chip: a small mark beside the date saying whether the frame is
 * audible. It announces itself whenever the answer could have changed — a new
 * day under the thumb, a tap, a track added, playback starting or failing —
 * and a beat later settles into whichever resting state it belongs in.
 *
 * Playing rests at full strength: bars moving in time with the song, which is
 * worth looking at and is the reason the whole thing is here. Silence rests at
 * a whisper — it has an explanation to offer, offers it once, then stops
 * asking, while staying a target for the tap that brings the sound back.
 * Neither leaves the frame; the difference is only how loudly it stays.
 */
/* 6px, not 12: the chip's target is wider than its drawing, so the gap that
   looks right is measured to the glyph rather than to the button's edge. */
.post-top .right{display:flex;align-items:center;gap:6px;}
/* No border and no backing: the name and the date sit up here as bare marks on
   the shade, and a boxed control among them reads as chrome. The 24px is a
   thumb-sized target around a 13px drawing, not a shape anyone should see. */
.snd{
  width:24px;height:24px;flex-shrink:0;display:grid;place-items:center;
  color:var(--bone);
  opacity:0;transform:scale(.88);pointer-events:none;
  transition:opacity .34s ease,transform .34s cubic-bezier(.3,1,.4,1);
}
.snd .ic{width:13px;height:13px;}
/* These two glyphs are strokes, not filled outlines like the rest of the set —
   a filled cone and its waves close into a blob at 13px. The global svg rule
   sets a fill, and a stylesheet beats the element's own fill attribute, so the
   override has to live here or the drawing arrives solid. */
.snd svg{fill:none;}
.snd.show{opacity:1;transform:scale(1);pointer-events:auto;}
/* Faint enough to stop reading as a control demanding an answer, solid enough
   to still be findable and hittable on a bright frame. */
.snd.rest{opacity:.24;transform:scale(1);pointer-events:auto;}
/*
 * Playing doesn't recede. The bars are worth watching — they are the one mark
 * on the frame moving in time with something — and a control that never leaves
 * is also always a way to stop the sound, which a chip that faded out was not.
 * Only silence is transient here: it says its piece and then settles back.
 */
.snd.rest[data-on="true"]{opacity:1;}
.snd:active{opacity:1;}
/* Nothing to see, so nothing to animate — the bars are only alive on a chip
   that is actually on screen. */
.snd:not(.show):not(.rest) .eq.on i{animation:none;}
.trk .art{
  width:26px;height:26px;flex-shrink:0;object-fit:cover;display:block;
  background:var(--rule-2);
}
.trk .txt{
  flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;
  font-family:var(--cond);font-weight:600;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.9);
  overflow:hidden;white-space:nowrap;
}
.trk .txt .nm{overflow:hidden;text-overflow:ellipsis;}
.trk .txt .ar{color:rgba(255,255,255,.55);flex-shrink:0;max-width:40%;
  overflow:hidden;text-overflow:ellipsis;}

/* Three bars that move while the sound is on: the chip's audible face, and the
   picker's marker for the row currently auditioning. */
.eq{display:flex;align-items:flex-end;gap:2px;height:13px;flex-shrink:0;}
.eq i{width:2px;height:3px;background:var(--bone);transform-origin:bottom;}
.eq.on i{animation:eqbar .9s ease-in-out infinite;}
.eq.on i:nth-child(2){animation-delay:.18s;animation-duration:1.05s;}
.eq.on i:nth-child(3){animation-delay:.36s;animation-duration:.78s;}
@keyframes eqbar{
  0%,100%{height:3px}
  35%{height:13px}
  70%{height:7px}
}

/* ── music picker ── */
.mus-search{
  width:100%;background:var(--ink-3);border:1px solid var(--rule-2);color:var(--bone);
  padding:14px 12px;font-family:var(--body);font-size:15px;
}
.mus-search:focus{outline:none;border-color:var(--p);}
.mus-search::placeholder{color:var(--bone-3);}
/* the native clear button is a blue cross that belongs to no palette here */
.mus-search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;}
.mus-list{margin-top:6px;}
.mus-row{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 0;border-bottom:1px solid var(--rule);text-align:left;
}
.mus-row .art{width:42px;height:42px;flex-shrink:0;object-fit:cover;display:block;
  background:var(--rule-2);}
.mus-row .meta{flex:1;min-width:0;}
.mus-row .nm{display:block;font-size:13.5px;color:var(--bone);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mus-row .ar{display:block;font-family:var(--cond);font-weight:500;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--bone-3);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mus-row.on .nm{color:var(--p);}
.mus-row .eq{height:14px;}
.mus-row .eq i{background:var(--p);}
.mus-note{font-family:var(--cond);font-weight:500;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);text-align:center;padding:26px 0;}
/* the day sheet's current pick */
.mus-cur{display:flex;align-items:center;gap:11px;border:1px solid var(--rule-2);
  padding:11px;margin-top:10px;width:100%;text-align:left;}
.mus-cur .art{width:36px;height:36px;flex-shrink:0;object-fit:cover;background:var(--rule-2);}
.mus-cur .meta{flex:1;min-width:0;}
.mus-cur .nm{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mus-cur .ar{display:block;font-family:var(--cond);font-weight:500;font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--bone-3);margin-top:3px;}
.mus-cur .go{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-2);flex-shrink:0;}

/* kudos and comments read as one pair: a glyph, and the count if there is one */
.acts{display:flex;align-items:center;gap:8px;margin-top:16px;}
.kudos,.cmt{
  display:inline-flex;align-items:center;gap:9px;
  padding:11px 15px;border:1px solid rgba(255,255,255,.32);
  transition:background .18s,border-color .18s,color .18s;
}
.kudos .ic,.cmt .ic{width:15px;height:15px;display:block;}
.kudos .n,.cmt .n{font-family:var(--display);font-size:13px;letter-spacing:0;line-height:1;}
.kudos.mine{background:var(--you);border-color:var(--you);color:var(--ink);}
.kudos:disabled{opacity:.55;}
/*
 * On a post, the same pair unboxed and moved up beside the day number. The
 * border was doing two jobs — saying "these are pressable" and giving the
 * glyphs a target — and over a photograph it only ever managed the first,
 * as two rectangles across the frame. The target survives as padding, pulled
 * back out by an equal negative margin so the day line keeps its own height;
 * pressable is now said by the mark, the way the reply arrow says it.
 *
 * Kudos given used to fill its box with clay. With no box to fill, the mark
 * itself carries the colour, which is what a thumb turning your own colour
 * meant in the first place.
 */
.post-bot .acts{margin:0 0 0 auto;align-self:center;gap:2px;}
.post-bot .kudos,.post-bot .cmt{
  border:none;background:none;gap:7px;
  padding:10px 7px;margin:-10px 0;
}
.post-bot .kudos .ic,.post-bot .cmt .ic{width:18px;height:18px;}
.post-bot .kudos .n,.post-bot .cmt .n{font-size:14px;}
.post-bot .kudos.mine{color:var(--you);}
.post-bot .kudos:active,.post-bot .cmt:active{opacity:.55;}
/* last word on the frame, one line, tap to open the thread */
.cmt-peek{display:flex;align-items:baseline;gap:9px;width:100%;margin-top:15px;}
.cmt-peek .who{font-family:var(--cond);font-weight:700;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;flex-shrink:0;}
.cmt-peek .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.3;color:rgba(255,255,255,.84);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmt-peek .more{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(255,255,255,.46);flex-shrink:0;}
/* commenter's own colour, never the frame owner's */
.c-a{color:var(--you);}
.c-b{color:var(--them);}
@keyframes stamp{
  0%{transform:translate(-50%,-50%) scale(.7);opacity:0}
  22%{transform:translate(-50%,-50%) scale(1);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.08);opacity:0}
}
.stamp{
  position:absolute;top:50%;left:50%;z-index:5;pointer-events:none;
  font-family:var(--display);font-size:44px;letter-spacing:.04em;
  padding:14px 26px;border:2px solid var(--bone);
  animation:stamp .9s cubic-bezier(.2,.8,.3,1) forwards;
}
.feed-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:0 44px;text-align:center;}
.feed-empty .ic{width:26px;height:26px;color:var(--bone-3);}
.feed-empty h3{font-family:var(--display);font-size:26px;letter-spacing:-.01em;margin:0;}
.feed-empty p{font-size:12.5px;color:var(--bone-3);line-height:1.6;margin:0;}

/* collage: the whole day at once, one tile per frame.
 *
 * The grid fills the post rather than sitting inside it. Square tiles centred
 * in a phone-shaped screen left a band of black above them and another below —
 * on a six-frame day the photographs, which are the whole reason to open this
 * tab, were using about a third of the screen and the rest was nothing. The
 * tracks are fractions now, so the frames take the room instead, and what
 * shapes a tile is how many there are rather than a fixed square (see COLLAGE).
 *
 * Corner to corner, at every count. Stopping the grid above the caption only
 * moved the black band rather than removing it, and put a hard line across the
 * middle of the post where the photographs gave out. The caption rides on the
 * frames instead, exactly as it always has over a lone one — the scrim is what
 * makes that readable, and the bottom band of a post is text territory on any
 * day, which is the fact the row fractions are chosen against.
 */
.collage{position:absolute;inset:0;display:grid;gap:2px;}
.tile{position:relative;overflow:hidden;background:#000;padding:0;min-width:0;min-height:0;}
.tile img{width:100%;height:100%;object-fit:cover;display:block;}
.tile:active{opacity:.72;}
/* the lead frame, on the counts that don't divide evenly into their grid */
.tile.w2{grid-column:span 2;}
.tile.w3{grid-column:span 3;}
.tile .more{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(0,0,0,.58);
  font-family:var(--display);font-size:26px;letter-spacing:-.01em;color:var(--bone);
}

/* full-screen viewer */
#viewer:empty{display:none;}
#viewer .viewer{
  position:fixed;inset:0;z-index:60;background:#000;
  opacity:0;transition:opacity .22s ease;
}
#viewer.open .viewer{opacity:1;}
/*
 * The comments now live at the foot of the frame, so the scrim has to be dark
 * enough *where the text starts*, not only at the very bottom. The extra stop
 * ramps it early; without it the topmost line washes out over a white photo.
 * The middle stays untouched — this is a photo viewer first.
 */
.viewer-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 20%,
    transparent 40%,rgba(0,0,0,.5) 62%,rgba(0,0,0,.93) 100%);}
.viewer .slide img{width:100%;height:100%;object-fit:contain;}
/* A 44px target with a 24px mark inside it: the old one was 20px of button
   with 7px of padding, which left six pixels of actual cross to hit. */
.viewer-x{position:absolute;top:calc(var(--safe-top) + 6px);right:calc(var(--pad) - 10px);z-index:3;
  width:44px;height:44px;padding:10px;color:var(--bone);}
.viewer-bot{position:absolute;left:var(--pad);right:var(--pad);
  bottom:calc(var(--safe-bot) + 26px);pointer-events:none;}
.viewer-bot .acts,.viewer-bot .cmt-peek,.viewer-bot .frame-cap{pointer-events:auto;}
/*
 * What you wrote about this frame, over this frame. Sentence case and softer
 * than the eyebrow above it — this is your voice, not a label. Three lines is
 * as much as belongs over a photograph.
 */
.frame-cap{margin-top:9px;}
.frame-cap .tx{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  font-size:14.5px;line-height:1.4;color:rgba(255,255,255,.88);
}
.frame-cap .tx.add{
  display:inline-block;font-family:var(--cond);font-weight:600;font-size:11.5px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);
  border-bottom:1px solid rgba(255,255,255,.22);padding-bottom:3px;
}
/* only your own frames are yours to caption */
.viewer-bot .frame-cap.edit{cursor:pointer;}
.frame-cap:empty{display:none;}
/* the caption is a sentence, the line under it a label — let them breathe */
.frame-cap + .viewer-meta{margin-top:8px;}
.viewer-meta{font-family:var(--cond);font-weight:600;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.62);}

/* ── rivals ────────────────────────────── */
.rv-head{display:grid;grid-template-columns:1fr auto auto;gap:20px;
  padding-bottom:11px;border-bottom:1px solid var(--rule);}
.rv-head .c{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;width:68px;text-align:right;}
.rv-row{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;
  padding:15px 0;border-bottom:1px solid var(--rule);}
.rv-row .k{font-family:var(--cond);font-weight:600;font-size:14px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--bone-2);}
.rv-row .v{font-family:var(--display);font-size:26px;width:68px;text-align:right;line-height:1;}
.rv-row .v.a{color:var(--you);}
.rv-row .v.b{color:var(--them);}
.rv-row.small .v{font-size:18px;}
.sect{margin-top:36px;}
.sect > .eyebrow{display:block;margin-bottom:14px;}

/* ── sheets ────────────────────────────── */
/* Above the viewer (60), below the completion moment (70): the comment sheet
   opens over an open photo, and #viewer comes later in the DOM. */
#sheets{position:fixed;inset:0;z-index:65;pointer-events:none;}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.7);opacity:0;transition:opacity .26s;}
.sheet{
  position:absolute;left:0;right:0;bottom:var(--kb,0px);
  background:var(--ink-2);border-top:1px solid var(--rule-2);
  padding:20px var(--pad) calc(26px + var(--safe-bot));
  max-height:calc(88% - var(--kb,0px));overflow-y:auto;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.3,1,.4,1),bottom .18s ease,max-height .18s ease;
}
/* the on-screen keyboard lifts the sheet instead of burying the composer */
#sheets.kb .sheet{padding-bottom:20px;}
#sheets.open{pointer-events:auto;}
#sheets.open .scrim{opacity:1;}
#sheets.open .sheet{transform:translateY(0);}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;
  padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:4px;}
.sheet-head .t{font-family:var(--display);font-size:30px;line-height:1;}
.sheet-head .s{font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);margin-top:8px;}
.btn{
  display:block;width:100%;padding:15px;text-align:center;
  font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;
  border:1px solid var(--rule-2);margin-top:10px;transition:background .18s,color .18s;
}
.btn.primary{background:var(--bone);color:var(--ink);border-color:var(--bone);}
.btn.danger{color:var(--you);border-color:var(--miss);}
.btn.ghost{border-color:transparent;color:var(--bone-3);}
/* the meal sheet's reminder of what it was — enough to recognise, not so much
   that the name field falls below the fold */
.shot{width:100%;height:168px;object-fit:cover;display:block;margin-bottom:14px;}
.sheet-shots{
  display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;
  scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.sheet-shots::-webkit-scrollbar{display:none;}
.sheet-shot{margin:0;flex:0 0 78%;scroll-snap-align:start;position:relative;}
.sheet-shot img{width:100%;height:220px;object-fit:cover;display:block;}
.sheet-shot figcaption{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:7px;font-family:var(--cond);font-weight:600;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--bone-3);
}
.sheet-shot .rm{width:14px;height:14px;color:var(--bone-3);flex-shrink:0;}
.sheet-shot .rm:active{color:var(--you);}
/* a named meal reads as itself; the task name is the fallback */
.sheet-shot .cap{display:flex;align-items:center;gap:8px;flex:1;min-width:0;
  font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;}
.sheet-shot .cap .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sheet-shot .cap.named .tx{color:var(--bone);}

/* ── meals ─────────────────────────────── */
/* The verdict is a mark, not a hue: person colour already means something. */
.vd{display:inline-block;width:8px;height:8px;flex-shrink:0;
  border:1px solid var(--bone-3);background:transparent;}
.vd.loved{background:var(--bone);border-color:var(--bone);}
.vd.fine{background:transparent;border-color:var(--bone-2);}
.vd.regret{background:var(--miss);border-color:var(--miss);}
.meal-name{
  width:100%;background:var(--ink-3);border:1px solid var(--rule-2);color:var(--bone);
  padding:14px 12px;font-family:var(--body);font-size:15px;
  line-height:1.45;resize:none;display:block;
}
.meal-name:focus{outline:none;border-color:var(--p);}
.meal-name::placeholder{color:var(--bone-3);}
.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.verdict{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  border:1px solid var(--rule-2);padding:14px 8px;
  font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--bone-3);text-align:center;
  transition:border-color .15s,color .15s;
}
.verdict .vd{width:10px;height:10px;}
.verdict.on{border-color:var(--bone);color:var(--bone);background:var(--ink-3);}
.meal-when{font-family:var(--cond);font-weight:500;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-3);margin-top:16px;text-align:center;}
.shot-none{border:1px solid var(--rule);padding:44px 0;text-align:center;margin-bottom:14px;
  font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-3);}
/* ── water sheet ── */
.wtr-read{display:flex;align-items:baseline;gap:10px;padding:6px 0 14px;}
.wtr-big{font-family:var(--display);font-size:72px;line-height:.8;letter-spacing:-.03em;color:var(--p);}
.wtr-unit{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-3);}
.wtr-bar{height:3px;background:var(--rule-2);}
.wtr-bar i{display:block;height:100%;background:var(--p);transition:width .45s cubic-bezier(.3,1,.4,1);}
.wtr-note{display:flex;justify-content:space-between;margin-top:9px;
  font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-3);}
.wtr-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 11px;}
.wtr-edit{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--bone-2);}
.vessels{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.vessel{
  border:1px solid var(--rule-2);padding:14px 13px;position:relative;
  transition:border-color .15s,background .15s;
}
.vessel:active{border-color:var(--p);}
.vessel .nm{display:block;font-family:var(--cond);font-weight:600;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;}
.vessel .oz{display:block;font-family:var(--display);font-size:22px;color:var(--p);margin-top:6px;}
.vessel .del{position:absolute;top:8px;right:8px;width:11px;height:11px;color:var(--bone-3);}
@keyframes vpulse{0%{transform:scale(1)}45%{transform:scale(.95)}100%{transform:scale(1)}}
.vessel.pulse{animation:vpulse .32s ease;}
.vnew{display:flex;gap:8px;margin-top:8px;}
.vnew input{
  flex:1;min-width:0;background:var(--ink-3);border:1px solid var(--rule-2);color:var(--bone);
  padding:13px 12px;font-family:var(--cond);font-weight:600;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;
}
.vnew input:focus{outline:none;border-color:var(--p);}
.vnew input#vOz{flex:0 0 72px;}
.vnew .vadd{
  flex:0 0 auto;padding:0 18px;background:var(--bone);color:var(--ink);
  font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
}
/* ── what's new ── */
/*
 * One line per thing that happened, and every one of them goes somewhere. No
 * cards: a mark in the person's colour, what they did, what it was about, and
 * when — four columns of plain text separated by a hairline, which is how the
 * rest of this app lists anything.
 */
.nw{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:14px 0;border-bottom:1px solid var(--rule);position:relative;
}
.nw:active{opacity:.6;}
.nw .mk{flex:0 0 18px;display:grid;place-items:center;padding-top:2px;color:var(--p);}
.nw .mk .ic{width:14px;height:14px;display:block;}
.nw .mk .em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:15px;line-height:1;}
.nw .tx{flex:1;min-width:0;}
.nw .hd{display:block;font-size:13px;line-height:1.4;color:var(--bone-2);}
.nw .hd b{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--p);margin-right:5px;}
/* what they said, one line — the thread is one tap away for the rest */
.nw .bd{display:block;margin-top:4px;font-size:12.5px;line-height:1.4;color:var(--bone-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nw .when{flex:0 0 auto;padding-top:3px;font-family:var(--cond);font-weight:500;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-3);}
/* unseen since last time this list was open */
.nw .dot{position:absolute;left:-11px;top:21px;width:5px;height:5px;background:var(--you);}

/* ── comments sheet ── */
/*
 * The thread is the one sheet you scroll a long way down — it opens at the
 * newest line, which on a busy day is well past where the title used to be.
 * So its head stays put: the way out of a conversation shouldn't be somewhere
 * above the fold. Scoped to this sheet, since every other one is short enough
 * to read in a screen.
 */
/*
 * The pull-up cancels the sheet's own top padding and the head carries it
 * instead; the matching -20px offset is because a sticky box stops at the
 * scroller's *content* edge, which that padding had pushed 20px down. Both
 * numbers are the sheet's padding, and together they leave the head sitting
 * in exactly the same place stuck as unstuck.
 */
.cmt-sheet{margin-top:-20px;}
.cmt-sheet .sheet-head{
  position:sticky;top:-20px;z-index:5;background:var(--ink-2);
  margin:0 calc(var(--pad) * -1) 4px;
  padding:20px var(--pad) 16px;
}
/*
 * A comment is a name, a line, and sometimes a reaction. It used to be all of
 * that plus a row of its own for a Reply button, which on a thread of
 * three-word answers meant most of the sheet was space around the words rather
 * than the words. Reply and Delete moved into the hold, so a line that carries
 * nothing takes the height of a line.
 */
.cmt-row{padding:12px 0;border-bottom:1px solid var(--rule);position:relative;}
.cmt-row:first-child{padding-top:4px;}
.cmt-row.pending{opacity:.45;}
.cmt-head{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
.cmt-head .who{font-family:var(--cond);font-weight:700;font-size:12px;
  letter-spacing:.18em;text-transform:uppercase;}
.cmt-head .when{font-family:var(--cond);font-weight:500;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);}
/* which frame it was left on — a label, not a badge */
.cmt-head .on{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-3);}
/* Said since you last had this thread open. Their colour, and a dot in front
   of it — a filled block was a third rectangle in a head that already has two
   labels, and this is findable without reading either way. */
.cmt-head .new{display:inline-flex;align-items:center;gap:5px;
  font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--p);line-height:1;}
.cmt-head .new::before{content:'';width:5px;height:5px;background:var(--p);flex:0 0 auto;}
/*
 * How you answer a line. Replying lived inside the strip a press and hold
 * opens, beside the emoji — a fine place for it once you know the gesture is
 * there, and no place at all until then. Answering someone is what this sheet
 * is for, so it gets a mark that is simply always on the row.
 *
 * At the end of the head, where the line already has empty space: no row of its
 * own under every comment, and nothing added to the height of one. The target
 * is a thumb's worth of padding pulled straight back out by the same negative
 * margin, so the head still measures the height of its text.
 */
.cmt-re{
  margin:-11px -10px -11px auto;padding:11px 10px;
  flex:0 0 auto;color:var(--bone-3);transition:color .16s;
}
.cmt-re svg{width:14px;height:14px;display:block;}
.cmt-re:active{color:var(--bone);}
/* the line the composer is pointed at says so here too, not only in the rule
   down its side and the chip above the box */
.cmt-row.hi > .cmt-main > .cmt-head .cmt-re{color:var(--p);}
.cmt-body{margin:0;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;}
/* A press and hold is the way to react, so the row must not spend that gesture
   on selecting its own text or raising iOS's own callout over the top of it. */
.cmt-main{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}

/*
 * Replies hang off the line they answer, one level deep. The indent's own
 * hairline is the thread: draw a second rule under each reply as well and a
 * three-line exchange starts to look like a spreadsheet.
 */
.cmt-kids{margin:11px 0 0 1px;padding-left:14px;border-left:1px solid var(--rule-2);}
.cmt-kids .cmt-row{padding:0;border-bottom:none;}
.cmt-kids .cmt-row + .cmt-row{margin-top:12px;}
.cmt-kids .cmt-head .who{font-size:11px;}
.cmt-kids .cmt-body{font-size:13.5px;}
/* The line the composer is currently pointed at — the comment itself, not the
   exchange hanging off it, which is why it marks the row's own block. */
.cmt-main{position:relative;}
.cmt-row.hi > .cmt-main::before{content:'';position:absolute;left:-11px;top:1px;bottom:1px;
  width:2px;background:var(--p);}

/*
 * The row's own footer: what has been left on it, and the way to answer it.
 *
 * Nothing in here is boxed, and nothing in here is a button you didn't ask
 * for. Reacting is a press and hold on the line itself, so the footer only
 * ever carries things that actually happened.
 */
.cmt-foot{position:relative;display:flex;align-items:center;gap:1px;flex-wrap:wrap;margin-top:6px;}
/* most lines carry nothing, and an empty row should cost nothing */
.cmt-foot:empty{display:none;}
.pill{
  display:inline-flex;align-items:center;justify-content:center;
  height:28px;padding:0 3px;
  transition:opacity .16s;
}
.pill:active{opacity:.55;}
/*
 * Emoji are the one thing on screen the app doesn't draw — they come off the
 * keyboard and are rendered by the phone, colour and all. Name the emoji faces
 * explicitly so they don't fall back to the text font and arrive as tofu.
 */
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:12.5px;line-height:1;}
/* a pair sits slightly over itself, the way two of anything stacks */
.pill + .pill{margin-left:-7px;}
.pill{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:17px;line-height:1;}
.pill .n{font-family:var(--cond);font-weight:700;font-size:11.5px;letter-spacing:.06em;line-height:1;}
/*
 * One you left carries a clay hairline under it. With two people and no count,
 * that is the whole answer to "am I in this" — and where you have both left
 * the same one, the pair reads as two badges with only the first marked.
 */
.pill.mine{box-shadow:0 2px 0 var(--you);}
@keyframes rxPop{0%{transform:scale(1)}38%{transform:scale(1.3)}100%{transform:scale(1)}}
.pill.pop{animation:rxPop .36s cubic-bezier(.2,1.1,.3,1);}

/*
 * The strip. A floating picker would sit over the very line you are reacting
 * to — so the row grows one strip taller instead. It is one row that scrolls
 * sideways rather than a grid of cells: the ones you use most are already at
 * the front, and everything else is a flick away, which is a smaller gesture
 * than opening a panel and a much smaller one than going to the keyboard.
 *
 * No cells and no border. A tint against the sheet is enough to say the strip
 * is a thing you are inside of, and the emoji are loud enough on their own.
 */
.rx-pick{
  display:flex;gap:2px;padding:4px 2px;min-width:0;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}
/*
 * Everything holding a line offers: the emoji, then what you can do to it.
 *
 * `min-width:0` is doing real work. A flex item won't shrink below the width
 * of its own content by default, and this one wraps a forty-key row — so
 * without it the bar takes the width of every emoji laid end to end, drags the
 * whole comment out to four screens wide, and the row that was supposed to
 * scroll never does.
 */
.rx-bar{flex:0 0 100%;min-width:0;order:9;margin-top:7px;background:var(--ink-3);}
.rx-acts{display:flex;gap:2px;border-top:1px solid var(--rule);}
.rx-acts button{
  flex:1;min-width:0;padding:11px 0;text-align:center;
  font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--bone-2);
}
.rx-acts button:active{color:var(--bone);}
.rx-acts .rm{color:var(--bone-3);}
.rx-acts .rm:active{color:var(--you);}
.rx-pick::-webkit-scrollbar{display:none;}
@keyframes rxIn{from{opacity:0;transform:translateY(7px) scale(.6)}to{opacity:1;transform:none}}
.rx-pick button{
  flex:0 0 44px;height:42px;display:grid;place-items:center;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:23px;line-height:1;
  /* only the first handful are on screen; staggering the rest is wasted motion */
  animation:rxIn .28s cubic-bezier(.2,1.5,.35,1) both;
  animation-delay:calc(min(var(--i), 8) * .026s);
}
/* one you have already left reads as chosen — a rule under it, not a box */
.rx-pick button.mine{box-shadow:0 2px 0 var(--you);}
.rx-pick button:active{opacity:.5;}

/* the double-tap's answer: a mark thrown where the thumb landed */
@keyframes cmtBurst{
  0%{transform:translate(-50%,-50%) scale(.35);opacity:0}
  28%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-150%) scale(1.4);opacity:0}
}
.cmt-burst{
  position:absolute;z-index:6;pointer-events:none;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:36px;line-height:1;
  animation:cmtBurst .78s cubic-bezier(.2,.8,.3,1) forwards;
}
/* a line you just wrote arrives rather than appearing */
@keyframes cmtIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.cmt-row.in{animation:cmtIn .34s cubic-bezier(.2,.9,.3,1) both;}
.cmt-none{border:1px solid var(--rule);padding:34px 0;text-align:center;
  font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-3);}
/*
 * What a new comment is about, said before you write it. A thread covers a
 * whole day, so on a day with several frames "this frame" was a guess — the
 * viewer filed against whatever photo you'd swiped to, and nothing on screen
 * admitted it. This is that answer, and the way to change it.
 * Single-frame days never show it: there is nothing to get wrong.
 */
.cmt-on{margin-top:18px;}
.cmt-on-btn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border-bottom:1px solid var(--rule);padding:8px 1px;
  font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-3);
}
.cmt-on-btn img{width:20px;height:20px;object-fit:cover;flex:0 0 auto;}
.cmt-on-btn .nm{color:var(--bone-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmt-on-btn .ch{margin-left:auto;padding-left:8px;color:var(--p);flex:0 0 auto;}
.cmt-on.open .cmt-on-btn{border-bottom-color:var(--bone-3);color:var(--bone-2);}
/* the frames themselves, since a thumbnail settles it faster than a label */
.cmt-pick{display:flex;gap:6px;overflow-x:auto;padding-top:6px;scrollbar-width:none;}
.cmt-pick::-webkit-scrollbar{display:none;}
.cmt-pick .fr{
  flex:0 0 auto;width:54px;height:54px;background:var(--ink-3);
  border:1px solid var(--rule-2);opacity:.45;transition:opacity .12s;
}
.cmt-pick .fr img{width:100%;height:100%;object-fit:cover;}
.cmt-pick .fr.day{font-family:var(--cond);font-weight:600;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--bone-3);}
.cmt-pick .fr.on{opacity:1;border-color:var(--bone);}
/*
 * Who you are answering, kept in front of you while you type it. It replaces
 * the frame chip rather than sitting beside it: a reply is filed against
 * whatever its parent was filed against, so there is nothing left to choose.
 */
.cmt-to{
  display:flex;align-items:center;gap:9px;margin-top:18px;padding:7px 0 7px 11px;
  border-left:2px solid var(--p);
  animation:cmtIn .24s cubic-bezier(.2,.9,.3,1) both;
}
.cmt-to .ic{width:11px;height:11px;color:var(--p);flex:0 0 auto;}
.cmt-to .lb{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-2);flex:0 0 auto;}
.cmt-to .tx{flex:1;min-width:0;font-size:12px;color:var(--bone-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmt-to .x{width:11px;height:11px;color:var(--bone-3);flex:0 0 auto;}
.cmt-to .x:active{color:var(--bone);}
.cmt-form{display:flex;align-items:flex-end;gap:8px;margin-top:18px;}
/* whichever chip is above the composer already carries the gap */
.cmt-above:not(:empty) + .cmt-form{margin-top:10px;}
.cmt-form textarea{
  flex:1;min-width:0;resize:none;overflow-y:auto;max-height:116px;
  background:var(--ink-3);border:1px solid var(--rule-2);color:var(--bone);
  padding:13px 12px;font-family:var(--body);font-size:13.5px;line-height:1.45;
}
.cmt-form textarea:focus{outline:none;border-color:var(--p);}
.cmt-form textarea::placeholder{color:var(--bone-3);}
.cmt-send{
  flex:0 0 auto;height:46px;padding:0 18px;background:var(--bone);color:var(--ink);
  font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
}
.cmt-send:disabled{opacity:.35;}
.note{font-family:var(--cond);font-weight:500;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);text-align:center;margin-top:16px;}

/* ── identity ──────────────────────────── */
.pick{position:fixed;inset:0;z-index:80;background:var(--ink);
  display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);}
.pick .mark{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--bone-3);}
.pick h2{font-family:var(--display);font-size:clamp(46px,14vw,64px);line-height:.86;
  letter-spacing:-.02em;margin:16px 0 34px;}
.pick-btn{display:flex;align-items:baseline;justify-content:space-between;width:100%;
  padding:20px 0;border-top:1px solid var(--rule);}
.pick-btn:last-of-type{border-bottom:1px solid var(--rule);}
.pick-btn .nm{font-family:var(--cond);font-weight:600;font-size:26px;
  letter-spacing:.1em;text-transform:uppercase;}
.pick-btn .ix{font-family:var(--display);font-size:13px;color:var(--bone-3);}

/* ── completion ────────────────────────── */
#done{
  position:fixed;inset:0;z-index:70;background:var(--ink);
  display:none;flex-direction:column;justify-content:center;padding:0 var(--pad);
  opacity:0;transition:opacity .28s;
}
#done.on{display:flex;opacity:1;}
@keyframes riseIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
#done .inner > *{animation:riseIn .5s cubic-bezier(.2,.9,.3,1) both;}
#done .inner > *:nth-child(2){animation-delay:.05s;}
#done .inner > *:nth-child(3){animation-delay:.1s;}
#done .inner > *:nth-child(4){animation-delay:.14s;}
#done .inner > *:nth-child(5){animation-delay:.18s;}
#done .big{font-family:var(--display);font-size:clamp(104px,32vw,150px);line-height:.76;
  letter-spacing:-.03em;margin:10px 0 20px;}
#done .rule{background:var(--bone);margin-bottom:20px;}
#done .word{font-family:var(--display);font-size:clamp(38px,11vw,52px);line-height:.9;
  letter-spacing:-.01em;color:var(--p);}
#done .meta{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--bone-3);margin-top:22px;}

#toast{
  position:fixed;left:50%;bottom:calc(var(--nav) + 18px);z-index:90;
  transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:var(--bone);color:var(--ink);
  padding:10px 18px;font-family:var(--cond);font-weight:600;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  transition:opacity .22s,transform .22s;
}
#toast.on{opacity:1;transform:translate(-50%,0);}

.boot{height:100%;display:grid;place-items:center;}
.boot span{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--bone-3);}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>

<div id="screen"><div class="boot"><span>Project 75</span></div></div>
<nav id="nav" hidden></nav>
<div id="sheets"></div>
<div id="viewer"></div>
<div id="done"></div>
<div id="toast"></div>

<script>
/* ═══════════ config ═══════════ */
const TOTAL_DAYS = 75;

// `photo:true` gives the task an optional camera slot. Photos never gate
// completion — a task is done when it's checked, with or without one.
// `auto:true` starts the task ticked on any day you check in — it's the one
// you're assumed to be keeping unless you say otherwise, so you only touch it
// to record a failure. See seedDay(): days you never open stay blank, so a
// skipped day is never credited as a success you didn't report.
const TASKS = [
  { id:'diet',     nm:'Diet',        sub:'No cheat meals, no alcohol',        auto:true, photo:true, multi:true, meal:true },
  { id:'workout1', nm:'Workout One', sub:'45 minutes',            photo:true, note:true },
  { id:'workout2', nm:'Workout Two', sub:'45 minutes, outdoors',  photo:true, note:true },
  { id:'water',    nm:'Water',       sub:'1 gallon',              meter:true },
  { id:'read',     nm:'Read',        sub:'10 pages, non-fiction', photo:true }
];

// Base slots, in the order a day reads. 'day' is the daily progress frame;
// the rest mirror the TASKS ids that carry a camera.
//
// The photos table is keyed (profile_id, day_date, slot), so a task that takes
// several shots a day can't reuse one slot — the second upload would overwrite
// the first. A `multi` task therefore stores each shot under `id#<epoch ms>`.
// slot is a text column, so this needs no migration, and the stamp sorts a
// day's meals into the order you ate them.
const DAY_SLOT = 'day';
const SLOT_ORDER = [DAY_SLOT, ...TASKS.filter(t => t.photo).map(t => t.id)];
const MULTI_SLOTS = TASKS.filter(t => t.multi).map(t => t.id);
// A `meal` task's shots are things you ate, so each one can carry a name and a
// verdict rather than just the task's label.
const MEAL_SLOTS = TASKS.filter(t => t.meal).map(t => t.id);
const CAP_MAX = 120;              // a caption, not an essay
const VERDICTS = [
  { id:'loved',  nm:'Loved it' },
  { id:'fine',   nm:'Fine' },
  { id:'regret', nm:'Regret it' }
];
const verdictNm = v => (VERDICTS.find(x => x.id === v) || {}).nm || '';
const MAX_PER_SLOT = 12;          // keeps one runaway day off the free tier
const SLOT_LABEL = {
  day:'Progress frame',
  ...Object.fromEntries(TASKS.map(t => [t.id, t.nm]))
};

const slotBase  = s => String(s).split('#')[0];
const slotStamp = s => Number(String(s).split('#')[1]) || 0;
const slotLabel = s => SLOT_LABEL[slotBase(s)] || 'Photo';
const isKnownSlot = s => {
  const base = slotBase(s);
  if(!SLOT_ORDER.includes(base)) return false;
  return String(s) === base || MULTI_SLOTS.includes(base);
};
const newSlot = id => MULTI_SLOTS.includes(id) ? `${id}#${Date.now()}` : id;

const PROFILES = [
  { id:'sachin', label:'Sachin' },
  { id:'aarya',  label:'Aarya' }
];

const MILES = [
  { d:1,  nm:'First Day' },
  { d:3,  nm:'Momentum' },
  { d:7,  nm:'One Week' },
  { d:14, nm:'Fortnight' },
  { d:21, nm:'Habit Locked' },
  { d:30, nm:'One Month' },
  { d:45, nm:'Past Halfway' },
  { d:60, nm:'Home Stretch' },
  { d:75, nm:'Seventy Five' }
];

// Water is logged incrementally rather than ticked. The boolean stays derived
// from the total so streaks, the wall and completion logic are untouched.
const WATER_GOAL_OZ = 128;                       // 1 US gallon
const DEFAULT_VESSELS = [
  { nm:'Bottle',  oz:16 },
  { nm:'Glass',   oz:8  },
  { nm:'Tumbler', oz:32 }
];

const KUDOS_TOKEN = 'kudos';
const WORDS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
  'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty'];
const word = n => (WORDS[n] || String(n)).toUpperCase();

/*
 * Font Awesome Pro (sharp-light), inlined — only the ones actually used.
 * `thumb` and `comment` are the exceptions: they are drawn here to the same
 * spec (512 box, 32 stroke, square corners, no joins) because the Pro library
 * isn't in the repo. Drop the real `thumbs-up` / `comment` paths in over them
 * if you have `svgs/` to hand.
 */
const ICON = {
  today:'<svg viewBox="0 0 448 512" aria-hidden="true"><path d="M303.5 184.4L338.9 49.8 352 0 310.8 30.9 32 240l0 48 88.3 5.9 32.5 2.2-8.3 31.5L109.1 462.2 96 512l41.2-30.9L416 272l0-48-88.3-5.9-32.5-2.2 8.3-31.5zM154.6 415.1l19.7-74.7 15.4-58.4-60.2-4L74.7 274l204.7-153.5-4.1 15.4-19.7 74.7-15.4 58.4 60.2 4 54.9 3.7L150.5 430.6l4.1-15.4z"/></svg>',
  wall:'<svg viewBox="0 0 512 512" aria-hidden="true"><path d="M64 64l0 128 128 0 0-128L64 64zM32 32l32 0 128 0 32 0 0 32 0 128 0 32-32 0L64 224l-32 0 0-32L32 64l0-32zM64 320l0 128 128 0 0-128L64 320zM32 288l32 0 128 0 32 0 0 32 0 128 0 32-32 0L64 480l-32 0 0-32 0-128 0-32zM448 64L320 64l0 128 128 0 0-128zM320 32l128 0 32 0 0 32 0 128 0 32-32 0-128 0-32 0 0-32 0-128 0-32 32 0zm0 288l0 128 128 0 0-128-128 0zm-32-32l32 0 128 0 32 0 0 32 0 128 0 32-32 0-128 0-32 0 0-32 0-128 0-32z"/></svg>',
  feed:'<svg viewBox="0 0 512 512" aria-hidden="true"><path d="M32 64l0 265.4 84.7-84.7L128 233.4l11.3 11.3L224 329.4 372.7 180.7 384 169.4l11.3 11.3L480 265.4 480 64 32 64zm0 310.6L32 448l73.4 0 96-96L128 278.6l-96 96zm352-160L150.6 448 480 448l0-137.4-96-96zM0 32l32 0 448 0 32 0 0 32 0 384 0 32-32 0L32 480 0 480l0-32L0 64 0 32zM160 144a16 16 0 1 0 -32 0 16 16 0 1 0 32 0zm-64 0a48 48 0 1 1 96 0 48 48 0 1 1 -96 0z"/></svg>',
  rivals:'<svg viewBox="0 0 448 512" aria-hidden="true"><path d="M256 64l0 384-64 0 0-384 64 0zM192 32l-32 0 0 32 0 384 0 32 32 0 64 0 32 0 0-32 0-384 0-32-32 0-64 0zM96 256l0 192-64 0 0-192 64 0zM32 224L0 224l0 32L0 448l0 32 32 0 64 0 32 0 0-32 0-192 0-32-32 0-64 0zm320-96l64 0 0 320-64 0 0-320zM320 96l0 32 0 320 0 32 32 0 64 0 32 0 0-32 0-320 0-32-32 0-64 0-32 0z"/></svg>',
