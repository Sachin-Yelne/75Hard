async function sendKudos(to, iso, postEl, isDoubleTap){
  if(to === me()) return;
  const had = iGaveKudos(to, iso);
  if(isDoubleTap && had) return;   // double-tap only ever adds
  haptic(12);

  if(isDoubleTap){
    const s = document.createElement('div');
    s.className = 'stamp';
    s.textContent = 'KUDOS';
    postEl.appendChild(s);
    setTimeout(() => s.remove(), 920);
  }

  if(had) state.reactions = state.reactions.filter(r => !(r.to===to && r.date===iso && r.from===me()));
  else state.reactions.push({ from:me(), to, date:iso, emoji:KUDOS_TOKEN });
  paintKudos(postEl, to, iso);

  try{
    await api.react(me(), to, iso, KUDOS_TOKEN);
  }catch(_){
    if(had) state.reactions.push({ from:me(), to, date:iso, emoji:KUDOS_TOKEN });
    else state.reactions = state.reactions.filter(r => !(r.to===to && r.date===iso && r.from===me()));
    paintKudos(postEl, to, iso);
    toast('Kudos failed');
  }
}

function paintKudos(postEl, to, iso){
  const btn = postEl?.querySelector('.kudos');
  if(!btn) return;
  const c = kudosCount(to, iso), mine = iGaveKudos(to, iso);
  btn.classList.toggle('mine', mine);
  btn.setAttribute('aria-label', mine ? 'Kudos given' : 'Give kudos');
  btn.innerHTML = `<span class="ic">${ICON.thumb}</span>${c ? `<span class="n">${c}</span>` : ''}`;
  btn.onclick = e => { e.stopPropagation(); sendKudos(to, iso, postEl, false); };
}

/* Bring a post's peek line and comment count back in step, wherever it lives. */
function paintComments(prof, iso){
  document.querySelectorAll(`[data-post-p="${prof}"][data-post-iso="${iso}"]`).forEach(host => {
    const slot = host.querySelector('.cmt-slot');
    if(slot) slot.innerHTML = peekHTML(prof, iso);
    const btn = host.querySelector('.cmt');
    if(btn) btn.outerHTML = cmtHTML(prof, iso);
    bindComments(host, prof, iso, host._cmtSlot || DAY_SLOT);
  });
}

let cdT;
function startCountdown(){
  clearInterval(cdT);
  const tick = () => {
    const v = document.getElementById('cdV');
    if(!v){ clearInterval(cdT); return; }
    v.textContent = fmtLeft(msToMidnight());
  };
  tick();
  cdT = setInterval(tick, 1000);
}

/* ═══════════ sheets ═══════════ */
/*
 * Full-screen photo viewer. The collage answers "what did the day look like";
 * this answers "show me that one". It reuses the reel markup the feed used to
 * carry, so the swipe, pips and caption behave exactly as before — and the
 * double-tap kudos gesture moves here, since a tap on a tile now opens a photo
 * rather than counting toward a double-tap.
 */
function openViewer(p, iso, index){
  const slots = slotsFor(p, iso);
  if(!slots.length) return;
  const start = Math.max(0, Math.min(slots.length - 1, index || 0));
  const multi = slots.length > 1;
  const own = p === me();
  const root = document.getElementById('viewer');

  root.innerHTML = `
    <div class="viewer" data-who="${whoAttr(p)}" data-post-p="${p}" data-post-iso="${iso}">
      <div class="reel"${multi ? '' : ' data-single'}>
        ${slots.map(sl => `
          <div class="slide"><img src="${api.photoUrl(p, iso, sl)}"
            alt="${esc(frameTitle(p, iso, sl))}"></div>`).join('')}
      </div>
      <div class="viewer-shade"></div>
      <button class="icon-btn viewer-x" aria-label="Close">${ICON.close}</button>
      ${multi ? `<div class="pips">${slots.map((sl, i) =>
        `<i class="${i===start?'on':''}"></i>`).join('')}</div>` : ''}
      <div class="viewer-bot">
        <div class="slot-tag" data-slot="${slots[start]}">${frameTag(p, iso, slots[start])}${
          multi ? ` <span class="of">${start+1}/${slots.length}</span>` : ''}</div>
        <div class="frame-cap${own ? ' edit' : ''}">${capLineHTML(p, iso, slots[start], own)}</div>
        <div class="viewer-meta">${own ? 'You' : nameOf(p)} — ${fmtDate(iso)}</div>
        <div class="cmt-slot">${peekHTML(p, iso)}</div>
        <div class="acts">
          ${own ? '' : kudosHTML(p, iso, false)}
          ${cmtHTML(p, iso)}
        </div>
      </div>
    </div>`;

  const view = root.firstElementChild;
  const reel = view.querySelector('.reel');
  // jump to the tapped photo before the first paint, so it never flashes #1
  reel.scrollLeft = start * (reel.clientWidth || window.innerWidth);
  requestAnimationFrame(() => root.classList.add('open'));
  wireReel(view, p, iso);

  view.querySelector('.viewer-x').onclick = closeViewer;

  // Writing a caption from the frame itself — any of yours, not just food.
  // The viewer stays open underneath it.
  const tag = view.querySelector('.slot-tag');
  const cap = view.querySelector('.frame-cap');
  if(own && cap) cap.onclick = e => {
    e.stopPropagation();
    openCaption(p, iso, tag.dataset.slot, { after:() => repaintViewerTag(p, iso) });
  };

  /*
   * Tap the left third to go back, anywhere else to go on — the reading order
   * everyone already has from stories. Swiping still works; this just saves the
   * gesture. Both directions wrap, so no tap is ever a dead one, and a wrap
   * jumps rather than sliding the whole way across the reel.
   *
   * The left zone is a third rather than a half because "next" is the common
   * case and thumbs land on the right.
   */
  if(multi){
    reel.addEventListener('click', e => {
      const w = reel.clientWidth || 1;
      const at = Math.round(reel.scrollLeft / w);
      const back = e.clientX < (reel.getBoundingClientRect().width * 0.33);
      const to = back ? (at - 1 + slots.length) % slots.length
                      : (at + 1) % slots.length;
      const wrapped = back ? to > at : to < at;
      reel.scrollTo({ left: to * w, behavior: wrapped ? 'auto' : 'smooth' });
    });
  }

  const vk = view.querySelector('.kudos');
  if(vk) vk.onclick = (e) => {
    e.stopPropagation();
    sendKudos(p, iso, view, true);
  };

  // A comment written in here is about the frame on screen, not the whole day.
  const shownSlot = () => {
    if(!multi) return slots[0] || DAY_SLOT;
    const w = reel.clientWidth || 1;
    const i = Math.max(0, Math.min(slots.length - 1, Math.round(reel.scrollLeft / w)));
    return slots[i];
  };
  view._cmtSlot = shownSlot;
  bindComments(view, p, iso, shownSlot);
}
/* The viewer outlives the meal sheet opened on top of it, so its caption has to
   catch up once that sheet is done. */
function repaintViewerTag(p, iso){
  const view = document.querySelector('#viewer .viewer');
  const tag = view && view.querySelector('.slot-tag');
  if(!tag) return;
  const slots = slotsFor(p, iso);
  const sl = tag.dataset.slot;
  const i = slots.indexOf(sl);
  const of = slots.length > 1 && i >= 0
    ? ` <span class="of">${i+1}/${slots.length}</span>` : '';
  tag.innerHTML = frameTag(p, iso, sl) + of;
  const cap = view.querySelector('.frame-cap');
  if(cap) cap.innerHTML = capLineHTML(p, iso, sl, p === me());
}

function closeViewer(){
  const root = document.getElementById('viewer');
  root.classList.remove('open');
  setTimeout(() => { if(!root.classList.contains('open')) root.innerHTML = ''; }, 260);
}

function openSheet(html, onMount){
  const root = document.getElementById('sheets');
  if(unwatchKeyboard) unwatchKeyboard();
  root.innerHTML = `<div class="scrim"></div><div class="sheet">${html}</div>`;
  requestAnimationFrame(() => root.classList.add('open'));
  root.querySelector('.scrim').onclick = closeSheet;
  if(onMount) onMount(root.querySelector('.sheet'));
}
function closeSheet(){
  const root = document.getElementById('sheets');
  if(unwatchKeyboard) unwatchKeyboard();
  root.classList.remove('open');
  setTimeout(() => { if(!root.classList.contains('open')) root.innerHTML = ''; }, 320);
}

function openDay(prof, iso){
  const d = dayIndex(iso), mine = prof === me();

  const gallery = () => {
    const slots = slotsFor(prof, iso);
    if(!slots.length){
      return `<div class="shot-none">${mine ? 'No photos yet — all optional' : 'No photos this day'}</div>`;
    }
    return `<div class="sheet-shots">${slots.map(s => {
      const written = !!capText(prof, iso, s);
      const cap = `class="cap${written ? ' named' : ''}"`;
      return `
      <figure class="sheet-shot" data-slot="${s}">
        <img src="${api.photoUrl(prof, iso, s, THUMB)}" alt="${esc(frameTitle(prof, iso, s))}">
        <figcaption>
          ${mine
            ? `<button ${cap} data-cap="${s}"
                 aria-label="${written ? 'Edit caption' : 'Add a caption'}">${frameCaption(prof, iso, s)}</button>`
            : `<span ${cap}>${frameCaption(prof, iso, s)}</span>`}
          ${mine ? `<button class="rm" data-del="${s}" aria-label="Remove">${ICON.close}</button>` : ''}
        </figcaption>
      </figure>`;
    }).join('')}</div>`;
  };

  openSheet(`
    <div data-who="${whoAttr(prof)}">
      <div class="sheet-head">
        <div>
          <div class="t num">Day ${d}</div>
          <div class="s">${fmtDate(iso)} — ${mine?'You':nameOf(prof)} — ${doneCount(prof,iso)}/${TASKS.length}</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>

      <div id="gallery">${gallery()}</div>

      ${mine ? `
        <label class="btn primary" id="frameLabel" style="cursor:pointer;margin-top:0">
          <span class="txt">${hasPhoto(prof, iso, DAY_SLOT) ? 'Replace progress frame' : 'Add progress frame'}</span>
          <input type="file" accept="image/*" data-sheet-shot="${DAY_SLOT}" hidden>
        </label>` : ''}

      <div id="musSlot">${musicRowHTML(prof, iso, mine)}</div>

      <div class="tasks" style="margin-top:22px;border-top:none">
        ${TASKS.map(t => taskRow(prof, iso, t, mine)).join('')}
      </div>

      ${mine
        ? `<div class="note">Task photos are optional</div>`
        : `<div class="note">Read only — only ${nameOf(prof)} can check these</div>`}
    </div>`, sheet => {

    sheet.querySelector('#x').onclick = closeSheet;

    const musBtn = sheet.querySelector('#musBtn');
    if(musBtn) musBtn.onclick = () => openMusic(prof, iso);

    const repaint = () => {
      sheet.querySelector('#gallery').innerHTML = gallery();
      bindGallery();
      const s = sheet.querySelector('.sheet-head .s');
      if(s) s.textContent = `${fmtDate(iso)} — ${mine?'You':nameOf(prof)} — ${doneCount(prof,iso)}/${TASKS.length}`;
      const ft = sheet.querySelector('#frameLabel .txt');
      if(ft) ft.textContent = hasPhoto(prof, iso, DAY_SLOT) ? 'Replace progress frame' : 'Add progress frame';
    };

    function bindGallery(){
      if(!mine) return;
      sheet.querySelectorAll('[data-cap]').forEach(b => {
        b.onclick = () => openCaption(prof, iso, b.dataset.cap, { after:() => openDay(prof, iso) });
      });
      sheet.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = async () => {
          const slot = b.dataset.del;
          if(!confirm(`Remove the ${frameTitle(prof, iso, slot).toLowerCase()} photo?`)) return;
          try{
            await api.deletePhoto(prof, iso, slot);
            removePhotoLocal(prof, iso, slot);
            toast('Photo removed');
            // the caption goes with the photo rather than outliving it
            if(dropCaption(prof, iso, slot)){
              try{ await api.saveDay(prof, iso, state.data[prof][iso]); }
              catch(_){ toast('Offline — caption not cleared'); }
            }
            repaint();
            refreshSheetTaskShot(sheet, prof, iso, slot);
          }catch(_){ toast('Delete failed'); }
        };
      });
    }
    bindGallery();

    // the water row opens its tracker instead of toggling — readable either way,
    // so this is bound before the read-only bail-out
    sheet.querySelectorAll('[data-meter]').forEach(b => {
      b.onclick = () => { closeSheet(); setTimeout(() => openWater(prof, iso), 340); };
    });

    if(!mine) return;

    sheet.querySelectorAll('[data-task]').forEach(b => {
      b.onclick = async () => {
        const id = b.dataset.task;
        const row = b.closest('.task');
        seedDay(prof, iso);
        if(TASKS.find(t => t.id === id)?.meter){ openWater(prof, iso); return; }
        const v = !state.data[prof][iso][id];
        state.data[prof][iso][id] = v;
        row.classList.toggle('on', v);
        if(v){ row.classList.add('just'); setTimeout(()=>row.classList.remove('just'),320); }
        haptic(10);
        const s = sheet.querySelector('.sheet-head .s');
        if(s) s.textContent = `${fmtDate(iso)} — You — ${doneCount(prof,iso)}/${TASKS.length}`;
        try{ await api.saveDay(prof, iso, state.data[prof][iso]); }
        catch(_){ toast('Offline — not saved'); }
      };
    });

    sheet.querySelectorAll('[data-note]').forEach(b => {
      b.onclick = () => { if(mine) openNote(prof, iso, b.dataset.note); };
    });

    // any file input in the sheet: the progress frame or a task slot
    const bindInputs = () => {
      sheet.querySelectorAll('[data-sheet-shot],[data-shot]').forEach(input => {
        input.onchange = async () => {
          const slot = input.dataset.sheetShot || newSlot(input.dataset.shot);
          const file = input.files && input.files[0];
          input.value = '';
          if(!file) return;
          try{
            toast('Uploading');
            const { full, thumb } = await renditions(file);
            const [b64, t64] = await Promise.all([blobToBase64(full), thumb ? blobToBase64(thumb) : null]);
            await api.uploadPhoto(prof, iso, slot, 'image/jpeg', b64, t64);
            addPhotoLocal(prof, iso, slot);
            haptic(16);
            toast(slot === DAY_SLOT ? 'Frame logged' : `${slotLabel(slot)} photo added`);
            repaint();
            refreshSheetTaskShot(sheet, prof, iso, slot);
            bindInputs();
            // caption it now, then hand the day sheet back
            openCaption(prof, iso, slot, { fresh:true, after:() => openDay(prof, iso) });
          }catch(_){ toast('Upload failed'); }
        };
      });
    };
    bindInputs();

    // a filled thumbnail inside the sheet just scrolls up to the gallery
    sheet.querySelectorAll('[data-open-slot]').forEach(b => {
      b.onclick = () => sheet.scrollTo({ top:0, behavior:'smooth' });
    });
  });
}

/* The day sheet's music line: what's on the day, and the way to change it. */
function musicRowHTML(prof, iso, mine){
  const t = trackOf(prof, iso);
  if(!t && !mine) return '';
  const inner = t
    ? `<img class="art" src="${esc(t.art || '')}" alt="" loading="lazy">
       <span class="meta">
         <span class="nm">${esc(t.nm)}</span>
         <span class="ar">${esc(t.ar || '')}</span>
       </span>
       ${mine ? '<span class="go">Change</span>' : ''}`
    : `<span class="meta">
         <span class="nm">Add music</span>
         <span class="ar">30 seconds on the post</span>
       </span>
       <span class="go">Pick</span>`;
  // a post is made of photos, so music on a dayless-of-photos day has nowhere
  // to show yet — say so rather than let it look broken
  const pending = t && !slotsFor(prof, iso).length
    ? `<div class="note" style="margin-top:9px">Plays on the feed once the day has a photo</div>` : '';
  return (mine
    ? `<button class="mus-cur" id="musBtn">${inner}</button>`
    : `<div class="mus-cur">${inner}</div>`) + pending;
}

/* Swap a sheet task row's camera/thumbnail after its photo changes. */
function refreshSheetTaskShot(sheet, prof, iso, slot){
  const row = sheet.querySelector(`.task[data-row="${slot}"]`);
  if(!row) return;
  const t = TASKS.find(x => x.id === slot);
  if(!t || !t.photo) return;
  const old = row.querySelector('.shot-btn');
  if(!old) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = taskRow(prof, iso, t, prof === me()).trim();
  const fresh = wrap.firstChild.querySelector('.shot-btn');
  if(fresh) old.replaceWith(fresh);
}

/* ── task note ── */
/*
 * Say what you did instead of showing it. Stored under `notes` in the day's
 * existing tasks JSONB, so this needed no schema change and rides along with
 * the save that was already happening.
 */
function openNote(prof, iso, taskId){
  const t = TASKS.find(x => x.id === taskId);
  const existing = noteOf(prof, iso, taskId);

  openSheet(`
    <div data-who="${whoAttr(prof)}" class="note-sheet">
      <div class="sheet-head">
        <div>
          <div class="t">${t.nm}</div>
          <div class="s">Day ${dayIndex(iso)} — what did you do?</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>
      <textarea id="nText" maxlength="280" placeholder="Ran 5k, easy pace">${existing}</textarea>
      <button class="btn primary" id="nSave">Save</button>
      ${existing ? `<button class="btn ghost" id="nClear">Remove note</button>` : ''}
    </div>`, sheet => {
    const box = sheet.querySelector('#nText');
    sheet.querySelector('#x').onclick = closeSheet;
    box.focus();
    // put the caret at the end rather than selecting what is already there
    box.setSelectionRange(box.value.length, box.value.length);

    sheet.querySelector('#nSave').onclick = () => saveNote(prof, iso, taskId, box.value);
    const clear = sheet.querySelector('#nClear');
    if(clear) clear.onclick = () => saveNote(prof, iso, taskId, '');
  });
}

async function saveNote(prof, iso, taskId, text){
  seedDay(prof, iso);
  const entry = state.data[prof][iso];
  const notes = (entry.notes ||= {});
  const clean = text.trim();
  if(clean) notes[taskId] = clean; else delete notes[taskId];
  if(!Object.keys(notes).length) delete entry.notes;

  closeSheet(); render();
  try{ await api.saveDay(prof, iso, entry); state.online = true; toast(clean ? 'Note saved' : 'Note removed'); }
  catch(_){ toast('Offline — not saved'); }
}

/* ── music ── */
/*
 * Pick a song for the day. Search proxies through /api/music to Apple's
 * catalogue; tapping a result plays its 30-second preview straight away, so
 * choosing is by ear rather than by title. Add attaches the one you're hearing.
 */
function openMusic(prof, iso){
  const current = trackOf(prof, iso);
  let results = [], picked = null, busy = false, typed = false, timer = null;

  const list = () => {
    if(busy) return `<div class="mus-note">Searching…</div>`;
    if(!results.length){
      return `<div class="mus-note">${typed ? 'Nothing found' : 'Search for a song'}</div>`;
    }
    return `<div class="mus-list">${results.map((t, i) => `
      <button class="mus-row ${picked && picked.id === t.id ? 'on' : ''}" data-i="${i}">
        <img class="art" src="${esc(t.art || '')}" alt="" loading="lazy">
        <span class="meta">
          <span class="nm">${esc(t.nm)}</span>
          <span class="ar">${esc(t.ar || '')}</span>
        </span>
        ${picked && picked.id === t.id
          ? '<span class="eq on"><i></i><i></i><i></i></span>' : ''}
      </button>`).join('')}</div>`;
  };

  openSheet(`
    <div data-who="${whoAttr(prof)}">
      <div class="sheet-head">
        <div>
          <div class="t">Music</div>
          <div class="s">Day ${dayIndex(iso)} — 30 seconds on the post</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>

      <input id="mq" class="mus-search" type="search" enterkeyhint="search"
             placeholder="Song or artist" value="">
      <div id="mList">${list()}</div>

      <button class="btn primary" id="mAdd" disabled>Add to this day</button>
      ${current ? `<button class="btn ghost" id="mDrop">Remove music</button>` : ''}
    </div>`, sheet => {

    const box = sheet.querySelector('#mList');
    const q = sheet.querySelector('#mq');
    const add = sheet.querySelector('#mAdd');

    const repaint = () => {
      box.innerHTML = list();
      box.querySelectorAll('[data-i]').forEach(b => {
        b.onclick = () => {
          picked = results[Number(b.dataset.i)];
          add.disabled = false;
          add.textContent = `Add ${picked.nm.length > 22 ? 'this song' : picked.nm}`;
          auditionTrack(picked.url);
          haptic(8);
          repaint();
        };
      });
    };

    const run = async () => {
      const term = q.value.trim();
      if(term.length < 2){ results = []; typed = false; repaint(); return; }
      typed = true; busy = true; repaint();
      try{
        const r = await api.searchMusic(term);
        results = r.tracks || [];
      }catch(_){
        results = [];
        toast('Music search failed');
      }
      busy = false;
      repaint();
    };

    sheet.querySelector('#x').onclick = () => { closeSheet(); musicResume(); };
    q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 350); });
    add.onclick = () => { if(picked) saveTrack(prof, iso, picked); };
    const drop = sheet.querySelector('#mDrop');
    if(drop) drop.onclick = () => saveTrack(prof, iso, null);

    watchKeyboard();
    q.focus();
    repaint();
  });
}

/* Whatever the picker was auditioning stops; the feed takes its track back. */
function musicResume(){
  const a = music.el;
  if(!a) return;
  if(music.on && music.at) musicApply();
  else { a.pause(); music.loaded = null; }
}

async function saveTrack(prof, iso, t){
  seedDay(prof, iso);
  const entry = state.data[prof][iso];
  if(t) entry.track = { id:t.id, nm:t.nm, ar:t.ar, art:t.art, url:t.url };
  else delete entry.track;

  closeSheet();
  music.loaded = null;          // the post's own track reloads on next apply
  render();
  musicResume();
  try{
    await api.saveDay(prof, iso, entry);
    state.online = true;
    toast(t ? 'Music added' : 'Music removed');
  }catch(_){ toast('Offline — not saved'); }
}

/* ── captions ── */
/*
 * Say what a photo is. Opens by itself the moment any photo lands — that is the
 * one moment you reliably remember — and can be reopened later by tapping the
 * caption on the frame, or its line in the day sheet's gallery. Skipping is
 * fine: an uncaptioned frame simply reads as its task, as it always did.
 *
 * Diet frames also offer a verdict. Nothing else does.
 *
 * Stored under `caps` in the day's tasks JSONB, keyed by the photo's own slot,
 * so it rides the save that was already happening and needs no schema change.
 */
const CAP_PROMPT = {
  day:      { ask:'This frame',          hint:'Day 21, and it shows' },
  diet:     { ask:'What was it?',        hint:'Blueberries — liked it' },
  workout1: { ask:'What did you do?',    hint:'5k, easy pace' },
  workout2: { ask:'What did you do?',    hint:'Hill loop, sunset' },
  read:     { ask:'What did you read?',  hint:'Ten pages of Dune' }
};

function openCaption(prof, iso, slot, opts = {}){
  const { fresh = false, after = null } = opts;
  const meal = isMealSlot(slot);
  const prompt = CAP_PROMPT[slotBase(slot)] || { ask:'Add a caption', hint:'A few words' };
  const existing = capOf(prof, iso, slot) || {};
  // a workout's written note stands in until the frame has a caption of its own
  const text = existing.nm != null ? existing.nm : capText(prof, iso, slot);
  let verdict = existing.v || '';
  // opened from a sheet, so hand that sheet back once this one is done with
  const andThen = () => { if(after) setTimeout(after, 340); };

  const shot = () => hasPhoto(prof, iso, slot)
    ? `<img class="shot" src="${api.photoUrl(prof, iso, slot)}" alt="">` : '';

  const stamp = slotStamp(slot);
  const when = stamp
    ? `${slotLabel(slot)}, ${new Date(stamp).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' })}`
    : slotLabel(slot);

  openSheet(`
    <div data-who="${whoAttr(prof)}">
      <div class="sheet-head">
        <div>
          <div class="t">${fresh || !text ? prompt.ask : 'Edit caption'}</div>
          <div class="s">Day ${dayIndex(iso)} — ${esc(when)}</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>

      ${shot()}
      <textarea id="mName" class="meal-name" rows="2" maxlength="${CAP_MAX}"
        placeholder="${esc(prompt.hint)}">${esc(text || '')}</textarea>
      ${meal ? `<div class="verdicts">
        ${VERDICTS.map(v => `
          <button class="verdict ${verdict === v.id ? 'on' : ''}" data-v="${v.id}">
            <i class="vd ${v.id}"></i><span>${v.nm}</span>
          </button>`).join('')}
      </div>` : ''}

      <button class="btn primary" id="mSave">Save</button>
      ${fresh
        ? `<button class="btn ghost" id="mSkip">Skip</button>`
        : (text || verdict)
          ? `<button class="btn ghost" id="mClear">Remove caption</button>` : ''}
      ${fresh ? `<div class="meal-when">You can write it later from the photo</div>` : ''}
    </div>`, sheet => {

    const name = sheet.querySelector('#mName');
    sheet.querySelector('#x').onclick = () => { closeSheet(); andThen(); };

    sheet.querySelectorAll('[data-v]').forEach(b => {
      b.onclick = () => {
        // tapping the chosen verdict again clears it — a meal can just be a meal
        verdict = verdict === b.dataset.v ? '' : b.dataset.v;
        sheet.querySelectorAll('[data-v]').forEach(x =>
          x.classList.toggle('on', x.dataset.v === verdict));
        haptic(8);
      };
    });

    // saveCaption closes the sheet synchronously, so the handback can follow it
    sheet.querySelector('#mSave').onclick = () => {
      saveCaption(prof, iso, slot, name.value, verdict); andThen();
    };
    const skip = sheet.querySelector('#mSkip');
    if(skip) skip.onclick = () => { closeSheet(); andThen(); };
    const clear = sheet.querySelector('#mClear');
    if(clear) clear.onclick = () => { saveCaption(prof, iso, slot, '', ''); andThen(); };

    watchKeyboard();
    name.focus();
    name.setSelectionRange(name.value.length, name.value.length);
  });
}

async function saveCaption(prof, iso, slot, nm, v){
  seedDay(prof, iso);
  const entry = state.data[prof][iso];
  const caps = (entry.caps ||= {});
  const clean = String(nm || '').trim().slice(0, CAP_MAX);

  if(clean || v) caps[slot] = v ? { nm:clean, v } : { nm:clean };
  else delete caps[slot];
  // whatever this slot said under the old key, `caps` is the answer now
  if(entry.meals){
    delete entry.meals[slot];
    if(!Object.keys(entry.meals).length) delete entry.meals;
  }
  if(!Object.keys(caps).length) delete entry.caps;

  closeSheet(); render();
  try{
    await api.saveDay(prof, iso, entry);
    state.online = true;
    // the frame already shows the words; the toast only confirms the save
    toast(clean || v ? 'Caption saved' : 'Caption removed');
  }catch(_){ toast('Offline — not saved'); }
}

/* A deleted photo takes its caption with it, rather than leaving an orphan. */
function dropCaption(prof, iso, slot){
  const entry = state.data[prof]?.[iso];
  if(!entry) return false;
  let hit = false;
  for(const key of ['caps', 'meals']){
    if(entry[key] && entry[key][slot]){
      delete entry[key][slot];
      if(!Object.keys(entry[key]).length) delete entry[key];
      hit = true;
    }
  }
  return hit;
}

/* ── what's new ── */
/*
 * Everything the other person has done to you, in one list, newest first. The
 * push notification and the row in here are the same event — this is where it
 * lives once you've swiped the alert away, or once you've been away for a day
 * and never had one.
 *
 * Every row goes somewhere: tapping one opens the thread it came from, on the
 * frame it was left against, which is the only thing you ever want next.
 */
function openNews(){
  const items = activity();
  // what counted as new is stamped before the list is drawn, so this reading
  // shows the dots and the next one doesn't
  const seen = localStorage.getItem(NEWS_SEEN) || '';
  markNewsSeen();

  const WHAT = {
    reply:    () => 'replied to your comment',
    answer:   a => `replied in your Day ${dayIndex(a.date)} thread`,
    comment:  a => `commented on Day ${dayIndex(a.date)}`,
    reaction: () => 'reacted to your comment',
    kudos:    a => `sent kudos on Day ${dayIndex(a.date)}`
  };

  const row = a => `
    <button class="nw" data-prof="${a.prof}" data-date="${a.date}"
      data-slot="${esc(a.slot || DAY_SLOT)}" data-who="${whoAttr(a.who)}">
      <span class="mk">${a.kind === 'reaction'
        ? `<span class="em">${esc(a.emoji)}</span>`
        : `<span class="ic">${a.kind === 'kudos' ? ICON.thumb : ICON.comment}</span>`}</span>
      <span class="tx">
        <span class="hd">
          <b>${a.who === me() ? 'You' : esc(nameOf(a.who))}</b> ${WHAT[a.kind](a)}
        </span>
        ${a.body ? `<span class="bd">${esc(a.body)}</span>` : ''}
      </span>
      <span class="when">${fmtAgo(a.at)}</span>
      ${String(a.at) > seen ? '<span class="dot"></span>' : ''}
    </button>`;

  openSheet(`
    <div class="cmt-sheet" data-who="you">
      <div class="sheet-head">
        <div>
          <div class="t">What's new</div>
          <div class="s">${items.length ? `From ${nameOf(them())}` : 'Nothing yet'}</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>
      <div class="nw-list">
        ${items.length ? items.map(row).join('')
          : `<div class="cmt-none">Nothing from ${nameOf(them())} yet</div>`}
      </div>
    </div>`, sheet => {
    sheet.querySelector('#x').onclick = closeSheet;
    sheet.querySelectorAll('.nw').forEach(b => {
      b.onclick = () => {
        const { prof, date, slot } = b.dataset;
        haptic(8);
        // straight into the conversation it came from, on the right frame
        openComments(prof, date, slot);
      };
    });
    // the dot on the bubble goes as soon as the list has been looked at
    render();
  });
}

/* ── comments ── */
/*
 * A thread, opened over the post it belongs to. Three things happen in here:
 * you read what has been said, you answer one particular line of it, and you
 * leave a mark on a line without saying anything at all.
 */
function openComments(prof, iso, slot = DAY_SLOT){
  const own = prof === me();
  const slots = slotsFor(prof, iso);
  // On a single-frame day there is nothing to disambiguate, so no slot tags.
  const tagged = s => slots.length > 1 && s && s !== DAY_SLOT && slots.includes(s);

  /*
   * What the next comment gets filed against. It arrives as whatever you were
   * looking at, but it is not fixed: swipe one photo too far and the fix is
   * here rather than back out through the viewer.
   *
   * The day's own progress frame *is* DAY_SLOT, so "the whole day" and "the
   * progress frame" are the same string — which is why a day that carries one
   * needs no separate whole-day option.
   */
  const picks = slots.includes(DAY_SLOT) ? slots : [DAY_SLOT, ...slots];
  // a slot the day no longer carries (a deleted frame) falls back to the day
  let target = picks.includes(slot) ? slot : DAY_SLOT;
  const canPick = slots.length > 1;
  const targetName = () => slots.includes(target) ? slotLabel(target) : 'The whole day';

  // the line being answered and the row whose strip is open: both are this
  // sheet's business only, and neither outlives it
  let replyTo = null;
  let picking = null;

  /*
   * What counts as new is whatever arrived since you last had this thread
   * open. Stamped on the way in rather than on the way out, so the marks stay
   * up for this reading and are gone by the next one — which is the only
   * behaviour a "New" tag can have without lying to you.
   */
  const readKey = `cmtRead:${prof}:${iso}`;
  const readAt = Number(localStorage.getItem(readKey) || 0);
  localStorage.setItem(readKey, String(Date.now()));

  const find = id => state.comments.find(c => c.id === id);
  const live = id => Number.isInteger(id);   // a line still in flight has no id

  /* ── the thread ── */

  /*
   * What holding a line offers: the emoji in one row you can flick through,
   * and under them the things you can do to it.
   *
   * Reply and Delete live here rather than under every comment. Standing
   * controls cost a line of their own on every single row — on a thread of
   * three-word answers that was more furniture than conversation — and both
   * are things you do to a particular line, which is exactly what holding one
   * says you are about to do.
   */
  const pickHTML = (c) => `
    <div class="rx-bar">
      <div class="rx-pick">
        ${rxQuick().map((e, i) => `
          <button style="--i:${i}" type="button" data-rx="${esc(e)}" data-on="${c.id}"
            class="${iReacted(c.id, e) ? 'mine' : ''}" aria-label="React ${esc(e)}">${esc(e)}</button>`).join('')}
      </div>
      <div class="rx-acts">
        <button type="button" data-reply="${c.id}">Reply</button>
        ${c.from === me() ? `<button type="button" class="rm" data-rm="${c.id}">Delete</button>` : ''}
      </div>
    </div>`;

  /*
   * The reactions on one line, and the way to answer it.
   *
   * One badge per person rather than one badge and a number. There are two of
   * you: a count can only ever say 1 or 2, which is a digit doing the work a
   * second copy of the emoji does better and quieter. Yours carries the clay
   * hairline, so a pair still says which one you left.
   */
  const footHTML = (c) => `
    ${rxOn(c.id).flatMap(r => Array.from({ length: r.n }, (_, i) => `
      <button class="pill${r.mine && i === 0 ? ' mine' : ''}" data-rx="${esc(r.e)}"
        data-on="${c.id}" aria-pressed="${r.mine}" aria-label="${esc(r.e)}"
        >${esc(r.e)}</button>`)).join('')}
    ${picking === c.id ? pickHTML(c) : ''}`;

  const rowHTML = (c, kids) => {
    const mine = c.from === me();
    return `
    <article class="cmt-row${c.pending ? ' pending' : ''}${replyTo === c.id ? ' hi' : ''}"
             data-id="${c.id}" data-who="${whoAttr(c.from)}">
      <div class="cmt-main">
        <div class="cmt-head">
          <span class="who ${mine ? 'c-a' : 'c-b'}">${mine ? 'You' : nameOf(c.from)}</span>
          <span class="when">${fmtAgo(c.at)}</span>
          ${c.parent == null && tagged(c.slot) ? `<span class="on">${slotLabel(c.slot)}</span>` : ''}
          ${!mine && new Date(c.at).getTime() > readAt ? '<span class="new">New</span>' : ''}
          ${c.pending ? '' : `<button class="cmt-re" type="button" data-reply="${c.id}"
            aria-label="Reply to ${mine ? 'yourself' : esc(nameOf(c.from))}">${ICON.reply}</button>`}
        </div>
        <p class="cmt-body">${esc(c.body)}</p>
        ${c.pending ? '' : `<div class="cmt-foot">${footHTML(c)}</div>`}
      </div>
      ${kids && kids.length ? `<div class="cmt-kids">${kids.map(k => rowHTML(k)).join('')}</div>` : ''}
    </article>`;
  };

  const thread = () => {
    const list = commentsOn(prof, iso);
    if(!list.length){
      return `<div class="cmt-none">${own ? 'Nothing said yet' : 'Say the first thing'}</div>`;
    }
    // Replies are one level deep: an answer to an answer joins the same
    // exchange rather than starting a third column. A reply whose parent has
    // since been deleted reads as a line of its own rather than disappearing.
    const here = id => list.some(c => c.id === id);
    return list
      .filter(c => c.parent == null || !here(c.parent))
      .map(c => rowHTML(c, list.filter(k => k.parent === c.id)))
      .join('');
  };

  openSheet(`
    <div class="cmt-sheet" data-who="${whoAttr(prof)}">
      <div class="sheet-head">
        <div>
          <div class="t">Comments</div>
          <div class="s">Day ${dayIndex(iso)} — ${own ? 'Your frame' : nameOf(prof) + "'s frame"}</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>

      <div id="thread">${thread()}</div>

      <div class="cmt-above" id="above"></div>

      <form class="cmt-form" id="cForm">
        <textarea id="cInput" rows="1" maxlength="280" enterkeyhint="enter"></textarea>
        <button class="cmt-send" id="cSend" type="submit">Post</button>
      </form>
    </div>`, sheet => {

    const box = sheet.querySelector('#thread');
    const ta  = sheet.querySelector('#cInput');
    const send = sheet.querySelector('#cSend');
    const above = sheet.querySelector('#above');

    const rowEl = id => box.querySelector(`[data-id="${id}"]`);
    const footEl = id => {
      const row = rowEl(id);
      return row && row.querySelector(':scope > .cmt-main > .cmt-foot');
    };

    /* ── the chip above the composer ── */

    /*
     * The chip, and the frames behind it. Closed it is one quiet line; open it
     * is the day's photos at thumbnail size, which settles "which one is that"
     * faster than any label could. Picking closes it again — one tap, done.
     *
     * It is gone entirely while you are answering someone: a reply is filed
     * against whatever its parent was filed against, so there would be nothing
     * for it to change.
     */
    const paintAbove = (open) => {
      const to = replyTo == null ? null : find(replyTo);
      if(replyTo != null && !to) replyTo = null;

      if(to){
        const you = to.from === me();
        above.innerHTML = `
          <div class="cmt-to" data-who="${whoAttr(to.from)}">
            <span class="ic">${ICON.reply}</span>
            <span class="lb">Replying to ${you ? 'yourself' : esc(nameOf(to.from))}</span>
            <span class="tx">${esc(to.body)}</span>
            <button class="x" type="button" id="unreply" aria-label="Cancel reply">${ICON.close}</button>
          </div>`;
        above.querySelector('#unreply').onclick = () => { setReply(null); ta.focus(); };
        ta.placeholder = you ? 'Add to what you said' : `Reply to ${nameOf(to.from)}`;
        return;
      }

      ta.placeholder = own ? (canPick ? 'Add a note' : 'Add a note to this frame')
                           : `Say something to ${nameOf(prof)}`;
      if(!canPick){ above.innerHTML = ''; return; }

      const shot = slots.includes(target);
      above.innerHTML = `
        <div class="cmt-on${open ? ' open' : ''}">
          <button class="cmt-on-btn" type="button" aria-expanded="${!!open}">
            <span>On</span>
            ${shot ? `<img src="${api.photoUrl(prof, iso, target, THUMB)}" alt="">` : ''}
            <span class="nm">${esc(targetName())}</span>
            <span class="ch">${open ? 'Close' : 'Change'}</span>
          </button>
          ${open ? `<div class="cmt-pick">${picks.map(s => {
            const on = s === target ? ' on' : '';
            return slots.includes(s)
              ? `<button class="fr${on}" type="button" data-pick="${esc(s)}" aria-label="${slotLabel(s)}">
                   <img src="${api.photoUrl(prof, iso, s, THUMB)}" alt="" loading="lazy"></button>`
              : `<button class="fr day${on}" type="button" data-pick="${esc(s)}">Day</button>`;
          }).join('')}</div>` : ''}
        </div>`;

      above.querySelector('.cmt-on-btn').onclick = () => paintAbove(!open);
      above.querySelectorAll('[data-pick]').forEach(b => {
        b.onclick = () => {
          target = b.dataset.pick;
          haptic(8);
          paintAbove(false);
          ta.focus();
        };
      });
    };

    /* Answering a line marks it, so the sheet always says what the composer is
       pointed at — the chip above it and the rule beside the line agree. */
    const setReply = (id) => {
      const was = replyTo;
      replyTo = id;
      if(was != null) rowEl(was)?.classList.remove('hi');
      if(id != null) rowEl(id)?.classList.add('hi');
      paintAbove(false);
    };

    /* ── marks ── */

    const closePick = () => {
      if(picking == null) return;
      const id = picking;
      picking = null;
      const foot = footEl(id);
      if(!foot) return;
      foot.querySelector('.rx-pick')?.remove();
    };

    // `pop` is the emoji that just landed: the count it belongs to is worth a
    // beat of movement, which is the whole difference between a number that
    // changed and a number you saw change.
    const paintFoot = (id, pop) => {
      const c = find(id), foot = footEl(id);
      if(!c || !foot) return;
      foot.innerHTML = footHTML(c);
      bindFoot(foot);
      if(pop){
        [...foot.querySelectorAll('.pill')]
          .find(p => p.dataset.rx === pop)?.classList.add('pop');
      }
    };

    const toggleRx = async (id, emoji) => {
      if(!live(id) || !isEmoji(emoji)) return;
      const had = iReacted(id, emoji);
      haptic(had ? 6 : 12);

      // the count moves now and the server catches up; putting one back is
      // the same call with the flag the other way
      bumpRx(id, emoji, !had);
      if(!had) rememberRx(emoji);
      closePick();
      paintFoot(id, had ? null : emoji);

      try{
        await api.reactToComment(me(), id, emoji);
        markFeedSeen();
      }catch(err){
        bumpRx(id, emoji, had);
        paintFoot(id);
        // the server's own words: the cap is the one refusal worth reading
        toast(err?.message || 'Reaction failed');
      }
    };

    /* The double tap sends a heart, where every app that has ever had a double
       tap sends it. It only ever adds — taking one back is what the pill under
       the line is for — but it answers either way, because a gesture that does
       nothing visible reads as a broken one. */
    const DOUBLE_TAP = '❤️';
    const burst = (row, e) => {
      const r = row.getBoundingClientRect();
      const b = document.createElement('div');
      b.className = 'cmt-burst';
      b.style.left = `${e.clientX - r.left}px`;
      b.style.top = `${e.clientY - r.top}px`;
      b.textContent = DOUBLE_TAP;
      row.appendChild(b);
      setTimeout(() => b.remove(), 800);
    };

    /*
     * Press and hold a line to react to it, the way you would a message. There
     * is no button for this on purpose: a plus under every comment was a
     * permanent piece of furniture for something you do occasionally, and the
     * gesture is one the phone has already taught you.
     *
     * A drag is a scroll, not a hold, so any real movement calls it off — and
     * the release that opens the strip must not also read as the tap that
     * closes it again, which is what `openedAt` is for.
     */
    let holdT = null, from = null, held = false, openedAt = 0;
    const dropHold = () => { clearTimeout(holdT); holdT = null; from = null; };

    box.addEventListener('pointerdown', e => {
      if(e.target.closest('button')) return;
      const row = e.target.closest('.cmt-row');
      if(!row) return;
      const id = Number(row.dataset.id);
      if(!live(id)) return;
      held = false;
      from = { x:e.clientX, y:e.clientY };
      holdT = setTimeout(() => {
        holdT = null;
        held = true;
        haptic(14);
        closePick();
        picking = id;
        openedAt = Date.now();
        paintFoot(id);
      }, 420);
    });
    box.addEventListener('pointermove', e => {
      if(!from) return;
      if(Math.abs(e.clientX - from.x) > 10 || Math.abs(e.clientY - from.y) > 10) dropHold();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(t => box.addEventListener(t, dropHold));

    let tapAt = 0, tapRow = null;
    box.addEventListener('click', e => {
      if(held){ held = false; return; }   // the release that opened the strip
      if(e.target.closest('button')) return;
      const row = e.target.closest('.cmt-row');
      if(!row) return;
      const id = Number(row.dataset.id);
      const now = Date.now();
      if(row === tapRow && now - tapAt < 400){
        tapAt = 0; tapRow = null;
        if(!live(id)) return;
        burst(row, e);
        if(!iReacted(id, DOUBLE_TAP)) toggleRx(id, DOUBLE_TAP);
        else haptic(8);
        return;
      }
      tapAt = now; tapRow = row;
    });

    /* Anywhere else is a way out of the strip — including the line under it,
       which is why this listens on the way down rather than on the way up. */
    sheet.addEventListener('click', e => {
      if(picking == null) return;
      if(Date.now() - openedAt < 500) return;
      if(e.target.closest('.rx-pick')) return;
      closePick();
    }, true);

    /* ── binding ── */

    /* Two ways in, one behaviour: the mark on the head, and the Reply still in
       the strip for anyone who learned the hold. Tapping the line you are
       already answering puts the composer back on the thread. */
    const wireReply = (btn) => {
      btn.onclick = () => {
        const id = Number(btn.dataset.reply);
        haptic(8);
        closePick();
        setReply(replyTo === id ? null : id);
        if(replyTo != null) ta.focus();
      };
    };

    const bindFoot = (foot) => {
      foot.querySelectorAll('[data-rx]').forEach(b => {
        b.onclick = () => toggleRx(Number(b.dataset.on), b.dataset.rx);
      });

      const reply = foot.querySelector('[data-reply]');
      if(reply) wireReply(reply);
      const rm = foot.querySelector('[data-rm]');
      if(rm) rm.onclick = () => {
        const id = Number(rm.dataset.rm);
        closePick();
        removeComment(id);
      };
    };

    const bindRows = () => {
      box.querySelectorAll('.cmt-foot').forEach(bindFoot);
      // the head's mark survives a paintFoot, so it is wired with the row
      box.querySelectorAll('.cmt-head [data-reply]').forEach(wireReply);
    };

    const removeComment = (id) => {
      const kids = state.comments.filter(c => c.parent === id).length;
      if(!confirm(kids
        ? `Delete this comment and ${kids === 1 ? 'its reply' : `its ${kids} replies`}?`
        : 'Delete this comment?')) return;

      // A comment takes its answers with it, so the whole set is snapped
      // rather than spliced — putting three rows back in their old places
      // by hand is how an undo ends up with the thread out of order.
      const hadC = state.comments.slice();
      const hadR = state.commentReactions.slice();
      const gone = new Set(state.comments
        .filter(c => c.id === id || c.parent === id).map(c => c.id));
      state.comments = state.comments.filter(c => !gone.has(c.id));
      state.commentReactions = state.commentReactions.filter(r => !gone.has(r.c));
      if(gone.has(replyTo)) replyTo = null;
      if(gone.has(picking)) picking = null;
      repaint();

      api.deleteComment(id, me())
        .then(() => toast('Comment removed'))
        .catch(() => {
          state.comments = hadC;
          state.commentReactions = hadR;
          repaint();
          toast('Delete failed');
        });
    };

    const repaint = (justAdded) => {
      // every path in here mutates state.comments directly — posting a line,
      // taking one back, putting one back after a failure — and the thread is
      // drawn from the index, not the array. Rebuild first or the sheet draws
      // the conversation as it was one edit ago.
      indexComments();
      box.innerHTML = thread();
      bindRows();
      paintAbove(false);
      if(justAdded != null) rowEl(justAdded)?.classList.add('in');
      paintComments(prof, iso);   // the feed and viewer are live behind the sheet
    };

    const grow = () => {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 116) + 'px';
    };

    sheet.querySelector('#x').onclick = closeSheet;
    bindRows();
    paintAbove(false);
    grow();
    send.disabled = true;
    ta.addEventListener('input', () => { grow(); send.disabled = !ta.value.trim(); });
    watchKeyboard();
    markFeedSeen();

    // A conversation is read from the bottom: land on the newest line and the
    // composer, not on something said four days ago.
    requestAnimationFrame(() => { sheet.scrollTop = sheet.scrollHeight; });

    sheet.querySelector('#cForm').onsubmit = async e => {
      e.preventDefault();
      const body = ta.value.trim();
      if(!body) return;
      ta.value = ''; grow(); send.disabled = true;
      haptic(10);

      /*
       * Optimistic: the line appears now, the id arrives with the response.
       * A reply carries its parent's frame rather than `target` — the chip is
       * hidden while answering precisely because that choice isn't yours here.
       * Root of the exchange, not the line tapped: the server flattens a reply
       * to a reply the same way, and the thread has to agree with it before
       * the response comes back.
       */
      const to = replyTo == null ? null : find(replyTo);
      const parent = to ? (to.parent == null ? to.id : to.parent) : null;
      const on = to ? to.slot : target;

      const pending = { id:`t${Date.now()}`, from:me(), to:prof, date:iso, slot:on,
                        body, parent, at:new Date().toISOString(), pending:true };
      state.comments.push(pending);
      setReply(null);
      repaint(pending.id);
      sheet.scrollTo({ top:sheet.scrollHeight, behavior:'smooth' });

      try{
        const r = await api.addComment(me(), prof, iso, on, body, parent);
        const i = state.comments.indexOf(pending);
        const saved = r.comment || { ...pending, pending:false };
        if(i >= 0) state.comments.splice(i, 1, saved);
        markFeedSeen();
        repaint(saved.id);
      }catch(_){
        const i = state.comments.indexOf(pending);
        if(i >= 0) state.comments.splice(i, 1);
        repaint();
        ta.value = body; grow(); send.disabled = false;
        if(parent) setReply(to.id);
        toast('Comment failed');
      }
    };
  });
}

/*
 * iOS floats the keyboard over the page rather than resizing it, so a sheet
 * pinned to the bottom would sit underneath. Lift it by the covered height.
 */
let unwatchKeyboard = null;
function watchKeyboard(){
  const vv = window.visualViewport;
  if(!vv || unwatchKeyboard) return;
  const root = document.getElementById('sheets');
  const sync = () => {
    const gap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty('--kb', gap + 'px');
    root.classList.toggle('kb', gap > 40);
  };
  vv.addEventListener('resize', sync);
  vv.addEventListener('scroll', sync);
  unwatchKeyboard = () => {
    vv.removeEventListener('resize', sync);
    vv.removeEventListener('scroll', sync);
    root.style.removeProperty('--kb');
    root.classList.remove('kb');
    unwatchKeyboard = null;
  };
  sync();
}

/* ── water tracker ── */
function openWater(prof, iso){
  const mine = prof === me();
  let editing = false;

  const body = () => {
    const oz = waterOz(prof, iso), pct = waterPct(prof, iso);
    const raw = waterPctRaw(prof, iso), over = waterOver(prof, iso);
    const left = Math.max(0, WATER_GOAL_OZ - oz);
    const log = waterLog(prof, iso);
    const list = vessels();
    return `
      <div class="wtr-read">
        <div class="wtr-big num">${oz}</div>
        <div class="wtr-unit">of ${WATER_GOAL_OZ} oz</div>
      </div>
      <div class="wtr-bar"><i style="width:${pct}%"></i></div>
      <div class="wtr-note">
        <span>${raw}%</span>
        <span>${left ? `${left} oz to go` : (over ? `${over} oz over` : 'Goal reached')}</span>
      </div>

      ${mine ? `
        <div class="wtr-head">
          <span class="eyebrow">Add</span>
          <button class="wtr-edit" id="vEdit">${editing ? 'Done' : 'Edit'}</button>
        </div>
        <div class="vessels">
          ${list.map((v, i) => `
            <button class="vessel" data-add="${v.oz}" ${editing?'disabled':''}>
              <span class="nm">${v.nm}</span>
              <span class="oz num">${v.oz} oz</span>
              ${editing ? `<span class="del" data-del-v="${i}">${ICON.close}</span>` : ''}
            </button>`).join('')}
        </div>
        ${editing ? `
          <div class="vnew">
            <input id="vName" type="text" placeholder="Name" maxlength="14">
            <input id="vOz" type="number" inputmode="numeric" placeholder="oz" min="1" max="512">
            <button class="vadd" id="vAdd">Add</button>
          </div>` : ''}
        ${log.length ? `<button class="btn" id="wUndo">Undo last — ${log[log.length-1]} oz</button>` : ''}
        <button class="btn ghost" id="wClear">Reset day</button>
      ` : `<div class="note">Read only — this is ${nameOf(prof)}'s day</div>`}
    `;
  };

  openSheet(`
    <div data-who="${whoAttr(prof)}">
      <div class="sheet-head">
        <div>
          <div class="t">Water</div>
          <div class="s">Day ${dayIndex(iso)} — ${mine?'You':nameOf(prof)}</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>
      <div id="wBody">${body()}</div>
    </div>`, sheet => {

    const bind = () => {
      sheet.querySelector('#x').onclick = closeSheet;
      if(!mine) return;

      sheet.querySelectorAll('[data-add]').forEach(b => {
        b.onclick = async () => {
          if(editing) return;
          await addWater(prof, iso, Number(b.dataset.add));
          b.classList.add('pulse');
          setTimeout(() => b.classList.remove('pulse'), 320);
          repaint();
        };
      });

      sheet.querySelectorAll('[data-del-v]').forEach(el => {
        el.onclick = ev => {
          ev.stopPropagation();
          const list = vessels();
          list.splice(Number(el.dataset.delV), 1);
          saveVessels(list);
          repaint();
        };
      });

      const eb = sheet.querySelector('#vEdit');
      if(eb) eb.onclick = () => { editing = !editing; repaint(); };

      const add = sheet.querySelector('#vAdd');
      if(add) add.onclick = () => {
        const nm = (sheet.querySelector('#vName').value || '').trim();
        const oz = Math.round(Number(sheet.querySelector('#vOz').value));
        if(!nm || !oz || oz < 1 || oz > 512){ toast('Name and size needed'); return; }
        saveVessels(vessels().concat({ nm, oz }));
        toast(`${nm} added`);
        repaint();
      };

      const un = sheet.querySelector('#wUndo');
      if(un) un.onclick = async () => { await undoWater(prof, iso); repaint(); };

      const cl = sheet.querySelector('#wClear');
      if(cl) cl.onclick = async () => {
        if(!waterOz(prof, iso)) return;
        if(!confirm('Reset today\'s water to zero?')) return;
        await setWater(prof, iso, 0, []);
        repaint();
      };
    };

    const repaint = () => {
      sheet.querySelector('#wBody').innerHTML = body();
      bind();
      refreshMeterRow(prof, iso);
    };

    bind();
  });
}

async function setWater(prof, iso, oz, log){
  seedDay(prof, iso);
  const entry = state.data[prof][iso];
  const was = isComplete(prof, iso);
  entry.waterOz = Math.max(0, Math.round(oz));
  entry.waterLog = log;
  entry.water = entry.waterOz >= WATER_GOAL_OZ;   // keep the boolean derived
  refreshToday();
  refreshMeterRow(prof, iso);
  if(!was && isComplete(prof, iso) && iso === todayISO() && prof === me()) showComplete();
  try{ await api.saveDay(prof, iso, entry); }
  catch(_){ toast('Offline — not saved'); }
}

async function addWater(prof, iso, oz){
  const before = waterOz(prof, iso);
  haptic(12);
  await setWater(prof, iso, before + oz, waterLog(prof, iso).concat(oz));
  const now = waterOz(prof, iso);
  if(before < WATER_GOAL_OZ && now >= WATER_GOAL_OZ) toast('Gallon done');
}

async function undoWater(prof, iso){
  const log = waterLog(prof, iso).slice();
  const last = log.pop();
  if(last === undefined) return;
  haptic(8);
  await setWater(prof, iso, waterOz(prof, iso) - last, log);
}

/* Update a meter row in place wherever it is on screen. */
function refreshMeterRow(prof, iso){
  document.querySelectorAll(`.task.meter[data-row="water"]`).forEach(row => {
    const fill = row.querySelector('.fill');
    if(fill) fill.style.width = waterPct(prof, iso) + '%';
    const sub = row.querySelector('.sub');
    const oz = waterOz(prof, iso);
    if(sub) sub.textContent = oz ? `${oz} of ${WATER_GOAL_OZ} oz` : `${WATER_GOAL_OZ} oz — tap to log`;
    row.classList.toggle('on', !!entryOf(prof, iso).water);
  });
}

/* ═══════════ notifications ═══════════ */
/*
 * iOS only offers push to a PWA installed to the Home Screen, and only asks
 * for permission from a real tap — hence a button in Settings rather than a
 * prompt on load. It asks exactly once ever: a refusal can only be undone in
 * iOS Settings, so the copy has to say so.
 */
const pushSupported = () =>
  'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

// VAPID keys travel as base64url; PushManager wants raw bytes.
function urlB64ToBytes(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function currentSub(){
  if(!pushSupported()) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

async function enableAlerts(){
  const r = await fetch('/api/push');
  const cfg = await r.json();
  if(!cfg.enabled || !cfg.publicKey) throw new Error('Notifications are not set up on the server');

  const permission = await Notification.requestPermission();
  if(permission !== 'granted') throw new Error(
    permission === 'denied' ? 'Blocked — turn it back on in iOS Settings' : 'Not allowed');

  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlB64ToBytes(cfg.publicKey)
  });
  const save = await fetch('/api/push', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ profileId: me(), subscription: sub.toJSON() })
  });
  if(!save.ok) throw new Error('Could not register this phone');
}

async function disableAlerts(){
  const sub = await currentSub();
  if(!sub) return;
  await fetch(`/api/push?endpoint=${encodeURIComponent(sub.endpoint)}`, { method:'DELETE' })
    .catch(() => {});
  await sub.unsubscribe();
}

async function wireAlerts(btn){
  if(!btn) return;
  const paint = (label, disabled) => {
    btn.textContent = label;
    btn.disabled = !!disabled;
  };

  if(!pushSupported()){
    // Safari only exposes PushManager to an installed app, so this is the
    // state you see in a browser tab rather than from the Home Screen.
    paint('Notifications — add to Home Screen first', true);
    return;
  }
  if(Notification.permission === 'denied'){
    paint('Notifications blocked — allow in iOS Settings', true);
    return;
  }

  const on = !!(await currentSub());
  paint(on ? 'Notifications on — tap to turn off' : 'Turn on notifications');

  btn.onclick = async () => {
    paint('Working…', true);
    try{
      if(await currentSub()){ await disableAlerts(); toast('Notifications off'); }
      else { await enableAlerts(); toast('Notifications on'); }
    }catch(err){
      toast(err.message || 'Could not change notifications');
    }
    wireAlerts(btn);
  };
}


/* ═══════════ boot ═══════════ */
/*
 * The three of these are separate serverless functions with nothing to say to
 * each other, and they used to be awaited one after the next — so a cold open
 * paid three cold starts and three sets of database round trips end to end,
 * for data that could all have been in flight at once. Fired together they
 * cost the slowest one instead of the sum.
 *
 * allSettled rather than all: kudos and comments are garnish, and a failure in
 * either used to leave the tab empty rather than take the app down with it.
 * That stays true — each result is unpacked on its own.
 */
async function loadState(){
  const [core, reactions, comments] = await Promise.allSettled([
    api.getState(), api.getReactions(), api.getComments(me())
  ]);

  if(core.status === 'fulfilled'){
    const r = core.value;
    state.startDate = r.startDate;
    state.data = r.data || { sachin:{}, aarya:{} };
    state.photos = knownPhotos(r.photos);
    state.needThumb = r.needThumb || [];
    state.online = true;
  }else{
    state.online = false;
    state.startDate = state.startDate || todayISO();
    toast(core.reason?.message || 'Server unreachable');
  }

  state.reactions = reactions.status === 'fulfilled' ? (reactions.value.reactions || []) : [];
  // one payload carries both: a thread whose marks arrive a beat later reads
  // as a bug rather than as a second request
  state.comments  = comments.status === 'fulfilled' ? (comments.value.comments || []) : [];
  state.commentReactions = comments.status === 'fulfilled' ? (comments.value.reactions || []) : [];
  indexComments();
}

/*
 * The reactions payload is scoped to whoever is asking — `mine` is worked out
 * server-side — so becoming someone else means asking again. That happens
 * twice in the life of the app: the first time you say who you are, and the
 * settings sheet's swap. One small request, at the only two moments it can
 * possibly be wrong.
 */
async function reloadComments(){
  try{
    const r = await api.getComments(me());
    state.comments = r.comments || [];
    state.commentReactions = r.reactions || [];
    indexComments();
  }catch(_){ /* leave the thread as it was; the next load will catch up */ }
}

/*
 * Opening the app on a given day is the check-in that starts the auto tasks
 * ticked. Persist it so your partner's phone sees the same day you do —
 * without a write, they'd read 0/5 while you read 1/5.
 *
 * Skipped while offline: seeding locally against a state we couldn't load
 * would invent a day record that never reaches the server.
 */
async function checkIn(){
  const you = me();
  if(!you || !state.online) return;
  const iso = todayISO();
  if(!seedDay(you, iso)) return;
  try{ await api.saveDay(you, iso, state.data[you][iso]); }
  catch(_){ state.online = false; }
}

let lastDay = null;
document.addEventListener('visibilitychange', async () => {
  /*
   * Pocketed phone or backgrounded app: stop the sound, but don't read that as
   * wanting silence. Clearing the preference here meant coming back to a dead
   * feed until the app was reloaded — a reload being the only thing that read
   * the setting again.
   */
  if(document.hidden){ musicPause(); return; }
  await loadState();
  await checkIn();
  if(lastDay !== todayISO()){ lastDay = todayISO(); state.tab = 'today'; }
  render();
});

(async function init(){
  await loadState();
  await checkIn();
  lastDay = todayISO();

  /*
   * Open on the feed — it's the part worth coming back to, and the tasks are
   * one tap away. A challenge with no photos in it yet is the exception: an
   * empty feed is a poor front door, so a fresh start still lands on Today.
   */
  state.tab = feedPosts().length ? 'feed' : 'today';

  render();
  // once there is something on screen, and only in the gaps
  idle(backfillThumbs);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  // a device follows whoever is tracking on it, so re-register after a switch
  if(pushSupported()) currentSub().then(sub => {
    if(!sub || !me()) return;
    fetch('/api/push', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ profileId: me(), subscription: sub.toJSON() }) }).catch(() => {});
  });
})();
</script>
</body>
</html>
