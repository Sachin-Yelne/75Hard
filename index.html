<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="75 HARD">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<title>75 HARD</title>
<style>
:root{
  --ink:#0A0A0B;
  --ink-2:#0F0F11;
  --ink-3:#141416;
  --bone:#F2F1ED;
  --bone-2:#8C8A85;
  --bone-3:#55534F;
  --rule:#1E1E20;
  --rule-2:#2C2C2F;

  --you:#C8613A;
  --them:#6E7F6A;
  --miss:#6A3A2B;

  --display:'Anton',Impact,sans-serif;
  --cond:'Barlow Condensed',sans-serif;
  --body:'Inter',system-ui,sans-serif;

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --nav:calc(56px + var(--safe-bot));
  --col:520px;
  --pad:20px;
}

[data-who="you"]{--p:var(--you);}
[data-who="them"]{--p:var(--them);}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--ink);color:var(--bone);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left;}
svg{width:100%;height:100%;fill:currentColor;display:block;}

/* type primitives */
.eyebrow{
  font-family:var(--cond);font-weight:600;font-size:11px;line-height:1;
  letter-spacing:.22em;text-transform:uppercase;color:var(--bone-3);
}
.lbl{
  font-family:var(--cond);font-weight:600;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;
}
.num{font-family:var(--display);font-weight:400;letter-spacing:-.01em;font-feature-settings:"tnum";}
.rule{height:1px;background:var(--rule);width:100%;}

/* ── shell ─────────────────────────────── */
#screen{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-top) + 10px) var(--pad) calc(var(--nav) + 40px);
}
#screen.flush{padding:0;overflow:hidden;}
#screen:not(.flush) > *{max-width:var(--col);margin-left:auto;margin-right:auto;}
.feed,.sheet{max-width:var(--col);margin:0 auto;}

/* ── nav ───────────────────────────────── */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:var(--nav);padding-bottom:var(--safe-bot);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(10,10,11,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);
  padding-left:max(0px,calc((100% - var(--col))/2));
  padding-right:max(0px,calc((100% - var(--col))/2));
}
#nav[hidden]{display:none;}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--bone-3);transition:color .18s;position:relative;
}
.tab .ic{width:15px;height:15px;}
.tab span{
  font-family:var(--cond);font-weight:600;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;line-height:1;
}
.tab.on{color:var(--bone);}
.tab.on::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:1px;background:var(--bone);
}
.tab .dot{position:absolute;top:9px;right:calc(50% - 15px);width:4px;height:4px;background:var(--you);}

/* ── topbar ────────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px;}
.top .mark{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.28em;text-transform:uppercase;}
.icon-btn{width:30px;height:30px;padding:7px;color:var(--bone-2);}
.icon-btn:active{color:var(--bone);}

/* ── hero ──────────────────────────────── */
.hero{padding:22px 0 0;}
.hero .day{
  font-family:var(--display);font-size:clamp(96px,30vw,132px);line-height:.78;
  letter-spacing:-.03em;margin:8px 0 16px;
}
.hero-foot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 16px;}
.hero-foot .state{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;}
.hero-foot .state.done{color:var(--p);}

/* segmented progress */
.seg{display:flex;gap:4px;}
.seg i{flex:1;height:3px;background:var(--rule-2);transition:background .25s;}
.seg i.on{background:var(--p);}

/* stat pair */
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);margin-top:22px;}
.stat{padding:14px 0 16px;}
.stat + .stat{border-left:1px solid var(--rule);padding-left:18px;}
.stat .v{font-family:var(--display);font-size:34px;line-height:1;margin-top:7px;}
.stat.risk .v{color:var(--you);}

/* ── tasks ─────────────────────────────── */
.tasks{border-top:1px solid var(--rule);}
.task{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:16px 0;border-bottom:1px solid var(--rule);
  transition:opacity .2s;
}
.task-main{flex:1;min-width:0;display:block;}
.task-check{flex-shrink:0;display:grid;place-items:center;}
.task .meta{flex:1;min-width:0;}
.task .nm{
  display:block;
  font-family:var(--cond);font-weight:600;font-size:19px;
  letter-spacing:.09em;text-transform:uppercase;line-height:1.05;
  transition:color .2s;
}
.task .sub{display:block;font-size:11.5px;color:var(--bone-3);margin-top:5px;letter-spacing:.01em;}
.box{
  width:22px;height:22px;flex-shrink:0;
  border:1px solid var(--rule-2);
  display:grid;place-items:center;color:transparent;
  transition:background .18s,border-color .18s,color .18s;
}
.box .ic{width:11px;height:11px;}
.task.on .box{background:var(--p);border-color:var(--p);color:var(--ink);}
.task.on .nm{color:var(--p);}
.task-main:disabled,.task-check:disabled{cursor:default;}
@keyframes tick{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
.task.just .box{animation:tick .3s ease;}

/* water meter: the row's bottom rule fills as you log */
.task.meter{position:relative;}
.task.meter .fill{
  position:absolute;left:0;bottom:-1px;height:1px;
  background:var(--p);transition:width .45s cubic-bezier(.3,1,.4,1);
}
.task.meter.on .fill{height:2px;}

/* optional per-task photo */
.shot-btn{
  width:34px;height:34px;flex-shrink:0;cursor:pointer;
  border:1px solid var(--rule-2);
  display:grid;place-items:center;overflow:hidden;
  color:var(--bone-3);transition:border-color .18s,color .18s;
}
.shot-btn .ic{width:14px;height:14px;}
.shot-btn:active{border-color:var(--bone-2);}
.shot-btn.filled{border-color:var(--p);padding:0;}
.shot-btn.filled img{width:100%;height:100%;object-fit:cover;display:block;}
.shot-btn.empty{border-style:dashed;opacity:.35;cursor:default;}
.shot-btn.filled{position:relative;}
.shot-btn .n{
  position:absolute;right:0;bottom:0;min-width:13px;height:13px;padding:0 2px;
  background:var(--p);color:var(--ink);
  font-family:var(--display);font-size:10px;line-height:13px;text-align:center;
}
@keyframes shotIn{0%{opacity:0;transform:scale(.82)}100%{opacity:1;transform:scale(1)}}
.shot-btn.fresh{animation:shotIn .32s cubic-bezier(.2,1,.3,1);}

/* ── rival strip ───────────────────────── */
.rival{padding:20px 0 0;width:100%;display:block;}
.rival:active{opacity:.62;}
.rival-more{
  margin-top:9px;font-family:var(--cond);font-weight:600;font-size:10.5px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--bone-3);
}
/* a meter's box mirrors the pour, so it reads as state rather than a control */
.task-check.derived .box{opacity:.72;}
.rival-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;}
.rival-head .who{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;}
.rival-head .sc{font-family:var(--display);font-size:15px;color:var(--bone-2);}
.rival-head .sc.done{color:var(--p);}

/* ── frame button ──────────────────────── */
.frame{
  display:flex;align-items:center;gap:13px;width:100%;
  margin-top:26px;padding:16px 16px;
  border:1px solid var(--rule-2);
  cursor:pointer;                 /* empty state is a <label>, not a button */
}
.frame .ic{width:17px;height:17px;color:var(--bone-2);flex-shrink:0;}
.frame .meta{flex:1;min-width:0;}
.frame .nm{display:block;font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.13em;text-transform:uppercase;}
.frame .sub{display:block;font-size:11px;color:var(--bone-3);margin-top:3px;}
.frame.filled{border-color:var(--p);}
.frame.filled .ic{color:var(--p);}
.frame img{width:34px;height:34px;object-fit:cover;flex-shrink:0;}

/* ── wall ──────────────────────────────── */
.switch{display:flex;border:1px solid var(--rule);margin-bottom:26px;}
.switch button{
  flex:1;padding:11px 0;text-align:center;
  font-family:var(--cond);font-weight:600;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bone-3);
  transition:background .18s,color .18s;
}
.switch button + button{border-left:1px solid var(--rule);}
.switch button.on{background:var(--bone);color:var(--ink);}

.wall{margin-bottom:34px;}
.wall-head{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:14px;}
.wall-head .who{font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;}
.wall-head .tally{font-family:var(--display);font-size:16px;color:var(--p);}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
.cell{aspect-ratio:1;background:var(--ink-3);position:relative;transition:opacity .15s;}
.cell:active{opacity:.5;}
.cell.done{background:var(--p);}
.cell.miss{background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--miss);}
.cell.today{background:transparent;box-shadow:inset 0 0 0 1px var(--bone);}
.cell.today.done{background:var(--p);box-shadow:inset 0 0 0 1px var(--bone);}
.cell.future{background:var(--ink-2);}
.cell.pic::after{content:'';position:absolute;bottom:2px;right:2px;width:3px;height:3px;background:var(--bone);opacity:.5;}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;}
.legend span{display:flex;align-items:center;gap:6px;
  font-family:var(--cond);font-weight:500;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);}
.legend i{width:8px;height:8px;display:block;}

/* milestones */
.miles{border-top:1px solid var(--rule);}
.mile{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);}
.mile .d{font-family:var(--display);font-size:14px;color:var(--bone-3);width:26px;flex-shrink:0;}
.mile .nm{flex:1;font-family:var(--cond);font-weight:600;font-size:14px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--bone-3);}
.mile .ic{width:12px;height:12px;color:var(--rule-2);}
.mile.got .d,.mile.got .nm{color:var(--bone);}
.mile.got .ic{color:var(--p);}

/* ── feed ──────────────────────────────── */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.post{height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  position:relative;background:#000;overflow:hidden;}
/* horizontal reel: one slide per photo logged that day */
.reel{
  display:flex;height:100%;width:100%;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.reel::-webkit-scrollbar{display:none;}
.reel[data-single]{overflow-x:hidden;}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;}
.post img{width:100%;height:100%;object-fit:cover;}
/* segmented bar at the top, out of the way of the caption block */
.pips{
  position:absolute;left:var(--pad);right:var(--pad);
  top:calc(var(--safe-top) + 44px);
  display:flex;gap:4px;pointer-events:none;
}
.pips i{flex:1;height:2px;background:rgba(255,255,255,.26);transition:background .2s;}
.pips i.on{background:var(--bone);}
.slot-tag{
  font-family:var(--cond);font-weight:600;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.72);
  margin-bottom:10px;
}
.slot-tag .of{font-family:var(--display);letter-spacing:0;color:rgba(255,255,255,.45);margin-left:4px;}
.post .shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 26%,transparent 42%,rgba(0,0,0,.88) 100%);}
.post-top{position:absolute;top:calc(var(--safe-top) + 16px);left:var(--pad);right:var(--pad);
  display:flex;justify-content:space-between;align-items:baseline;}
.post-top .who{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;}
.post-top .dt{font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,.6);}
.post-bot{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--nav) + 22px);}
.post-bot .day{font-family:var(--display);font-size:74px;line-height:.8;letter-spacing:-.03em;}
.post-bot .rule{background:rgba(255,255,255,.28);margin:14px 0 12px;}
.post-bot .state{font-family:var(--cond);font-weight:600;font-size:13px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);}
.post-bot .state b{color:var(--p);font-weight:600;}
.kudos{
  display:inline-flex;align-items:center;gap:11px;margin-top:16px;
  padding:10px 16px;border:1px solid rgba(255,255,255,.32);
  font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  transition:background .18s,border-color .18s,color .18s;
}
.kudos .n{font-family:var(--display);font-size:13px;letter-spacing:0;}
.kudos.mine{background:var(--you);border-color:var(--you);color:var(--ink);}
.kudos:disabled{opacity:.55;}
@keyframes stamp{
  0%{transform:translate(-50%,-50%) scale(.7);opacity:0}
  22%{transform:translate(-50%,-50%) scale(1);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.08);opacity:0}
}
.stamp{
  position:absolute;top:50%;left:50%;z-index:5;pointer-events:none;
  font-family:var(--display);font-size:44px;letter-spacing:.04em;
  padding:14px 26px;border:2px solid var(--bone);
  animation:stamp .9s cubic-bezier(.2,.8,.3,1) forwards;
}
.feed-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:0 44px;text-align:center;}
.feed-empty .ic{width:26px;height:26px;color:var(--bone-3);}
.feed-empty h3{font-family:var(--display);font-size:26px;letter-spacing:-.01em;margin:0;}
.feed-empty p{font-size:12.5px;color:var(--bone-3);line-height:1.6;margin:0;}

/* collage: the whole day at once, one tile per frame.
   Square tiles centred in the post — stretching them to fill a phone-shaped
   post turns a six-up into six tall slivers. */
.collage{
  position:absolute;inset:0;display:grid;gap:2px;align-content:center;
  /* centre in the space the caption block leaves, not the whole post */
  padding:calc(var(--safe-top) + 46px) 0 calc(var(--nav) + 150px);
}
.tile{position:relative;overflow:hidden;background:#000;padding:0;aspect-ratio:1;}
.tile img{width:100%;height:100%;object-fit:cover;display:block;}
.tile:active{opacity:.72;}
/* a lone frame still fills the screen, as it always did */
.collage.single{align-content:stretch;}
.collage.single .tile{aspect-ratio:auto;height:100%;}
/* three reads better as one wide frame over a pair than as an orphan row */
.collage.three .tile:first-child{grid-column:span 2;aspect-ratio:2.02;}
.tile .more{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(0,0,0,.58);
  font-family:var(--display);font-size:26px;letter-spacing:-.01em;color:var(--bone);
}

/* full-screen viewer */
#viewer:empty{display:none;}
#viewer .viewer{
  position:fixed;inset:0;z-index:60;background:#000;
  opacity:0;transition:opacity .22s ease;
}
#viewer.open .viewer{opacity:1;}
.viewer-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 22%,transparent 58%,rgba(0,0,0,.82) 100%);}
.viewer .slide img{width:100%;height:100%;object-fit:contain;}
.viewer-x{position:absolute;top:calc(var(--safe-top) + 12px);right:var(--pad);z-index:2;
  width:20px;height:20px;color:var(--bone);}
.viewer-bot{position:absolute;left:var(--pad);right:var(--pad);
  bottom:calc(var(--safe-bot) + 26px);pointer-events:none;}
.viewer-meta{font-family:var(--cond);font-weight:600;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.62);}

/* ── rivals ────────────────────────────── */
.rv-head{display:grid;grid-template-columns:1fr auto auto;gap:20px;
  padding-bottom:11px;border-bottom:1px solid var(--rule);}
.rv-head .c{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;width:68px;text-align:right;}
.rv-row{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;
  padding:15px 0;border-bottom:1px solid var(--rule);}
.rv-row .k{font-family:var(--cond);font-weight:600;font-size:14px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--bone-2);}
.rv-row .v{font-family:var(--display);font-size:26px;width:68px;text-align:right;line-height:1;}
.rv-row .v.a{color:var(--you);}
.rv-row .v.b{color:var(--them);}
.rv-row.small .v{font-size:18px;}
.sect{margin-top:36px;}
.sect > .eyebrow{display:block;margin-bottom:14px;}

/* ── sheets ────────────────────────────── */
#sheets{position:fixed;inset:0;z-index:60;pointer-events:none;}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.7);opacity:0;transition:opacity .26s;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--ink-2);border-top:1px solid var(--rule-2);
  padding:20px var(--pad) calc(26px + var(--safe-bot));
  max-height:88%;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.3,1,.4,1);
}
#sheets.open{pointer-events:auto;}
#sheets.open .scrim{opacity:1;}
#sheets.open .sheet{transform:translateY(0);}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;
  padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:4px;}
.sheet-head .t{font-family:var(--display);font-size:30px;line-height:1;}
.sheet-head .s{font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-3);margin-top:8px;}
.btn{
  display:block;width:100%;padding:15px;text-align:center;
  font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;
  border:1px solid var(--rule-2);margin-top:10px;transition:background .18s,color .18s;
}
.btn.primary{background:var(--bone);color:var(--ink);border-color:var(--bone);}
.btn.danger{color:var(--you);border-color:var(--miss);}
.btn.ghost{border-color:transparent;color:var(--bone-3);}
.shot{width:100%;max-height:320px;object-fit:cover;display:block;margin-bottom:14px;}
.sheet-shots{
  display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;
  scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.sheet-shots::-webkit-scrollbar{display:none;}
.sheet-shot{margin:0;flex:0 0 78%;scroll-snap-align:start;position:relative;}
.sheet-shot img{width:100%;height:220px;object-fit:cover;display:block;}
.sheet-shot figcaption{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:7px;font-family:var(--cond);font-weight:600;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--bone-3);
}
.sheet-shot .rm{width:14px;height:14px;color:var(--bone-3);flex-shrink:0;}

<script>
/* ═══════════ config ═══════════ */
const TOTAL_DAYS = 75;

// `photo:true` gives the task an optional camera slot. Photos never gate
// completion — a task is done when it's checked, with or without one.
// `auto:true` starts the task ticked on any day you check in — it's the one
// you're assumed to be keeping unless you say otherwise, so you only touch it
// to record a failure. See seedDay(): days you never open stay blank, so a
// skipped day is never credited as a success you didn't report.
const TASKS = [
  { id:'diet',     nm:'Diet',        sub:'No cheat meals, no alcohol',        auto:true, photo:true, multi:true },
  { id:'workout1', nm:'Workout One', sub:'45 minutes',            photo:true },
  { id:'workout2', nm:'Workout Two', sub:'45 minutes, outdoors',  photo:true },
  { id:'water',    nm:'Water',       sub:'1 gallon',              meter:true },
  { id:'read',     nm:'Read',        sub:'10 pages, non-fiction', photo:true }
];

// Base slots, in the order a day reads. 'day' is the daily progress frame;
// the rest mirror the TASKS ids that carry a camera.
//
// The photos table is keyed (profile_id, day_date, slot), so a task that takes
// several shots a day can't reuse one slot — the second upload would overwrite
// the first. A `multi` task therefore stores each shot under `id#<epoch ms>`.
// slot is a text column, so this needs no migration, and the stamp sorts a
// day's meals into the order you ate them.
const DAY_SLOT = 'day';
const SLOT_ORDER = [DAY_SLOT, ...TASKS.filter(t => t.photo).map(t => t.id)];
const MULTI_SLOTS = TASKS.filter(t => t.multi).map(t => t.id);
const MAX_PER_SLOT = 12;          // keeps one runaway day off the free tier
const SLOT_LABEL = {
  day:'Progress frame',
  ...Object.fromEntries(TASKS.map(t => [t.id, t.nm]))
};

const slotBase  = s => String(s).split('#')[0];
const slotStamp = s => Number(String(s).split('#')[1]) || 0;
const slotLabel = s => SLOT_LABEL[slotBase(s)] || 'Photo';
const isKnownSlot = s => {
  const base = slotBase(s);
  if(!SLOT_ORDER.includes(base)) return false;
  return String(s) === base || MULTI_SLOTS.includes(base);
};
const newSlot = id => MULTI_SLOTS.includes(id) ? `${id}#${Date.now()}` : id;

const PROFILES = [
  { id:'sachin', label:'Sachin' },
  { id:'aarya',  label:'Aarya' }
];

const MILES = [
  { d:1,  nm:'First Day' },
  { d:3,  nm:'Momentum' },
  { d:7,  nm:'One Week' },
  { d:14, nm:'Fortnight' },
  { d:21, nm:'Habit Locked' },
  { d:30, nm:'One Month' },
  { d:45, nm:'Past Halfway' },
  { d:60, nm:'Home Stretch' },
  { d:75, nm:'Seventy Five' }
];

// Water is logged incrementally rather than ticked. The boolean stays derived
// from the total so streaks, the wall and completion logic are untouched.
const WATER_GOAL_OZ = 128;                       // 1 US gallon
const DEFAULT_VESSELS = [
  { nm:'Bottle',  oz:16 },
  { nm:'Glass',   oz:8  },
  { nm:'Tumbler', oz:32 }
];

const KUDOS_TOKEN = 'kudos';
const WORDS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
  'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty'];
const word = n => (WORDS[n] || String(n)).toUpperCase();

/* Font Awesome Pro (sharp-light), inlined — only the eight actually used. */
const ICON = {
  today:'<svg viewBox="0 0 448 512" aria-hidden="true"><path d="M303.5 184.4L338.9 49.8 352 0 310.8 30.9 32 240l0 48 88.3 5.9 32.5 2.2-8.3 31.5L109.1 462.2 96 512l41.2-30.9L416 272l0-48-88.3-5.9-32.5-2.2 8.3-31.5zM154.6 415.1l19.7-74.7 15.4-58.4-60.2-4L74.7 274l204.7-153.5-4.1 15.4-19.7 74.7-15.4 58.4 60.2 4 54.9 3.7L150.5 430.6l4.1-15.4z"/></svg>',
  wall:'<svg viewBox="0 0 512 512" aria-hidden="true"><path d="M64 64l0 128 128 0 0-128L64 64zM32 32l32 0 128 0 32 0 0 32 0 128 0 32-32 0L64 224l-32 0 0-32L32 64l0-32zM64 320l0 128 128 0 0-128L64 320zM32 288l32 0 128 0 32 0 0 32 0 128 0 32-32 0L64 480l-32 0 0-32 0-128 0-32zM448 64L320 64l0 128 128 0 0-128zM320 32l128 0 32 0 0 32 0 128 0 32-32 0-128 0-32 0 0-32 0-128 0-32 32 0zm0 288l0 128 128 0 0-128-128 0zm-32-32l32 0 128 0 32 0 0 32 0 128 0 32-32 0-128 0-32 0 0-32 0-128 0-32z"/></svg>',
  feed:'<svg viewBox="0 0 512 512" aria-hidden="true"><path d="M32 64l0 265.4 84.7-84.7L128 233.4l11.3 11.3L224 329.4 372.7 180.7 384 169.4l11.3 11.3L480 265.4 480 64 32 64zm0 310.6L32 448l73.4 0 96-96L128 278.6l-96 96zm352-160L150.6 448 480 448l0-137.4-96-96zM0 32l32 0 448 0 32 0 0 32 0 384 0 32-32 0L32 480 0 480l0-32L0 64 0 32zM160 144a16 16 0 1 0 -32 0 16 16 0 1 0 32 0zm-64 0a48 48 0 1 1 96 0 48 48 0 1 1 -96 0z"/></svg>',
  rivals:'<svg viewBox="0 0 448 512" aria-hidden="true"><path d="M256 64l0 384-64 0 0-384 64 0zM192 32l-32 0 0 32 0 384 0 32 32 0 64 0 32 0 0-32 0-384 0-32-32 0-64 0zM96 256l0 192-64 0 0-192 64 0zM32 224L0 224l0 32L0 448l0 32 32 0 64 0 32 0 0-32 0-192 0-32-32 0-64 0zm320-96l64 0 0 320-64 0 0-320zM320 96l0 32 0 320 0 32 32 0 64 0 32 0 0-32 0-320 0-32-32 0-64 0-32 0z"/></svg>',
  gear:'<svg viewBox="0 0 512 512" aria-hidden="true"><path d="M195 108c-13.2 5.4-25.5 12.6-36.7 21.2l-13.3 10.2-16-5.1-52-16.6L46.9 170.2l40.3 36.7 12.4 11.3-2.2 16.6c-.9 6.9-1.4 14-1.4 21.2s.5 14.3 1.4 21.2l2.2 16.6L87.2 305.1 46.9 341.8l30.2 52.4 52-16.6 16-5.1 13.3 10.2c11.2 8.6 23.5 15.8 36.7 21.2l15.5 6.4 3.6 16.4L225.8 480l60.5 0 11.7-53.3 3.6-16.4L317 404c13.2-5.4 25.5-12.6 36.7-21.2l13.3-10.2 16 5.1 52 16.6 30.2-52.4-40.3-36.7-12.4-11.3 2.2-16.6c.9-6.9 1.4-14 1.4-21.2s-.5-14.3-1.4-21.2l-2.2-16.6 12.4-11.3 40.3-36.7-30.2-52.4-52 16.6-16 5.1-13.3-10.2c-11.2-8.6-23.5-15.8-36.7-21.2l-15.5-6.4-3.6-16.4L286.2 32l-60.5 0L214.1 85.3l-3.6 16.4L195 108zM200 0L312 0l17.2 78.4c15.8 6.5 30.6 15.1 44 25.4l76.5-24.4 56 97-59.4 54.1c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l59.4 54.1-56 97-76.5-24.4c-13.4 10.3-28.2 18.9-44 25.4L312 512l-112 0-17.2-78.4c-15.8-6.5-30.6-15.1-44-25.4L62.3 432.5l-56-97 59.4-54.1C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L6.3 176.5l56-97 76.5 24.4c13.4-10.3 28.2-18.9 44-25.4L200 0zM312 256a56 56 0 1 0 -112 0 56 56 0 1 0 112 0zm-144 0a88 88 0 1 1 176 0 88 88 0 1 1 -176 0z"/></svg>',
  check:'<svg viewBox="0 0 448 512" aria-hidden="true"><path d="M448.1 118.2L437 129.7 173.6 404l-11.5 12-11.5-12L11.1 258.8 0 247.2l23.1-22.2 11.1 11.5L162.1 369.8 414 107.5 425 96l23.1 22.2z"/></svg>',
  camera:'<svg viewBox="0 0 512 512" aria-hidden="true"><path d="M160 32l192 0 21.3 64L480 96l32 0 0 32 0 320 0 32-32 0L32 480 0 480l0-32L0 128 0 96l32 0 106.7 0L160 32zm213.3 96l-23.1 0L343 106.1 328.9 64 183.1 64l-14 42.1L161.7 128l-23.1 0L32 128l0 320 448 0 0-320-106.7 0zM256 176a112 112 0 1 1 0 224 112 112 0 1 1 0-224zm80 112a80 80 0 1 0 -160 0 80 80 0 1 0 160 0z"/></svg>',
  close:'<svg viewBox="0 0 384 512" aria-hidden="true"><path d="M192 233.4L59.5 100.9 36.9 123.5 169.4 256 36.9 388.5l22.6 22.6L192 278.6 324.5 411.1l22.6-22.6L214.6 256 347.1 123.5l-22.6-22.6L192 233.4z"/></svg>'
};

/* ═══════════ api ═══════════ */
const photoQuery = (p, date, slot) =>
  `/api/photos?profile=${encodeURIComponent(p)}&date=${encodeURIComponent(date)}&slot=${encodeURIComponent(slot)}`;

// A failed load used to surface as a flat "Server unreachable", which covers
// three very different faults: no network, the /api routes not deployed, and
// the database being unconfigured or down. Carry the server's own message
// through so the toast says which one it is. /api/health has the full detail.
async function reason(r, fallback){
  try{
    const j = await r.json();
    return j.error || fallback;
  }catch(_){ return fallback; }
}

const api = {
  async getState(){
    let r;
    try{
      r = await fetch('/api/state');
    }catch(_){ throw new Error('No connection'); }

    if(!r.ok) throw new Error(await reason(r, `Server error ${r.status}`));

    // A deploy without the serverless functions answers /api/state with the
    // HTML shell, which would otherwise fail as an opaque JSON parse error.
    if(!(r.headers.get('content-type') || '').includes('json'))
      throw new Error('API routes not deployed');

    return r.json();
  },
  async saveDay(profileId, date, tasks){
    const r = await fetch('/api/state', { method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ profileId, date, tasks }) });
    if(!r.ok) throw new Error('save');
  },
  async getReactions(){
    const r = await fetch('/api/reactions');
    if(!r.ok) throw new Error('reactions');
    return r.json();
  },
  async react(from, to, date, emoji){
    const r = await fetch('/api/reactions', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ from, to, date, emoji }) });
    if(!r.ok) throw new Error('react');
    return r.json();
  },
  async uploadPhoto(profileId, date, slot, contentType, dataBase64){
    const r = await fetch(photoQuery(profileId, date, slot),
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ profileId, date, slot, contentType, dataBase64 }) });
    if(!r.ok) throw new Error('upload');
  },
  async deletePhoto(profileId, date, slot){
    const r = await fetch(photoQuery(profileId, date, slot), { method:'DELETE' });
    if(!r.ok) throw new Error('delete');
  },
  photoUrl(profileId, date, slot){
    const v = state.photoV[`${profileId}|${date}|${slot}`] || 0;
    return `${photoQuery(profileId, date, slot)}&v=${v}`;
  },
  async reset(startDate){
    const r = await fetch('/api/reset', { method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ startDate }) });
    if(!r.ok) throw new Error('reset');
    return r.json();
  }
};

/* ═══════════ state ═══════════ */
const state = {
  startDate:null,
  data:{ sachin:{}, aarya:{} },
  // { sachin: { '2026-08-02': ['day','read'] }, aarya: {…} }
  photos:{ sachin:{}, aarya:{} },
  photoV:{},
  reactions:[],
  me: localStorage.getItem('me') || null,
  tab:'today',
  wallView:'both',
  online:true
};

const me   = () => state.me;
const them = () => state.me === 'sachin' ? 'aarya' : 'sachin';
const nameOf = id => PROFILES.find(p => p.id === id).label;
const whoAttr = id => id === me() ? 'you' : 'them';

/* ═══════════ dates (local, never UTC) ═══════════ */
function isoOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayISO(){ return isoOf(new Date()); }
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function dayIndex(iso){ return Math.round((parseISO(iso) - parseISO(state.startDate))/86400000) + 1; }
function isoForDay(n){ return addDays(state.startDate, n-1); }
function todayIndex(){ return dayIndex(todayISO()); }
function fmtDate(iso){
  return parseISO(iso).toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });
}
function msToMidnight(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate()+1) - n;
}
function fmtLeft(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m ${String(s).padStart(2,'0')}s`;
}

/* ═══════════ selectors ═══════════ */
const entryOf = (p, iso) => state.data[p]?.[iso] || {};

const AUTO_TASKS = TASKS.filter(t => t.auto).map(t => t.id);

/*
 * Create a day's record pre-ticked for the auto tasks, if it doesn't exist yet.
 * Returns true when it actually created one, so callers know to persist it.
 *
 * Deliberately not a read-time default: deriving "blank means done" would
 * retroactively credit every untouched day in the challenge, including days
 * nobody opened the app. Seeding on check-in keeps a skipped day honestly at
 * 0/5 and leaves history alone.
 */
function seedDay(p, iso){
  const days = (state.data[p] ||= {});
  const entry = (days[iso] ||= {});
  let changed = false;
  for(const id of AUTO_TASKS){
    // only an absent key seeds — an explicit false is you recording a failure
    if(entry[id] === undefined){ entry[id] = true; changed = true; }
  }
  return changed;
}
const doneCount = (p, iso) => TASKS.reduce((n,t) => n + (entryOf(p,iso)[t.id] ? 1 : 0), 0);
const isComplete = (p, iso) => doneCount(p, iso) === TASKS.length;
/* ── water ── */
// Days ticked before the meter existed carry `water:true` and no ounces —
// read those as a full gallon so the gauge agrees with the checkbox.
const waterOz = (p, iso) => {
  const e = entryOf(p, iso);
  if(e.waterOz != null) return Number(e.waterOz) || 0;
  return e.water ? WATER_GOAL_OZ : 0;
};
const waterLog = (p, iso) => entryOf(p, iso).waterLog || [];
// the bar can only fill once, but the number should tell the truth
const waterPct    = (p, iso) => Math.min(100, waterPctRaw(p, iso));
const waterPctRaw = (p, iso) => Math.round(waterOz(p, iso) / WATER_GOAL_OZ * 100);
const waterOver   = (p, iso) => Math.max(0, waterOz(p, iso) - WATER_GOAL_OZ);

/* Vessels are personal kit, not shared progress, so they live on the device. */
function vessels(){
  try{
    const v = JSON.parse(localStorage.getItem('vessels:' + me()));
    if(Array.isArray(v) && v.length) return v;
  }catch(_){}
  return DEFAULT_VESSELS.map(v => ({ ...v }));
}
function saveVessels(list){
  localStorage.setItem('vessels:' + me(), JSON.stringify(list));
}

/* Slots for one person on one day, in carousel order. */
const slotsFor = (p, iso) => (state.photos[p]?.[iso] || [])
  .filter(isKnownSlot)
  .sort((a, b) =>
    SLOT_ORDER.indexOf(slotBase(a)) - SLOT_ORDER.indexOf(slotBase(b)) ||
    slotStamp(a) - slotStamp(b));

// every shot a task holds that day, oldest first
const photosOf = (p, iso, taskId) =>
  slotsFor(p, iso).filter(s => slotBase(s) === taskId);
/*
 * Keep only slots the app still knows about. Retiring a slot (water carried a
 * camera once) leaves its rows in the database; unfiltered they would be
 * invisible in the feed while photoCount and the Rivals tally kept counting
 * them — a photo marker on the Wall pointing at something you can't open.
 */
function knownPhotos(byProfile){
  const out = { sachin:{}, aarya:{} };
  for(const p of Object.keys(out)){
    for(const [iso, slots] of Object.entries(byProfile?.[p] || {})){
      const keep = (slots || []).filter(isKnownSlot);
      if(keep.length) out[p][iso] = keep;
    }
  }
  return out;
}

const hasPhoto = (p, iso, slot) => (state.photos[p]?.[iso] || []).includes(slot);
const photoCount = (p, iso) => (state.photos[p]?.[iso] || []).length;
const totalPhotos = p => Object.values(state.photos[p] || {}).reduce((n, a) => n + a.length, 0);

function addPhotoLocal(p, iso, slot){
  const byDay = (state.photos[p] ||= {});
  const list = (byDay[iso] ||= []);
  if(!list.includes(slot)) list.push(slot);
  state.photoV[`${p}|${iso}|${slot}`] = Date.now();
}
function removePhotoLocal(p, iso, slot){
  const list = state.photos[p]?.[iso];
  if(!list) return;
  const i = list.indexOf(slot);
  if(i >= 0) list.splice(i, 1);
  if(!list.length) delete state.photos[p][iso];
}

function streak(p){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  let n = 0;
  for(let d = ti; d >= 1; d--){
    if(isComplete(p, isoForDay(d))) n++;
    else if(d === ti) continue;
    else break;
  }
  return n;
}
function bestStreak(p){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  let best = 0, run = 0;
  for(let d = 1; d <= ti; d++){
    if(isComplete(p, isoForDay(d))){ run++; best = Math.max(best, run); } else run = 0;
  }
  return best;
}
function totalComplete(p){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  let n = 0;
  for(let d = 1; d <= ti; d++) if(isComplete(p, isoForDay(d))) n++;
  return n;
}
function taskRate(p, taskId){
  const ti = Math.min(todayIndex(), TOTAL_DAYS);
  if(ti < 1) return 0;
  let n = 0;
  for(let d = 1; d <= ti; d++) if(entryOf(p, isoForDay(d))[taskId]) n++;
  return Math.round(n/ti*100);
}
const kudosCount = (to, date) => state.reactions.filter(r => r.to === to && r.date === date).length;
const iGaveKudos = (to, date) => state.reactions.some(r => r.to === to && r.date === date && r.from === me());
function unseenKudos(){
  const seen = Number(localStorage.getItem('kudosSeen') || 0);
  return state.reactions.filter(r => r.to === me()).length > seen;
}

function haptic(ms = 10){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(_){} }
let toastT;
function toast(msg){
  const el = document.getElementById('toast');

/* ═══════════ images ═══════════ */
async function compressImage(file){
  const bmp = await createImageBitmap(file);
  const max = 1200;
  const s = Math.min(1, max/Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width*s), h = Math.round(bmp.height*s);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  bmp.close();
  return blob;
}
function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

/*
 * One task row, shared by Today and the day sheet.
 * Empty camera opens the picker straight away — that's the common path.
 * A filled thumbnail opens the day sheet instead, where it can be seen large,
 * replaced or removed.
 */
function taskRow(prof, iso, t, editable){
  const on = !!entryOf(prof, iso)[t.id];
  const shots = t.multi ? photosOf(prof, iso, t.id)
                        : (hasPhoto(prof, iso, t.id) ? [t.id] : []);
  const pic = shots.length > 0;
  const oz = t.meter ? waterOz(prof, iso) : 0;
  const sub = t.meter
    ? (oz ? `${oz} of ${WATER_GOAL_OZ} oz` : `${WATER_GOAL_OZ} oz — tap to log`)
    : t.sub;
  let shot = '';
  if(t.photo){
    // newest shot is the thumbnail; the count says how many the day holds
    const thumb = pic
      ? `<button class="shot-btn filled" data-open-slot="${t.id}" aria-label="${t.nm} photos">
           <img src="${api.photoUrl(prof, iso, shots[shots.length - 1])}" alt="">
           ${shots.length > 1 ? `<span class="n">${shots.length}</span>` : ''}
         </button>`
      : '';
    const camera = `<label class="shot-btn" aria-label="Add ${t.nm} photo">
                      <span class="ic">${ICON.camera}</span>
                      <input type="file" accept="image/*" data-shot="${t.id}" hidden>
                    </label>`;
    if(t.multi && editable){
      // a multi task always offers the camera, so a second meal is one tap
      shot = thumb + (shots.length < MAX_PER_SLOT ? camera : '');
    } else if(pic){
      shot = thumb;
    } else if(editable){
      shot = camera;
    } else {
      shot = `<span class="shot-btn empty"></span>`;
    }
  }
  // the meter row's own bottom hairline doubles as the gauge
  const fill = t.meter
    ? `<i class="fill" style="width:${waterPct(prof, iso)}%"></i>` : '';
  const mainAttr = t.meter
    ? `data-meter="${t.id}"`                       // opens the tracker
    : `data-task="${t.id}" ${editable?'':'disabled'}`;
  // A meter's box reports the pour rather than setting it — ticking it directly
  // would claim a gallon you never logged. Tapping it opens the tracker.
  const checkAttr = t.meter
    ? `data-meter="${t.id}" ${editable?'':'disabled'} aria-label="${t.nm} tracker"`
    : `data-task="${t.id}" ${editable?'':'disabled'} aria-label="Toggle ${t.nm}"`;

  return `
    <div class="task ${on?'on':''}${t.meter?' meter':''}" data-row="${t.id}">
      <button class="task-main" ${mainAttr}>
        <span class="meta">
          <span class="nm">${t.nm}</span>
          <span class="sub">${sub}</span>
        </span>
      </button>
      ${shot}
      <button class="task-check${t.meter?' derived':''}" ${checkAttr}>
        <span class="box"><span class="ic">${ICON.check}</span></span>
      </button>
      ${fill}
    </div>`;
}

/* ═══════════ wiring ═══════════ */
function wire(){
  const el = screen();

  document.getElementById('nav').querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { if(state.tab !== b.dataset.tab){ state.tab = b.dataset.tab; haptic(6); render(); } };
  });

  const gear = el.querySelector('#gearBtn');
  if(gear) gear.onclick = openSettings;

  el.querySelectorAll('[data-goto]').forEach(b => {
    b.onclick = () => { state.tab = b.dataset.goto; render(); };
  });

  // both the label area and the checkbox toggle the same task
  el.querySelectorAll('[data-task]').forEach(b => {
    b.onclick = () => toggleTask(b.dataset.task, b.closest('.task'));
  });

  el.querySelectorAll('[data-meter]').forEach(b => {
    b.onclick = () => openWater(me(), todayISO());
  });

  // optional per-task photo: empty camera picks a file, filled thumb opens the day
  el.querySelectorAll('[data-shot]').forEach(input => {
    input.onchange = () => uploadFrom(input, me(), todayISO(), newSlot(input.dataset.shot));
  });
  el.querySelectorAll('[data-open-slot]').forEach(b => {
    b.onclick = () => openDay(me(), todayISO());
  });

  // Only the filled card opens the sheet; an empty one is a <label> whose
  // hidden input is already wired by the [data-shot] pass above.
  const frame = el.querySelector('button#frameBtn');
  if(frame) frame.onclick = () => openDay(me(), todayISO());

  // read-only peek at your partner's day, straight off their strip
  const rb = el.querySelector('#rivalBtn');
  if(rb) rb.onclick = () => openDay(them(), todayISO());

  el.querySelectorAll('#switch button').forEach(b => {
    b.onclick = () => { state.wallView = b.dataset.wv; haptic(6); render(); };
  });

  el.querySelectorAll('.cell').forEach(b => {
    b.onclick = () => {
      const d = Number(b.dataset.day);
      if(d > todayIndex()){ toast("Hasn't happened yet"); return; }
      openDay(b.dataset.prof, isoForDay(d));
    };
  });

  const nb = el.querySelector('#newBtn');
  if(nb) nb.onclick = confirmReset;

  el.querySelectorAll('.post').forEach(post => {
    const p = post.dataset.postP, iso = post.dataset.postIso;
    post.querySelectorAll('[data-tile]').forEach(tile => {
      tile.onclick = e => { e.stopPropagation(); openViewer(p, iso, Number(tile.dataset.tile)); };
    });
    if(p === me()) return;
    const btn = post.querySelector('.kudos');
    if(btn) btn.onclick = e => { e.stopPropagation(); sendKudos(p, iso, post, false); };
  });

  startCountdown();
}

/* Keep the slot caption and pips in step with the horizontal swipe. */
function wireReel(host, p, iso){
  const reel = host.querySelector('.reel');
  const slots = slotsFor(p, iso);
  if(!reel || slots.length < 2) return;
  const tag = host.querySelector('.slot-tag');
  const pips = [...host.querySelectorAll('.pips i')];
  let shown = 0, raf = null;

  const sync = () => {
    raf = null;
    const w = reel.clientWidth || 1;
    const i = Math.max(0, Math.min(slots.length - 1, Math.round(reel.scrollLeft / w)));
    if(i === shown) return;
    shown = i;
    if(tag) tag.innerHTML = `${slotLabel(slots[i])} <span class="of">${i+1}/${slots.length}</span>`;
    pips.forEach((pip, n) => pip.classList.toggle('on', n === i));
  };

  reel.addEventListener('scroll', () => {
    if(raf === null) raf = requestAnimationFrame(sync);
  }, { passive:true });
  // scrollend lands the final state even if the last scroll frame is coalesced
  reel.addEventListener('scrollend', sync, { passive:true });
  reel._syncReel = sync;
}

/* ═══════════ actions ═══════════ */
async function toggleTask(taskId, row){
  const you = me(), iso = todayISO();
  seedDay(you, iso);

  // water is logged pour by pour; it is never ticked directly
  if(TASKS.find(t => t.id === taskId)?.meter){ openWater(you, iso); return; }

  const was = isComplete(you, iso);
  const now = !state.data[you][iso][taskId];
  state.data[you][iso][taskId] = now;

  row.classList.toggle('on', now);
  if(now){ row.classList.add('just'); setTimeout(() => row.classList.remove('just'), 320); }
  refreshToday();
  haptic(now ? 12 : 6);

  if(now && !was && isComplete(you, iso)) showComplete();

  try{ await api.saveDay(you, iso, state.data[you][iso]); state.online = true; }
  catch(_){ toast('Offline — not saved'); }
}

/*
 * Shared upload path for every slot. Swaps the row's camera for the new
 * thumbnail in place rather than re-rendering, so checking a task off and
 * adding its photo don't fight over the DOM.
 */
async function uploadFrom(input, prof, iso, slot){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  try{
    toast('Uploading');
    const blob = await compressImage(file);
    const b64 = await blobToBase64(blob);
    await api.uploadPhoto(prof, iso, slot, 'image/jpeg', b64);
    addPhotoLocal(prof, iso, slot);
    haptic(16);
    toast(slot === DAY_SLOT ? 'Frame logged' : `${slotLabel(slot)} photo added`);

    const row = screen().querySelector(`.task[data-row="${slotBase(slot)}"]`);
    // a multi task keeps its camera, so re-render instead of replacing it
    const label = MULTI_SLOTS.includes(slotBase(slot))
      ? null : row && row.querySelector('label.shot-btn');
    if(label){
      const btn = document.createElement('button');
      btn.className = 'shot-btn filled fresh';
      btn.dataset.openSlot = slot;
      btn.innerHTML = `<img src="${api.photoUrl(prof, iso, slot)}" alt="">`;
      btn.onclick = () => openDay(prof, iso);
      label.replaceWith(btn);
    } else {
      render();
    }
  }catch(_){ toast('Upload failed'); }
}

function refreshToday(){
  const you = me(), iso = todayISO();
  const n = doneCount(you, iso), done = n === TASKS.length;

  TASKS.forEach(t => {
    const s = document.querySelector(`[data-seg="${t.id}"]`);
    if(s) s.classList.toggle('on', !!entryOf(you,iso)[t.id]);
  });
  const st = document.querySelector('.hero-foot .state');
  if(st){ st.textContent = done ? 'Complete' : `${word(n)} of five`; st.classList.toggle('done', done); }
  const sv = document.getElementById('streakV');
  if(sv) sv.textContent = streak(you);
  const cd = document.getElementById('cdStat');
  if(cd){
    cd.classList.toggle('risk', !done && msToMidnight()/3600000 < 5);
    const k = cd.querySelector('.eyebrow');
    if(k) k.textContent = done ? 'Next day in' : 'Left today';
  }
}

function showComplete(){
  const ti = todayIndex(), you = me();
  const st = streak(you), total = totalComplete(you);
  const mile = MILES.find(m => m.d === total);
  const el = document.getElementById('done');
  el.setAttribute('data-who','you');
  el.innerHTML = `
    <div class="inner">
      <div class="eyebrow">Day</div>
      <div class="big num">${ti}</div>
      <div class="rule"></div>
      <div class="word">Complete</div>
      <div class="meta">${word(st)} consecutive${mile ? ' — ' + mile.nm : ''}</div>
    </div>`;
  el.classList.add('on');
  haptic([14,50,14]);
  const close = () => { el.style.opacity = '0'; setTimeout(() => { el.classList.remove('on'); el.style.opacity=''; }, 280); };
  el.onclick = close;
  clearTimeout(showComplete._t);
  showComplete._t = setTimeout(close, 1600);
}

async function sendKudos(to, iso, postEl, isDoubleTap){
  if(to === me()) return;
  const had = iGaveKudos(to, iso);
  if(isDoubleTap && had) return;   // double-tap only ever adds
  haptic(12);

  if(isDoubleTap){
    const s = document.createElement('div');
    s.className = 'stamp';
    s.textContent = 'KUDOS';
    postEl.appendChild(s);
    setTimeout(() => s.remove(), 920);
  }

  if(had) state.reactions = state.reactions.filter(r => !(r.to===to && r.date===iso && r.from===me()));
  else state.reactions.push({ from:me(), to, date:iso, emoji:KUDOS_TOKEN });
  paintKudos(postEl, to, iso);

  try{
    await api.react(me(), to, iso, KUDOS_TOKEN);
  }catch(_){
    if(had) state.reactions.push({ from:me(), to, date:iso, emoji:KUDOS_TOKEN });
    else state.reactions = state.reactions.filter(r => !(r.to===to && r.date===iso && r.from===me()));
    paintKudos(postEl, to, iso);
    toast('Kudos failed');
  }
}

function paintKudos(postEl, to, iso){
  const btn = postEl?.querySelector('.kudos');
  if(!btn) return;
  const c = kudosCount(to, iso), mine = iGaveKudos(to, iso);
  btn.classList.toggle('mine', mine);
  btn.innerHTML = `${mine ? 'Kudos given' : 'Give kudos'}${c ? `<span class="n">${c}</span>` : ''}`;
  btn.onclick = e => { e.stopPropagation(); sendKudos(to, iso, postEl, false); };
}

let cdT;
function startCountdown(){
  clearInterval(cdT);
  const tick = () => {
    const v = document.getElementById('cdV');
    if(!v){ clearInterval(cdT); return; }
    v.textContent = fmtLeft(msToMidnight());
  };
  tick();
  cdT = setInterval(tick, 1000);
}

/* ═══════════ sheets ═══════════ */
/*
 * Full-screen photo viewer. The collage answers "what did the day look like";
 * this answers "show me that one". It reuses the reel markup the feed used to
 * carry, so the swipe, pips and caption behave exactly as before — and the
 * double-tap kudos gesture moves here, since a tap on a tile now opens a photo
 * rather than counting toward a double-tap.
 */
function openViewer(p, iso, index){
  const slots = slotsFor(p, iso);
  if(!slots.length) return;
  const start = Math.max(0, Math.min(slots.length - 1, index || 0));
  const multi = slots.length > 1;
  const own = p === me();
  const root = document.getElementById('viewer');

  root.innerHTML = `
    <div class="viewer" data-who="${whoAttr(p)}">
      <div class="reel"${multi ? '' : ' data-single'}>
        ${slots.map(sl => `
          <div class="slide"><img src="${api.photoUrl(p, iso, sl)}" alt="${slotLabel(sl)}"></div>`).join('')}
      </div>
      <div class="viewer-shade"></div>
      <button class="icon-btn viewer-x" aria-label="Close">${ICON.close}</button>
      ${multi ? `<div class="pips">${slots.map((sl, i) =>
        `<i class="${i===start?'on':''}"></i>`).join('')}</div>` : ''}
      <div class="viewer-bot">
        <div class="slot-tag">${slotLabel(slots[start])}${
          multi ? ` <span class="of">${start+1}/${slots.length}</span>` : ''}</div>
        <div class="viewer-meta">${own ? 'You' : nameOf(p)} — ${fmtDate(iso)}</div>
      </div>
    </div>`;

  const view = root.firstElementChild;
  const reel = view.querySelector('.reel');
  // jump to the tapped photo before the first paint, so it never flashes #1
  reel.scrollLeft = start * (reel.clientWidth || window.innerWidth);
  requestAnimationFrame(() => root.classList.add('open'));
  wireReel(view, p, iso);

  view.querySelector('.viewer-x').onclick = closeViewer;
  if(!own){
    let last = 0;
    reel.addEventListener('click', () => {
      const now = Date.now();
      if(now - last < 320){ last = 0; sendKudos(p, iso, view, true); } else last = now;
    });
  }
}
function closeViewer(){
  const root = document.getElementById('viewer');
  root.classList.remove('open');
  setTimeout(() => { if(!root.classList.contains('open')) root.innerHTML = ''; }, 260);
}

function openSheet(html, onMount){
  const root = document.getElementById('sheets');
  root.innerHTML = `<div class="scrim"></div><div class="sheet">${html}</div>`;
  requestAnimationFrame(() => root.classList.add('open'));
  root.querySelector('.scrim').onclick = closeSheet;
  if(onMount) onMount(root.querySelector('.sheet'));
}
function closeSheet(){
  const root = document.getElementById('sheets');
  root.classList.remove('open');
  setTimeout(() => { if(!root.classList.contains('open')) root.innerHTML = ''; }, 320);
}

function openDay(prof, iso){
  const d = dayIndex(iso), mine = prof === me();

  const gallery = () => {
    const slots = slotsFor(prof, iso);
    if(!slots.length){
      return `<div class="shot-none">${mine ? 'No photos yet — all optional' : 'No photos this day'}</div>`;
    }
    return `<div class="sheet-shots">${slots.map(s => `
      <figure class="sheet-shot" data-slot="${s}">
        <img src="${api.photoUrl(prof, iso, s)}" alt="${slotLabel(s)}">
        <figcaption>
          <span>${slotLabel(s)}</span>
          ${mine ? `<button class="rm" data-del="${s}" aria-label="Remove">${ICON.close}</button>` : ''}
        </figcaption>
      </figure>`).join('')}</div>`;
  };

  openSheet(`
    <div data-who="${whoAttr(prof)}">
      <div class="sheet-head">
        <div>
          <div class="t num">Day ${d}</div>
          <div class="s">${fmtDate(iso)} — ${mine?'You':nameOf(prof)} — ${doneCount(prof,iso)}/${TASKS.length}</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>

      <div id="gallery">${gallery()}</div>

      ${mine ? `
        <label class="btn primary" id="frameLabel" style="cursor:pointer;margin-top:0">
          <span class="txt">${hasPhoto(prof, iso, DAY_SLOT) ? 'Replace progress frame' : 'Add progress frame'}</span>
          <input type="file" accept="image/*" data-sheet-shot="${DAY_SLOT}" hidden>
        </label>` : ''}

      <div class="tasks" style="margin-top:22px;border-top:none">
        ${TASKS.map(t => taskRow(prof, iso, t, mine)).join('')}
      </div>

      ${mine
        ? `<div class="note">Task photos are optional</div>`
        : `<div class="note">Read only — only ${nameOf(prof)} can check these</div>`}
    </div>`, sheet => {

    sheet.querySelector('#x').onclick = closeSheet;

    const repaint = () => {
      sheet.querySelector('#gallery').innerHTML = gallery();
      bindGallery();
      const s = sheet.querySelector('.sheet-head .s');
      if(s) s.textContent = `${fmtDate(iso)} — ${mine?'You':nameOf(prof)} — ${doneCount(prof,iso)}/${TASKS.length}`;
      const ft = sheet.querySelector('#frameLabel .txt');
      if(ft) ft.textContent = hasPhoto(prof, iso, DAY_SLOT) ? 'Replace progress frame' : 'Add progress frame';
    };

    function bindGallery(){
      if(!mine) return;
      sheet.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = async () => {
          const slot = b.dataset.del;
          if(!confirm(`Remove the ${slotLabel(slot).toLowerCase()} photo?`)) return;
          try{
            await api.deletePhoto(prof, iso, slot);
            removePhotoLocal(prof, iso, slot);
            toast('Photo removed');
            repaint();
            refreshSheetTaskShot(sheet, prof, iso, slot);
          }catch(_){ toast('Delete failed'); }
        };
      });
    }
    bindGallery();

    // the water row opens its tracker instead of toggling — readable either way,
    // so this is bound before the read-only bail-out
    sheet.querySelectorAll('[data-meter]').forEach(b => {
      b.onclick = () => { closeSheet(); setTimeout(() => openWater(prof, iso), 340); };
    });

    if(!mine) return;

    sheet.querySelectorAll('[data-task]').forEach(b => {
      b.onclick = async () => {
        const id = b.dataset.task;
        const row = b.closest('.task');
        seedDay(prof, iso);
        if(TASKS.find(t => t.id === id)?.meter){ openWater(prof, iso); return; }
        const v = !state.data[prof][iso][id];
        state.data[prof][iso][id] = v;
        row.classList.toggle('on', v);
        if(v){ row.classList.add('just'); setTimeout(()=>row.classList.remove('just'),320); }
        haptic(10);
        const s = sheet.querySelector('.sheet-head .s');
        if(s) s.textContent = `${fmtDate(iso)} — You — ${doneCount(prof,iso)}/${TASKS.length}`;
        try{ await api.saveDay(prof, iso, state.data[prof][iso]); }
        catch(_){ toast('Offline — not saved'); }
      };
    });

    // any file input in the sheet: the progress frame or a task slot
    const bindInputs = () => {
      sheet.querySelectorAll('[data-sheet-shot],[data-shot]').forEach(input => {
        input.onchange = async () => {
          const slot = input.dataset.sheetShot || newSlot(input.dataset.shot);
          const file = input.files && input.files[0];
          input.value = '';
          if(!file) return;
          try{
            toast('Uploading');
            const blob = await compressImage(file);
            const b64 = await blobToBase64(blob);
            await api.uploadPhoto(prof, iso, slot, 'image/jpeg', b64);
            addPhotoLocal(prof, iso, slot);
            haptic(16);
            toast(slot === DAY_SLOT ? 'Frame logged' : `${slotLabel(slot)} photo added`);
            repaint();
            refreshSheetTaskShot(sheet, prof, iso, slot);
            bindInputs();
          }catch(_){ toast('Upload failed'); }
        };
      });
    };
    bindInputs();

    // a filled thumbnail inside the sheet just scrolls up to the gallery
    sheet.querySelectorAll('[data-open-slot]').forEach(b => {
      b.onclick = () => sheet.scrollTo({ top:0, behavior:'smooth' });
    });
  });
}

/* Swap a sheet task row's camera/thumbnail after its photo changes. */
function refreshSheetTaskShot(sheet, prof, iso, slot){
  const row = sheet.querySelector(`.task[data-row="${slot}"]`);
  if(!row) return;
  const t = TASKS.find(x => x.id === slot);
  if(!t || !t.photo) return;
  const old = row.querySelector('.shot-btn');
  if(!old) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = taskRow(prof, iso, t, prof === me()).trim();
  const fresh = wrap.firstChild.querySelector('.shot-btn');
  if(fresh) old.replaceWith(fresh);
}

/* ── water tracker ── */
function openWater(prof, iso){
  const mine = prof === me();
  let editing = false;

  const body = () => {
    const oz = waterOz(prof, iso), pct = waterPct(prof, iso);
    const raw = waterPctRaw(prof, iso), over = waterOver(prof, iso);
    const left = Math.max(0, WATER_GOAL_OZ - oz);
    const log = waterLog(prof, iso);
    const list = vessels();
    return `
      <div class="wtr-read">
        <div class="wtr-big num">${oz}</div>
        <div class="wtr-unit">of ${WATER_GOAL_OZ} oz</div>
      </div>
      <div class="wtr-bar"><i style="width:${pct}%"></i></div>
      <div class="wtr-note">
        <span>${raw}%</span>
        <span>${left ? `${left} oz to go` : (over ? `${over} oz over` : 'Goal reached')}</span>
      </div>

      ${mine ? `
        <div class="wtr-head">
          <span class="eyebrow">Add</span>
          <button class="wtr-edit" id="vEdit">${editing ? 'Done' : 'Edit'}</button>
        </div>
        <div class="vessels">
          ${list.map((v, i) => `
            <button class="vessel" data-add="${v.oz}" ${editing?'disabled':''}>
              <span class="nm">${v.nm}</span>
              <span class="oz num">${v.oz} oz</span>
              ${editing ? `<span class="del" data-del-v="${i}">${ICON.close}</span>` : ''}
            </button>`).join('')}
        </div>
        ${editing ? `
          <div class="vnew">
            <input id="vName" type="text" placeholder="Name" maxlength="14">
            <input id="vOz" type="number" inputmode="numeric" placeholder="oz" min="1" max="512">
            <button class="vadd" id="vAdd">Add</button>
          </div>` : ''}
        ${log.length ? `<button class="btn" id="wUndo">Undo last — ${log[log.length-1]} oz</button>` : ''}
        <button class="btn ghost" id="wClear">Reset day</button>
      ` : `<div class="note">Read only — this is ${nameOf(prof)}'s day</div>`}
    `;
  };

  openSheet(`
    <div data-who="${whoAttr(prof)}">
      <div class="sheet-head">
        <div>
          <div class="t">Water</div>
          <div class="s">Day ${dayIndex(iso)} — ${mine?'You':nameOf(prof)}</div>
        </div>
        <button class="icon-btn" id="x">${ICON.close}</button>
      </div>
      <div id="wBody">${body()}</div>
    </div>`, sheet => {

    const bind = () => {
      sheet.querySelector('#x').onclick = closeSheet;
      if(!mine) return;

      sheet.querySelectorAll('[data-add]').forEach(b => {
        b.onclick = async () => {
          if(editing) return;
          await addWater(prof, iso, Number(b.dataset.add));
          b.classList.add('pulse');
          setTimeout(() => b.classList.remove('pulse'), 320);
          repaint();
        };
      });

      sheet.querySelectorAll('[data-del-v]').forEach(el => {
        el.onclick = ev => {
          ev.stopPropagation();
          const list = vessels();
          list.splice(Number(el.dataset.delV), 1);
          saveVessels(list);
          repaint();
        };
      });

      const eb = sheet.querySelector('#vEdit');
      if(eb) eb.onclick = () => { editing = !editing; repaint(); };

      const add = sheet.querySelector('#vAdd');
      if(add) add.onclick = () => {
        const nm = (sheet.querySelector('#vName').value || '').trim();
        const oz = Math.round(Number(sheet.querySelector('#vOz').value));
        if(!nm || !oz || oz < 1 || oz > 512){ toast('Name and size needed'); return; }
        saveVessels(vessels().concat({ nm, oz }));
        toast(`${nm} added`);
        repaint();
      };

      const un = sheet.querySelector('#wUndo');
      if(un) un.onclick = async () => { await undoWater(prof, iso); repaint(); };

      const cl = sheet.querySelector('#wClear');
      if(cl) cl.onclick = async () => {
        if(!waterOz(prof, iso)) return;
        if(!confirm('Reset today\'s water to zero?')) return;
        await setWater(prof, iso, 0, []);
        repaint();
      };
    };

    const repaint = () => {
      sheet.querySelector('#wBody').innerHTML = body();
      bind();
      refreshMeterRow(prof, iso);
    };

    bind();
  });
}

async function setWater(prof, iso, oz, log){
  seedDay(prof, iso);
  const entry = state.data[prof][iso];
  const was = isComplete(prof, iso);
  entry.waterOz = Math.max(0, Math.round(oz));
  entry.waterLog = log;
  entry.water = entry.waterOz >= WATER_GOAL_OZ;   // keep the boolean derived
  refreshToday();
  refreshMeterRow(prof, iso);
  if(!was && isComplete(prof, iso) && iso === todayISO() && prof === me()) showComplete();
  try{ await api.saveDay(prof, iso, entry); }
  catch(_){ toast('Offline — not saved'); }
}

async function addWater(prof, iso, oz){
  const before = waterOz(prof, iso);
  haptic(12);
  await setWater(prof, iso, before + oz, waterLog(prof, iso).concat(oz));
  const now = waterOz(prof, iso);
  if(before < WATER_GOAL_OZ && now >= WATER_GOAL_OZ) toast('Gallon done');
}

async function undoWater(prof, iso){
  const log = waterLog(prof, iso).slice();
  const last = log.pop();
  if(last === undefined) return;
  haptic(8);
  await setWater(prof, iso, waterOz(prof, iso) - last, log);
}

/* Update a meter row in place wherever it is on screen. */
function refreshMeterRow(prof, iso){
  document.querySelectorAll(`.task.meter[data-row="water"]`).forEach(row => {

    if(fill) fill.style.width = waterPct(prof, iso) + '%';
    const sub = row.querySelector('.sub');
    const oz = waterOz(prof, iso);
    if(sub) sub.textContent = oz ? `${oz} of ${WATER_GOAL_OZ} oz` : `${WATER_GOAL_OZ} oz — tap to log`;
    row.classList.toggle('on', !!entryOf(prof, iso).water);
  });
}

/* ═══════════ notifications ═══════════ */
/*
 * iOS only offers push to a PWA installed to the Home Screen, and only asks
 * for permission from a real tap — hence a button in Settings rather than a
 * prompt on load. It asks exactly once ever: a refusal can only be undone in
 * iOS Settings, so the copy has to say so.
 */
const pushSupported = () =>
  'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

// VAPID keys travel as base64url; PushManager wants raw bytes.
function urlB64ToBytes(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function currentSub(){
  if(!pushSupported()) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

async function enableAlerts(){
  const r = await fetch('/api/push');
  const cfg = await r.json();
  if(!cfg.enabled || !cfg.publicKey) throw new Error('Notifications are not set up on the server');

  const permission = await Notification.requestPermission();
  if(permission !== 'granted') throw new Error(
    permission === 'denied' ? 'Blocked — turn it back on in iOS Settings' : 'Not allowed');

  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlB64ToBytes(cfg.publicKey)
  });
  const save = await fetch('/api/push', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ profileId: me(), subscription: sub.toJSON() })
  });
  if(!save.ok) throw new Error('Could not register this phone');
}

async function disableAlerts(){
  const sub = await currentSub();
  if(!sub) return;
  await fetch(`/api/push?endpoint=${encodeURIComponent(sub.endpoint)}`, { method:'DELETE' })
    .catch(() => {});
  await sub.unsubscribe();
}

async function wireAlerts(btn){
  if(!btn) return;
  const paint = (label, disabled) => {
    btn.textContent = label;
    btn.disabled = !!disabled;
  };

  if(!pushSupported()){
    // Safari only exposes PushManager to an installed app, so this is the
    // state you see in a browser tab rather than from the Home Screen.
    paint('Notifications — add to Home Screen first', true);
    return;
  }
  if(Notification.permission === 'denied'){
    paint('Notifications blocked — allow in iOS Settings', true);
    return;
  }

  const on = !!(await currentSub());
  paint(on ? 'Notifications on — tap to turn off' : 'Turn on notifications');

  btn.onclick = async () => {
    paint('Working…', true);
    try{
      if(await currentSub()){ await disableAlerts(); toast('Notifications off'); }
      else { await enableAlerts(); toast('Notifications on'); }
    }catch(err){
      toast(err.message || 'Could not change notifications');
    }
    wireAlerts(btn);
  };
}

async function confirmReset(){
  if(!confirm('Start a brand new 75 days?\n\nThis erases all tasks, frames and kudos for BOTH of you. It cannot be undone.')) return;
  try{
    const sd = todayISO();
    await api.reset(sd);
    state.startDate = sd;
    state.data = { sachin:{}, aarya:{} };
    state.photos = { sachin:{}, aarya:{} };
    state.reactions = [];
    state.tab = 'today';
    closeSheet(); render();
    toast('New 75 started');
  }catch(_){ toast('Reset failed'); }
}

/* ═══════════ boot ═══════════ */
async function loadState(){
  try{
    const r = await api.getState();
    state.startDate = r.startDate;
    state.data = r.data || { sachin:{}, aarya:{} };
    state.photos = knownPhotos(r.photos);
    state.online = true;
  }catch(err){
    state.online = false;
    state.startDate = state.startDate || todayISO();
    toast(err.message || 'Server unreachable');
  }
  try{
    const r = await api.getReactions();
    state.reactions = r.reactions || [];
  }catch(_){ state.reactions = []; }
}

/*
 * Opening the app on a given day is the check-in that starts the auto tasks
 * ticked. Persist it so your partner's phone sees the same day you do —
 * without a write, they'd read 0/5 while you read 1/5.
 *
 * Skipped while offline: seeding locally against a state we couldn't load
 * would invent a day record that never reaches the server.
 */
async function checkIn(){
  const you = me();
  if(!you || !state.online) return;
  const iso = todayISO();
  if(!seedDay(you, iso)) return;
  try{ await api.saveDay(you, iso, state.data[you][iso]); }
  catch(_){ state.online = false; }
}

let lastDay = null;
document.addEventListener('visibilitychange', async () => {
  if(document.hidden) return;
  await loadState();
  await checkIn();
  if(lastDay !== todayISO()){ lastDay = todayISO(); state.tab = 'today'; }
  render();
});

(async function init(){
  await loadState();
  await checkIn();
  lastDay = todayISO();
  render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  // a device follows whoever is tracking on it, so re-register after a switch
  if(pushSupported()) currentSub().then(sub => {
    if(!sub || !me()) return;
    fetch('/api/push', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ profileId: me(), subscription: sub.toJSON() }) }).catch(() => {});
  });
})();
</script>
